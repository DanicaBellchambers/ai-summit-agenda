"track": "Data Excellence", "description": "• Discover how governance frameworks can be reimagined to empower engineers while maintaining control and compliance.\n• Examine how automated processes and well-designed guardrails helped maintain both control and engineering velocity.\n• Explore the balance achieved between maintaining control and offering flexibility to engineers.", "speakers": [{"name": "Madara Premawardhana", "org": "University of Buckingham", "photo": "https://static.swapcard.com/public/images/6818e71e0b8048d08c3c5e11c62136c6.png"}, {"name": "Longji Vwamhi", "org": "Marks and Spencer Plc", "photo": "https://static.swapcard.com/public/images/065e99e1e4db486b91b251961891de32.png"}, {"name": "Azin Shahidi", "org": "Independent AI Transformation Adviser", "photo": "https://static.swapcard.com/public/images/a6ec43f29eb145e888a084c9bd05d88a.png"}, {"name": "Matt Henderson", "org": "Coral", "photo": "https://static.swapcard.com/public/images/80a0f43ee89046499231ff033e3465b6.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTM1NA==", "title": "Panel: Vibe Coding Is Here – What Changes When Everyone Can Ship Software?", "start": "2026-06-10T13:35:00+01:00", "end": "2026-06-10T14:15:00+01:00", "track": "Next Generation", "description": "• AI coding tools are changing who can build and how quickly software is delivered.\n• The upside is speed and creativity, but the risks include security, quality, and ownership.\n• Learn how engineering leaders are redesigning workflows and guardrails for AI-built code.", "speakers": [{"name": "Stephen Crombie", "org": "ING Bank", "photo": "https://static.swapcard.com/public/images/8b9348f851924e839bfa706b30b3eaeb.png"}, {"name": "Prashant Singh", "org": "Deutsche Telekom (Telekom Strategy Consulting)", "photo": "https://static.swapcard.com/public/images/06fe152c6da142a18ee764e8901e1f57.jpeg"}, {"name": "James Lloyd", "org": "PROIA.AI", "photo": "https://static.swapcard.com/public/images/2ccb655a1e1f4423b2a5e06b7040afe1.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTMxNw==", "title": "Panel: Do Investors Back Teams or Technology?", "start": "2026-06-10T13:35:00+01:00", "end": "2026-06-10T14:15:00+01:00", "track": "Start-up & Investor", "description": "Panellists discuss whether investors prioritise strong leadership and execution skills over innovative technology. In a blind demo, which would get funded – the perfect prototype or the founder with a vision? Discussions highlight how early technical credibility versus a strong founder influences funding decisions. The panel examines cases where a brilliant product needs a strong founder and when a founder’s vision can outweigh weak technology.", "speakers": [{"name": "Matthew Sinclair", "org": "Geodica Ltd", "photo": "https://static.swapcard.com/public/images/6d77ff2149944313aec3299d0a9a93ef.png"}, {"name": "Alpesh Doshi", "org": "Redcliffe Capital", "photo": "https://static.swapcard.com/public/images/1c0e9688bf304521ae759c4e87728549.jpeg"}, {"name": "Roberto Bonanzinga", "org": "InReach Ventures", "photo": "https://static.swapcard.com/public/images/fbad55e697044e94a2c4c1f67d5b6338.png"}, {"name": "DC Cahalane", "org": "SVV (Sure Valley Ventures)", "photo": "https://static.swapcard.com/public/images/92077af2810048189cf7973a0f4f2454.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ1NzA1Mw==", "title": "The Price of Intelligence", "start": "2026-06-10T13:40:00+01:00", "end": "2026-06-10T14:10:00+01:00", "track": "VisionAIres", "description": "Reveal how inference, agents, and real-time AI can silently drive costs beyond expectations.\n\nShow how top enterprises plan, forecast, and govern AI spend as usage – and ambition – scale.\n\nLearn to distinguish when automation truly grows margins – and when it quietly erodes them.", "speakers": [{"name": "Natalia Konstantinova", "org": "Natwest", "photo": "https://static.swapcard.com/public/images/9c99c4b3986c4dd086b0a4ebfcb6d216.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ2MDExNg==", "title": "The Breach Lab: AI Security Challenge", "start": "2026-06-10T14:00:00+01:00", "end": "2026-06-10T15:00:00+01:00", "track": "Challenge Labs", "description": "An immersive, high-energy tabletop exercise where cybersecurity professionals form cross-functional teams to investigate and respond to a live AI-driven breach scenario. Participants collaborate under time pressure to analyze threats, develop mitigation strategies, and present their solutions to expert judges. This interactive format transforms passive learning into active problem-solving, delivering networking, skill-building, and real-world readiness in one dynamic session.", "speakers": [{"name": "Francesco Leofante", "org": "Imperial College London", "photo": "https://static.swapcard.com/public/images/91b97d8e53b740de8ad20730973d378d.jpeg"}, {"name": "Yvette Schmitter", "org": "Fusion Collective", "photo": "https://static.swapcard.com/public/images/63ed09c4e51546cea27c5c745f56d7c4.png"}]}, {"id": "UGxhbm5pbmdfNDQzMzEwMA==", "title": "From AI Prototypes to Production: How to evaluate, monitor, and scale AI systems that actually work", "start": "2026-06-10T14:00:00+01:00", "end": "2026-06-10T14:50:00+01:00", "track": "Masterclass", "description": "This masterclass gives leaders and practitioners a concrete framework for crossing that gap, with particular focus on the LLM era where traditional ML practices need rethinking.\nHigh-Level Learning Goals/ Take away for attendees: \n• A production-readiness evaluation framework you can apply immediately A structured checklist and decision tree for assessing whether an AI system — whether traditional ML or LLM-based — is ready for production. Participants leave knowing exactly what to test, what metrics to track, and what \"good enough\" looks like before pressing deploy.\n• A monitoring blueprint that prevents silent AI failures A reusable architecture for catching model degradation, data drift, and quality issues before they impact the business. This includes concrete guidance on what to monitor, how to set meaningful alert thresholds, and when to retrain vs roll back— tailored to both classical ML and the newer challenges of LLM-powered systems.\n• A scaling playbook drawn from 50+ real-world AI deployments The operational patterns that separate organisations stuck on one pilot from those running AI across multiple business functions — covering team design, tooling standardisation, documentation practices, and governance checkpoints that make each subsequent deployment faster and more reliable.", "speakers": [{"name": "Laure Faretti", "org": "Nebius Academy", "photo": "https://static.swapcard.com/public/images/285874fc2a6b416280874bfdb2f9eafc.jpeg"}, {"name": "Denis Volkhonskiy", "org": "Nebius", "photo": "https://static.swapcard.com/public/images/9917271e83cf41b59e24b06bca7bda3c.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ1NzY1Ng==", "title": "Short Break", "start": "2026-06-10T14:15:00+01:00", "end": "2026-06-10T14:25:00+01:00", "track": "AI Cybersecurity", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTIxOA==", "title": "Short Break", "start": "2026-06-10T14:15:00+01:00", "end": "2026-06-10T14:25:00+01:00", "track": "Applied AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYzNg==", "title": "Short Break", "start": "2026-06-10T14:15:00+01:00", "end": "2026-06-10T14:25:00+01:00", "track": "Beyond AI at Scale", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzY0NA==", "title": "Short Break", "start": "2026-06-10T14:15:00+01:00", "end": "2026-06-10T14:25:00+01:00", "track": "Creative AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ2MjU4MQ==", "title": "Short Break", "start": "2026-06-10T14:15:00+01:00", "end": "2026-06-10T14:25:00+01:00", "track": "Data Excellence", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzY0Mg==", "title": "Short Break", "start": "2026-06-10T14:15:00+01:00", "end": "2026-06-10T14:25:00+01:00", "track": "Next Generation", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTMyNQ==", "title": "Harnessing AI to Transform Patient Outcomes", "start": "2026-06-10T14:25:00+01:00", "end": "2026-06-10T14:50:00+01:00", "track": "Headliners", "description": "Artificial intelligence is reshaping how medicines are discovered, developed and delivered. At AstraZeneca, we are embedding AI at scale across our value chain to accelerate innovation, enhance decision-making, and improve patient outcomes. In this session, our Chief Digital, Data and AI Officer will outline how AI is powering AZ Ambition 2030 - delivering 20 new medicines and transforming the future of healthcare.", "speakers": [{"name": "Anne-Claire Gerbaldi", "org": "AstraZeneca", "photo": "https://static.swapcard.com/public/images/47772180e43540518395a5c937bf6a6b.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTQwOA==", "title": "Defending AI Against Adversarial Threats", "start": "2026-06-10T14:25:00+01:00", "end": "2026-06-10T14:50:00+01:00", "track": "AI Cybersecurity", "description": "• Understand how attackers compromise AI systems through data poisoning, evasion, and model extraction, affecting their accuracy and trustworthiness.\n• Explore defensive strategies like adversarial training, resilient architectures, and red-team testing to improve protection.\n• Get practical advice on adding adversarial-resilience assessments to MLOps pipelines to ensure models remain secure, stable, and reliable at an enterprise level.", "speakers": [{"name": "Surinder Lall", "org": "DMG MEDIA", "photo": "https://static.swapcard.com/public/images/c8e7940b6dd0458ebd39bb0a3f4ead15.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ0Mjg0NA==", "title": "Building Confidence in AI: How Live Testing Can Unlock Benefits for UK Financial Markets and Consumers", "start": "2026-06-10T14:25:00+01:00", "end": "2026-06-10T14:50:00+01:00", "track": "Applied AI", "description": "", "speakers": [{"name": "Laura Contin", "org": "Monzo", "photo": "https://static.swapcard.com/public/images/ed63f0e119c840b1a887e3751b2a1115.jpeg"}, {"name": "David Sully", "org": "Advai", "photo": "https://static.swapcard.com/public/images/9f5d0dc5aeb74a2784a87d63314437a8.png"}, {"name": "Edmund Towers", "org": "Financial Conduct Authority", "photo": "https://static.swapcard.com/public/images/18067a6a6d0b41ffaf9c86e0439f436b.png"}, {"name": "Paul Dongha", "org": "NatWest Bank", "photo": "https://static.swapcard.com/public/images/702766e7f5a046a3b756d8972cc65c9a.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTIyNA==", "title": "ROI Revolution: Strategic AI Investments for Scale", "start": "2026-06-10T14:25:00+01:00", "end": "2026-06-10T14:50:00+01:00", "track": "Beyond AI at Scale", "description": "• Unlock insights into prioritising AI investments using evidence-based frameworks that balance cost, impact, and scalability.\n• Understand how to assess emerging technologies by mapping ROI to architectural readiness and long-term value creation.\n• Learn from case studies that demonstrate how strategic portfolio management accelerates enterprise-scale AI success.", "speakers": [{"name": "Simon Ellis", "org": "Pets at Home", "photo": "https://static.swapcard.com/public/images/ec99d089ac8c48a68fe4d5485b9d0b3f.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTQyMQ==", "title": "Why Trust Comes Before AI: Building a Million Member Marketplace Through Human Insight", "start": "2026-06-10T14:25:00+01:00", "end": "2026-06-10T14:50:00+01:00", "track": "Creative AI", "description": "• Discover how to build a high-trust, hyper-local marketplace by understanding real human behaviour and connection before introducing AI.\n• Explore the manual validation techniques—hand-matching early users, neighbourhood research, and launching with a prototype—that shaped the product’s foundations.\n• Explore a real-world case study of how AI is used across BorrowMyDoggy—from marketing and storytelling to product, operations, and support—enhancing workflows while keeping human trust at the centre.", "speakers": [{"name": "Rikke Rosenlund", "org": "BorrowMyDoggy", "photo": "https://static.swapcard.com/public/images/b316ef91a7d1437b92bb08ea2b794bf7.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQzMzA3MQ==", "title": "Behavioural AI: The Antidote to the Planning Fallacy", "start": "2026-06-10T14:25:00+01:00", "end": "2026-06-10T14:50:00+01:00", "track": "Impact Arena", "description": "Multinational LMS rollout across ten countries and three continents for a large telecom corporation—22,000 employees, one platform, one year.Explores why project plans consistently fail to surface predictable risks and how Behavioural AI can help project managers apply the Outside View before committing to a timeline. The project was recognized with a Brandon Hall Group Bronze Award in 2019.The stories in the talk are real, the failures were findable, and the three questions left for the audience are immediately applicable.", "speakers": [{"name": "Anastasia Kalmykova", "org": "iForce Connect", "photo": "https://static.swapcard.com/public/images/22a5712829d045dc9c08ddeb718342b2.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTE1MQ==", "title": "Grounding | Addressing Assumption Drift and Context Loss in Data-Driven Decisions", "start": "2026-06-10T14:25:00+01:00", "end": "2026-06-10T14:50:00+01:00", "track": "Data Excellence", "description": "Discover how evolving business definitions, user behaviour, and upstream systems can subtly change what data represents, when pipelines and metrics appear stable.\nExamine how practices like feature reuse, embeddings, and prompt iteration can accelerate context loss over time.\nLearn actionable strategies to uncover assumption drift and meaning mismatches that go beyond traditional data quality checks.", "speakers": [{"name": "Yagyansh Bagri", "org": "NHS", "photo": "https://static.swapcard.com/public/images/31fe14dacd78437baf0c0669c114b588.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTQzMQ==", "title": "Unlocking the Future of F1 Performance with Atlassian and Williams F1 Team", "start": "2026-06-10T14:25:00+01:00", "end": "2026-06-10T14:50:00+01:00", "track": "Next Generation", "description": "Motorsport has always pushed the limits of innovation – and AI is set to drive one of its next great leaps. \nIn this session, Atlassian Williams F1 Team’s Ben Buckley will explore how data, automation, and intelligent systems will shape a faster future for motorsport in 2026 and beyond.", "speakers": [{"name": "Ben Buckley", "org": "Atlassian Williams F1 Team", "photo": "https://static.swapcard.com/public/images/78f41d52592d4caa9f835b9b99418b38.jpeg"}, {"name": "Dr Maha Hosain Aziz", "org": "NYU & The Digital Economist", "photo": "https://static.swapcard.com/public/images/84dcf2c45a0c492b9869ab9cc3208d5b.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTI4NA==", "title": "AI Alliances: Start-ups, VCs, and Enterprises", "start": "2026-06-10T14:25:00+01:00", "end": "2026-06-10T14:50:00+01:00", "track": "Start-up & Investor", "description": "This session explores how start-ups can scale within enterprise environments, with venture capitalists facilitating collaborations. Learn strategies to build trust with corporate stakeholders, align solutions with business priorities, and demonstrate value early to drive adoption. Panellists will address challenges in enterprise-start-up partnerships, including governance, compliance, and strategic fit, while sharing how investors can de-risk engagements for meaningful impact.", "speakers": [{"name": "Martin Tantow", "org": "Pegasus Tech Ventures", "photo": "https://static.swapcard.com/public/images/8f98ba9235ad4c2ea4a4bbe16dcaa0bb.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ1NzY1NQ==", "title": "Short Break", "start": "2026-06-10T14:50:00+01:00", "end": "2026-06-10T15:00:00+01:00", "track": "AI Cybersecurity", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYxOA==", "title": "Short Break", "start": "2026-06-10T14:50:00+01:00", "end": "2026-06-10T15:00:00+01:00", "track": "Beyond AI at Scale", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYzOQ==", "title": "Short Break", "start": "2026-06-10T14:50:00+01:00", "end": "2026-06-10T15:00:00+01:00", "track": "Creative AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ2MjU4MA==", "title": "Short Break", "start": "2026-06-10T14:50:00+01:00", "end": "2026-06-10T15:00:00+01:00", "track": "Data Excellence", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYxNw==", "title": "Short Break", "start": "2026-06-10T14:50:00+01:00", "end": "2026-06-10T15:00:00+01:00", "track": "Next Generation", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQxNQ==", "title": "Short Break", "start": "2026-06-10T14:50:00+01:00", "end": "2026-06-10T15:00:00+01:00", "track": "Applied AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ2MTY2Mg==", "title": "Navigating Digital Sovereignty in the UK: Enabling Distributed AI Without Compromise", "start": "2026-06-10T15:00:00+01:00", "end": "2026-06-10T15:25:00+01:00", "track": "Headliners", "description": "Join us for an insightful session exploring the evolving landscape of AI in the UK. Leading experts and decision-makers will discuss how organisations are scaling their AI initiatives while maintaining strategic control over data, models, and operations.\nWe’ll delve into the concept of digital sovereignty within the UK’s AI ecosystem, examining key factors such as workload placement for compliance and security, governance models to ensure transparency and auditability, and strategies to reduce dependency and mitigate security risks.\nAttendees will gain valuable insights into balancing security, compliance, and flexibility to foster innovation and sustainable growth in AI.", "speakers": [{"name": "Matt Harris", "org": "HPE", "photo": "https://static.swapcard.com/public/images/521fce43afa4407680c54741d6d5999a.jpeg"}, {"name": "Anthony Hills", "org": "NVIDIA", "photo": "https://static.swapcard.com/public/images/59bdacf3f520480c8257eb6a2b191bf3.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTI1Nw==", "title": "Presentation by Senior Representative from Snyk Ltd", "start": "2026-06-10T15:00:00+01:00", "end": "2026-06-10T15:25:00+01:00", "track": "AI Cybersecurity", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQzNDEwMA==", "title": "Presentation by Senior Representative from EY", "start": "2026-06-10T15:00:00+01:00", "end": "2026-06-10T15:25:00+01:00", "track": "Beyond AI at Scale", "description": "", "speakers": [{"name": "Saby Roy", "org": "EY", "photo": "https://static.swapcard.com/public/images/d7e20e772f3a4a3bbf7b42b9fa963d8b.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ0OTEzOQ==", "title": "Crossing the River - Why AI in Animation Is an Integration Problem", "start": "2026-06-10T15:00:00+01:00", "end": "2026-06-10T15:25:00+01:00", "track": "Creative AI", "description": "• The real AI-in-animation story isn't replacement or refusal - it's integration, and it's happening quietly inside the tools studios already use, one pipeline at a time.\n• The studios getting this right are doing the unglamorous work of meeting artists where they already are: taking existing keyframes, boards, and motion data as input, and fitting into existing approval chains rather than around them.\n• The winning posture is controllable and directable, not magically waiting for the best model to release - the director stays the director, the model is a rendering target, and provenance and auditability are designed in from day one, not retrofitted.", "speakers": [{"name": "Douglas McGinness III", "org": "Animated Company", "photo": "https://static.swapcard.com/public/images/fccc9e50ac9c40c08bb02de4dd22a2e9.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQzMzEwNw==", "title": "From AI Ready to AI Ruled: Designing Operating Models for Autonomous Workflows", "start": "2026-06-10T15:00:00+01:00", "end": "2026-06-10T15:50:00+01:00", "track": "Masterclass", "description": "Discover how to craft enterprise operating models that enable autonomous workflows, multi-agent coordination, and ongoing governance. This masterclass covers AI-native structures, safety and accountability measures, and practical methods for integrating autonomy within complex B2B settings.\nWhat You’ll Learn: \n• Guidelines for creating operating models that support secure, scalable autonomous workflows.\n• Frameworks for coordinating multi-agent systems across various business functions.\n• Governance strategies that balance innovation, compliance, and risk management.\n• Cultural and organisational changes required to facilitate AI-native operations. \nKey Takeaways: \n• A roadmap for evolving from AI-ready to AI-native, culminating in AI-led operations.\n• Practical templates for governance, orchestration, and escalation of autonomy.\n• Clear guidance on aligning operational models with regulatory standards and enterprise risk management.\n• A maturity roadmap for expanding autonomous systems across B2B processes. \nWhy This Matters: \nAs enterprises adopt autonomous agents and multi-agent workflows, traditional operating models break down. Organisations must redesign how decisions are made, governed, and monitored. Building AI native operating models ensures safety, accountability, and long-term competitiveness as autonomy becomes core to business operations. \nWho Should Attend: \n• CTOs, CIOs, CDOs, COOs\n• Enterprise and solution architects\n• Heads of AI, Data Science, and Automation\n• Business transformation, operations, and governance leaders\n• Senior leaders preparing for multi-agent, AI-native enterprise systems", "speakers": [{"name": "Tharun Loknath", "org": "Just group", "photo": "https://static.swapcard.com/public/images/db0c9759af77448fad86b26e13229785.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQzNDA5Mw==", "title": "The Rise of AI Workers", "start": "2026-06-10T15:00:00+01:00", "end": "2026-06-10T15:25:00+01:00", "track": "Next Generation", "description": "The nature of work is changing as a new digital workforce emerges with the widespread adoption of AI agents. This session will help you navigate the impact and implications of employing \"AI workers\" tailored to your specific business:\n\n• Explore how AI agents can function as digital colleagues, enhancing productivity and supporting smarter decision-making.\n• Appropriate expectations for the cost savings, growth, and new capabilities AI agents can provide, and how to manage a hybrid workforce.\n• Learn how enterprises can transition from strategy to large-scale AI adoption efficiently, securely, and responsibly.", "speakers": [{"name": "Peter Guagenti", "org": "EverWorker", "photo": "https://static.swapcard.com/public/images/9e949e296cce4d8a99962669b90ab662.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTIzMw==", "title": "Panel: From Assisted to Independent – Measuring Start-up Maturity", "start": "2026-06-10T15:00:00+01:00", "end": "2026-06-10T15:40:00+01:00", "track": "Start-up & Investor", "description": "Discover which metrics truly reveal readiness beyond the pilot phase.\nExplore the moment an AI start-up transitions from assisted to genuinely independent – and what that signifies for funding and scaling.\nShould investors extend support programmes indefinitely, or let start-ups go once they achieve self-sufficiency?", "speakers": [{"name": "Pratik Verma", "org": "Okahu", "photo": "https://static.swapcard.com/public/images/04dbb8e05b204391aa4120b5c496ae75.jpeg"}, {"name": "Aya Atassi", "org": "Click Ink Media", "photo": "https://static.swapcard.com/public/images/8bdf382dd8734b94ac5f0f7328bada27.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ1ODgyNw==", "title": "Decision Fatigue in the C-Suite", "start": "2026-06-10T15:00:00+01:00", "end": "2026-06-10T15:30:00+01:00", "track": "VisionAIres", "description": "As AI complexity grows, boards need to evolve processes and mindsets to prevent strategic paralysis.\n\nWhich AI initiatives truly demand board-level attention, and which can be delegated safely to technical teams?\n\nWhat reporting and insight structures empower executives to act with confidence, not just react?\n\nExecutives must foster a culture where high-stakes AI decisions are made decisively under uncertainty, without fear of blame.", "speakers": [{"name": "Indhira Mani", "org": "Intact Insurance", "photo": "https://static.swapcard.com/public/images/3482f72a54ac4d1d824f485251f45c9e.png"}, {"name": "Alex Jardine", "org": "Sainsbury’s", "photo": "https://static.swapcard.com/public/images/de6d643bb5d042d6bb880bbf414931e5.jpeg"}, {"name": "Jonathan Davis", "org": "Zurich Insurance", "photo": "https://static.swapcard.com/public/images/536d4a6f279b4ce8962384a210abc389.jpeg"}, {"name": "George McCrea", "org": "The Crown Estate", "photo": "https://static.swapcard.com/public/images/50f823c628c242abbcc653241d160b79.jpeg"}, {"name": "David Reed", "org": "DataIQ", "photo": "https://static.swapcard.com/public/images/78d01bc7daf042448c39bee6b1f45dc7.png"}]}, {"id": "UGxhbm5pbmdfNDQzMzA2OA==", "title": "From Islands to Platforms: Integration Trends", "start": "2026-06-10T15:15:00+01:00", "end": "2026-06-10T15:40:00+01:00", "track": "Impact Arena", "description": "A strategic overview of how UK enterprises are shifting from fragmented systems to unified platform architectures. Covers integration blueprints, API-centric operating models, and the organisational change required to move from siloed tech stacks to enterprise-wide digital platforms.", "speakers": [{"name": "Doychin Sakutov", "org": "Virgin Media O2", "photo": "https://static.swapcard.com/public/images/b90a26f6199744268c95be877f5fe152.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQzMzA5NA==", "title": "Legacy System Modernisation with AI-Assisted Refactoring", "start": "2026-06-10T15:15:00+01:00", "end": "2026-06-10T15:40:00+01:00", "track": "Impact Arena", "description": "A practical look at how large organisations accelerate application and mainframe modernisation using AI‑powered code conversion, dependency mapping, and automated test generation. Shows before/after timelines, cost avoidance, and risk reduction.", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzY2MA==", "title": "Short Break", "start": "2026-06-10T15:25:00+01:00", "end": "2026-06-10T15:35:00+01:00", "track": "AI Cybersecurity", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTM5OQ==", "title": "Short Break", "start": "2026-06-10T15:25:00+01:00", "end": "2026-06-10T15:35:00+01:00", "track": "Applied AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYyMg==", "title": "Short Break", "start": "2026-06-10T15:25:00+01:00", "end": "2026-06-10T15:35:00+01:00", "track": "Beyond AI at Scale", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYxNg==", "title": "Short Break", "start": "2026-06-10T15:25:00+01:00", "end": "2026-06-10T15:35:00+01:00", "track": "Creative AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTM0NA==", "title": "Short Break", "start": "2026-06-10T15:25:00+01:00", "end": "2026-06-10T15:35:00+01:00", "track": "Data Excellence", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQ0NQ==", "title": "Short Break", "start": "2026-06-10T15:25:00+01:00", "end": "2026-06-10T15:35:00+01:00", "track": "Next Generation", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ2MjI5NA==", "title": "Presented by Sap: AI Agent Discovery Workshop", "start": "2026-06-10T15:30:00+01:00", "end": "2026-06-10T16:30:00+01:00", "track": "Challenge Labs", "description": "AI agents are reshaping how organisations work – reasoning through decisions, coordinating across systems, and acting autonomously on complex tasks. The question isn’t whether they’ll change your business, but where to start and how to do it well.\n\nJoin SAP for a hands on workshop to uncover the agentic AI opportunities with the greatest potential in your organisation and design your own enterprise scale agent concept from the ground up. You’ll leave with a concrete blueprint for a high value agent use case, and the clarity and next steps to move it forward.", "speakers": [{"name": "Sam Renshaw", "org": "SAP", "photo": "https://static.swapcard.com/public/images/8b1097b4fe8e4d569ef74128fa13de07.jpeg"}, {"name": "Manzar Haq", "org": "SAP", "photo": "https://static.swapcard.com/public/images/b156dcd263f948b2b67f1450c2e8ca6c.jpeg"}, {"name": "Sonia Nash", "org": "SAP", "photo": "https://static.swapcard.com/public/images/8e021abb76104e07b46d25dfd92ee1e1.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ2MjI4OA==", "title": "Join SAP in the Challenge Lab Workshop Room: AI Agent Discovery Workshop", "start": "2026-06-10T15:30:00+01:00", "end": "2026-06-10T16:30:00+01:00", "track": "VisionAIres", "description": "Please join SAP in the Challenge Labs room to discuss:\nAI agents are reshaping how organisations work – reasoning through decisions, coordinating across systems, and acting autonomously on complex tasks. The question isn’t whether they’ll change your business, but where to start and how to do it well.\n\nJoin SAP for a hands on workshop to uncover the agentic AI opportunities with the greatest potential in your organisation and design your own enterprise scale agent concept from the ground up. You’ll leave with a concrete blueprint for a high value agent use case, and the clarity and next steps to move it forward.", "speakers": [{"name": "Sam Renshaw", "org": "SAP", "photo": "https://static.swapcard.com/public/images/8b1097b4fe8e4d569ef74128fa13de07.jpeg"}, {"name": "Sonia Nash", "org": "SAP", "photo": "https://static.swapcard.com/public/images/8e021abb76104e07b46d25dfd92ee1e1.jpeg"}, {"name": "Manzar Haq", "org": "SAP", "photo": "https://static.swapcard.com/public/images/b156dcd263f948b2b67f1450c2e8ca6c.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTQyOQ==", "title": "Humans at the Helm: Leading Agentic AI in the Enterprise", "start": "2026-06-10T15:35:00+01:00", "end": "2026-06-10T16:15:00+01:00", "track": "Headliners", "description": "By 2026, AI agents will make more enterprise decisions than ever, but the real advantage will belong to the humans guiding them.\nThis session explores the rise of 'agent controllers' – humans at the centre of AI workflows, shaping autonomous systems to drive efficiency, innovation, and value while maintaining trust and accountability.\nThis panel will examine specific strategies and best practices organisations can adopt to ensure humans remain effectively in control of AI systems while maximising their value and minimising risks.", "speakers": [{"name": "Mohsen Ghasempour", "org": "Kingfisher", "photo": "https://static.swapcard.com/public/images/0bd95b5ad3944084adca5ae98dec3918.png"}, {"name": "Sebastian Weir", "org": "IBM", "photo": "https://static.swapcard.com/public/images/1e972a5901944bd5ad9ec04910ae95d6.png"}, {"name": "Angela Read Downes", "org": "NiCE", "photo": "https://static.swapcard.com/public/images/6c7c7714a70c4e2ab5a8c12e908c01f1.jpeg"}, {"name": "Michael Jacobides", "org": "London Business School", "photo": "https://static.swapcard.com/public/images/35d5465ef63a482395b8692037b7aa7d.jpeg"}, {"name": "David Rhodes", "org": "Sky News", "photo": "https://static.swapcard.com/public/images/964a2131481f45ad80152d5641891020.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTIzNQ==", "title": "Panel Debate: Intelligence vs. Intuition: The Future of Cyber Defence", "start": "2026-06-10T15:35:00+01:00", "end": "2026-06-10T16:15:00+01:00", "track": "AI Cybersecurity", "description": "• How can we effectively identify the specific strengths and weaknesses of AI in cybersecurity, and what are the practical implications?\n• Why does human oversight remain essential, and how does human judgment complement AI capabilities?\n• What are the defining traits of the future hybrid cybersecurity model, and how might these systems evolve to enhance security?", "speakers": [{"name": "Wendy Ng", "org": "Marks and Spencer", "photo": "https://static.swapcard.com/public/images/457de32c927d43bbbde45e4378435312.jpeg"}, {"name": "Nasser Arif", "org": "London North West University Healthcare NHS Trust & The Hillingdon Hospitals NHS Foundation Trust", "photo": "https://static.swapcard.com/public/images/f690983ffaca4e77a2a6f39162710c38.jpeg"}, {"name": "Katie Paxton-Fear", "org": "Manchester Metropolitan University", "photo": "https://static.swapcard.com/public/images/fe3da2b219374570847f3323e1fda039.png"}, {"name": "Lawrence Ampofo", "org": "Vodafone", "photo": "https://cdn-api.swapcard.com/public/images/8f9d8e75d4914600b8373f06831b4dc9.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ0Mjg5MQ==", "title": "Applied AI in Practice: Deploying Tools Inside Real Client Workflows", "start": "2026-06-10T15:35:00+01:00", "end": "2026-06-10T16:15:00+01:00", "track": "Applied AI", "description": "", "speakers": [{"name": "Wendy Clack", "org": "Centrica", "photo": "https://static.swapcard.com/public/images/f8c7758911fb4a32be47e1d634284d25.png"}, {"name": "John Bradshaw", "org": "Akamai", "photo": "https://static.swapcard.com/public/images/f330268f242c49cf9a1360557acfea1a.png"}, {"name": "Phil Doran", "org": "Celigo", "photo": "https://static.swapcard.com/public/images/ac9c87fd8e4b436d8d58044f9437f6d1.jpeg"}, {"name": "Adam Holtby", "org": "Omdia", "photo": "https://static.swapcard.com/public/images/9707a6e8afd746e5b1b09ef5952a801f.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTQwMw==", "title": "Panel Debate: Intelligent Infrastructure: Strategic Placement for Cost, Risk & Speed", "start": "2026-06-10T15:35:00+01:00", "end": "2026-06-10T16:15:00+01:00", "track": "Beyond AI at Scale", "description": "• Explore different viewpoints on where AI should run — cloud, edge, or on-prem — with leaders citing cost, speed, compliance, and resilience.\n• Discuss real-world trade-offs in training, inference, and low-latency workloads, highlighting conflicts between engineering, regulation, and finances.\n• Hear how stakeholders justify placement choices and negotiate accountability, budgets, and risk as AI expands enterprise-wide.\n• See how workload placement creates advantage through lower latency, higher resilience, and better cost control.", "speakers": [{"name": "Mukund Umalkar", "org": "ING", "photo": "https://static.swapcard.com/public/images/e606c8576cd0467ab2951dd1dd66ab40.jpeg"}, {"name": "Benjamin Richardson", "org": "CoreWeave International", "photo": "https://static.swapcard.com/public/images/84f8527023334563be6682ccad512775.png"}, {"name": "Luke Mahon", "org": "Tricentis", "photo": "https://static.swapcard.com/public/images/badd0822c93d4e64a3adb293c191a43c.jpeg"}, {"name": "Divyansh Saxena", "org": "HomeServe Finance", "photo": "https://static.swapcard.com/public/images/1da3534e53d64df0a0fb93e00fd004c7.jpeg"}, {"name": "Fatima Abukar", "org": "Financial Conduct Authority", "photo": "https://static.swapcard.com/public/images/5c3e0a0ed7434b708ce38588ca6028ab.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTE0NQ==", "title": "Panel: The Creator’s Compass: Mapping AI-Powered Independence", "start": "2026-06-10T15:35:00+01:00", "end": "2026-06-10T16:15:00+01:00", "track": "Creative AI", "description": "• Plotting Creative Freedom: Explore how AI tools help creators bypass traditional gatekeepers and carve their own path.\n• Charting Portfolio Innovation: Learn to craft standout, AI-enhanced work that showcases unique styles and attracts opportunities.\n• Marking Authority on the Map: Gain strategies to establish credibility and influence through ethical AI use and expertise. Navigating Today’s Creative Landscape: Understand how legal caution, expectations, and production realities affect AI adoption.", "speakers": [{"name": "Martin Gent", "org": "Buska Video", "photo": "https://static.swapcard.com/public/images/af5688210afb4130baafaa0f32302f45.png"}, {"name": "Alison Scorgie", "org": "House of Antigone", "photo": "https://static.swapcard.com/public/images/7b57642789114e21944f5790e52b58bc.jpeg"}, {"name": "Petra Molnar", "org": "AI CINELAB", "photo": "https://static.swapcard.com/public/images/3ba49d5983564ae3841873bc81c832eb.png"}, {"name": "Charlie Lonngren", "org": "WOMAiN", "photo": "https://static.swapcard.com/public/images/45e41945eb96423c9af9a2fb808ac616.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTQyNA==", "title": "Panel: Grounding | What Makes GenAI Output Trustworthy Enough to Use", "start": "2026-06-10T15:35:00+01:00", "end": "2026-06-10T16:15:00+01:00", "track": "Data Excellence", "description": "• Explore how data grounding, context, and retrieval processes influence the trustworthiness of GenAI outputs.\n• Learn how experienced teams detect early signs of trust erosion and establish safe boundaries between automation.\n• Explore where human intervention remains essential, and how teams establish safe boundaries between automation and oversight.", "speakers": [{"name": "Akshita Gupta", "org": "ex-Brambles", "photo": "https://static.swapcard.com/public/images/b1ee37fa3aef43d28d8fac8283e21180.png"}, {"name": "Bernard Kavanagh", "org": "TiDB powered by PingCAP", "photo": "https://static.swapcard.com/public/images/3a4e9837871742a582bf455a84ae1358.png"}, {"name": "Bobby Hyam", "org": "Glean", "photo": "https://static.swapcard.com/public/images/23e9997edd28422488b72144ed164a60.jpeg"}, {"name": "Emmanuel Osei-Brefo", "org": "Proctor & Gamble", "photo": "https://static.swapcard.com/public/images/0fe8cc0ceac94e80a28bc62f20198ff1.png"}, {"name": "Sudeshna Sen", "org": "Financial Services Compensation Scheme (FSCS)", "photo": "https://static.swapcard.com/public/images/2826c43bf1fd44bfa299fa69476267e6.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTI4OQ==", "title": "Panel: The AgentOps Stack – Building, Operating, and Scaling Autonomous Systems", "start": "2026-06-10T15:35:00+01:00", "end": "2026-06-10T16:15:00+01:00", "track": "Next Generation", "description": "• Autonomy depends on reliable systems, not just better models.\n• This panel explores what the AgentOps stack looks like in real-world enterprise environments.\n• Speakers will share how they handle evaluation, monitoring, permissions, and incident response.", "speakers": [{"name": "Andrew Harrison", "org": "Booking.com", "photo": "https://static.swapcard.com/public/images/ca5179d309e24f788821b9b3dfdc6489.jpeg"}, {"name": "Nicole Kreider", "org": "Dust", "photo": "https://static.swapcard.com/public/images/4f179e26f41b493c8d3ec937facf893e.jpeg"}, {"name": "Frederik Heda", "org": "BP", "photo": "https://static.swapcard.com/public/images/4f76e94a3e41416fa52cf8f29905a2a5.png"}, {"name": "Bas van schaik", "org": "1Password", "photo": ""}, {"name": "Lisa Lucas", "org": "Vault Marketing Group", "photo": "https://static.swapcard.com/public/images/52bf763dfbdd4e26bb3c603a8226c9b5.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTMxNg==", "title": "Startups Inside Enterprise and Government Platforms", "start": "2026-06-10T15:50:00+01:00", "end": "2026-06-10T16:30:00+01:00", "track": "Start-up & Investor", "description": "This is where startups actually change the game. Leading tech platforms and country delegations share how they embed startups into their operations, tackling massive challenges and delivering measurable results. Expect bold examples, jaw-dropping impact, and a playbook for making innovation stick.", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQzMzExMA==", "title": "Chairperson’s Closing Remarks", "start": "2026-06-10T16:00:00+01:00", "end": "2026-06-10T16:05:00+01:00", "track": "Impact Arena", "description": "", "speakers": [{"name": "Nadia Abouayoub", "org": ock", "org": "DX", "photo": "https://static.swapcard.com/public/images/d279a3a03e204399853f9216f0fd48d7.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTQyMA==", "title": "Trust in AI at Scale: Behavior, Governance, and Adoption", "start": "2026-06-10T16:25:00+01:00", "end": "2026-06-10T16:50:00+01:00", "track": "AI Cybersecurity", "description": "The conversation explores how trust in AI is built not only through governance, regulation, and technical oversight, but through the lived experience of interacting with intelligent systems. As AI becomes increasingly embedded across education, work, media, and public life, the panel examines how behavior, emotional resonance, transparency, and human-centered design shape whether people actually trust and adopt these technologies in practice.\nDrawing from emerging research and participatory design models through SOFIA LAB in collaboration with University of Oxford and the Inspiring Female Founders initiative, the discussion will explore how AI systems can be developed with communities rather than simply deployed onto them. Topics include behavioral trust signals, participatory research, adaptive systems, governance, digital well-being, and the role of experience design in creating AI that people feel safe engaging with at scale.\nThe session remains aligned with the Cyber Stage by examining the intersection of trust, safety, governance, human behavior, and real-world adoption.", "speakers": [{"name": "Pinar Ozcan", "org": "Oxford University", "photo": "https://static.swapcard.com/public/images/2c7ca767f54e462f994d806747d0f22a.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTIyOQ==", "title": "Breaking Barriers: From Pilot to Enterprise AI Success", "start": "2026-06-10T16:25:00+01:00", "end": "2026-06-10T16:50:00+01:00", "track": "Beyond AI at Scale", "description": "• Discover why AI initiatives often stall at the proof-of-concept stage and explore strategies to overcome scalability challenges.\n• Understand frameworks that help standardize deployment pipelines and manage the AI model lifecycle.\n• Gain insights from enterprises that have developed shared AI platforms, enabling safe and consistent deployment. Learn how scaling beyond pilots unlocks enterprise-wide productivity, reliability, and strategic value.", "speakers": [{"name": "Richard Adams", "org": "DFTO - Department for Transport Operator", "photo": "https://static.swapcard.com/public/images/c2b2c5f67ee34cf5aa0ae053fd19144d.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTQ0Mg==", "title": "Building Brands in the AI Wild", "start": "2026-06-10T16:25:00+01:00", "end": "2026-06-10T16:50:00+01:00", "track": "Creative AI", "description": "As the efficiency benefits of Gen AI creative grows, the debate on how to protect creativity and consumer trust deepens. In this session we’ll dive:\n• Explore how leaders in the space bridge the growing “value-visibility” gap\n• How AI can create new paradigms of interaction through adaptive experiences, AI enhanced brand storytelling and on-brand responsiveness\n• Discover modern governance practices that allow AI brand leaders to evolve at scale while protecting their core culture and values", "speakers": [{"name": "Sara Chapman", "org": "adamandeve\\TBWA", "photo": "https://static.swapcard.com/public/images/6f1dab19c6504e4c9a7a4b2bf2121061.png"}]}, {"id": "UGxhbm5pbmdfNDQ2NTQxNw==", "title": "Presentation by CoreWeave", "start": "2026-06-10T16:25:00+01:00", "end": "2026-06-10T16:50:00+01:00", "track": "Data Excellence", "description": "Sponsor Answer: How to provide robust tools and frameworks that ensure accountability, explainability, and reliability", "speakers": [{"name": "Joe Wear", "org": "CoreWeave", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTI4NQ==", "title": "What Makes an AI Start-up Investable in the UK?", "start": "2026-06-10T16:40:00+01:00", "end": "2026-06-10T17:05:00+01:00", "track": "Start-up & Investor", "description": "Discover the metrics venture capitalists truly value: usage, retention, scalability, and real-world impact.\nExplore the challenges start-ups encounter when transitioning from early pilots to enterprise adoption.\nLearn how vendors can support or hinder a start-up’s go-to-market strategy, shaping investment decisions.", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzY2Mg==", "title": "Short Break", "start": "2026-06-10T16:50:00+01:00", "end": "2026-06-10T17:00:00+01:00", "track": "AI Cybersecurity", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQxNw==", "title": "Short Break", "start": "2026-06-10T16:50:00+01:00", "end": "2026-06-10T17:00:00+01:00", "track": "Applied AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYxNA==", "title": "Short Break", "start": "2026-06-10T16:50:00+01:00", "end": "2026-06-10T17:00:00+01:00", "track": "Beyond AI at Scale", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYwOQ==", "title": "Short Break", "start": "2026-06-10T16:50:00+01:00", "end": "2026-06-10T17:00:00+01:00", "track": "Creative AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzY0MQ==", "title": "Short Break", "start": "2026-06-10T16:50:00+01:00", "end": "2026-06-10T17:00:00+01:00", "track": "Next Generation", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTI0Ng==", "title": "Scaling the Magic of the Store Experience at Pandora with AI", "start": "2026-06-10T17:00:00+01:00", "end": "2026-06-10T17:25:00+01:00", "track": "Headliners", "description": "Discover how AI is reshaping the future of selling and service as Senior Director of Product Management Johan Andersson, joined by Catarina Miranda, Director of AI,  shares the journey of bringing Pandora’s signature in‑store experience to life online. Building on the debut of AI agents Gemma (selling) and Clara (service)last year, Johan will reveal new advancements developed in partnership with Salesforce and Publicis Sapient, early insights from implementation, and a forward‑looking vision for how AI will transform customer engagement across retail and consumer businesses.", "speakers": [{"name": "Catarina Miranda", "org": "Pandora", "photo": "https://static.swapcard.com/public/images/d748564cbfc14ac3a6ff803983596ec1.jpeg"}, {"name": "Johan Andersson", "org": "Pandora", "photo": "https://static.swapcard.com/public/images/122cb4dc56de49069e96275ecedb2e86.png"}]}, {"id": "UGxhbm5pbmdfNDQ1NzY2MQ==", "title": "Beyond Cyber Fusion: The Future of AI-Driven Security Operations", "start": "2026-06-10T17:00:00+01:00", "end": "2026-06-10T17:25:00+01:00", "track": "AI Cybersecurity", "description": "AI is revolutionizing cyber operations for attackers and defenders, changing the speed and scale of cyberattacks and consequently how businesses need to respond. Within this talk you will:\nExplore how adversaries are using autonomous agents, deepfakes, and machine-speed attacks to accelerate cyber, fraud, and social engineering campaigns.\nUnderstand how organizations are modernizing the SOC with AI-enabled detection, autonomous hunt capabilities, and converged security operations.\nLearn practical ways to build the data foundation that AI requires, enabling you to identify emerging AI-driven attack behaviors, and move from reactive operations to intelligent, machine-speed defense.", "speakers": [{"name": "Mike Saxton", "org": "Booz Allen", "photo": "https://static.swapcard.com/public/images/f7602dc368f14dc395aa26d91cbbb9b1.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTQ0OQ==", "title": "Beyond Drug Discovery: Building AI-Native Drug Development from Molecules to Medicines", "start": "2026-06-10T17:00:00+01:00", "end": "2026-06-10T17:25:00+01:00", "track": "Applied AI", "description": "AI has accelerated early drug discovery, yet most programmes still fail before reaching patients.The challenge is no longer just generating molecules, but building end-to-end, AI-enabled development pipelines that connect discovery, safety, clinical design, and regulation.\nThis session explores why many AI initiatives stall, where investment is still missing, and how foundation models, agentic systems, and predictive safety tools can reshape the full idea-to-patient workflow.\nWe will also examine the governance, scientific, and organisational changes required to turn promising pilots into repeatable R&D advantage.", "speakers": [{"name": "Arijit Patra", "org": "UCB", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQzNDA5Nw==", "title": "Presentation by Senior Representative from Elsewhen", "start": "2026-06-10T17:00:00+01:00", "end": "2026-06-10T17:25:00+01:00", "track": "Beyond AI at Scale", "description": "", "speakers": [{"name": "Leon Gauhman", "org": "Elsewhen", "photo": "https://static.swapcard.com/public/images/9b41c3abf37d4839a3e2f5a147b6b4a5.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTM1MA==", "title": "Fireside Chat: Creative Capital: AI to ROI", "start": "2026-06-10T17:00:00+01:00", "end": "2026-06-10T17:25:00+01:00", "track": "Creative AI", "description": "• Learn how enterprises and creators turn AI-accelerated content, synthetic IP, and automation into repeatable, scalable income streams.\n• See how human taste and AI throughput combine to produce high-quality, brand-safe, monetizable outputs without compromising integrity or originality.\n• Understand the roles, skills, and governance frameworks needed to commercialize AI responsibly — from licensing and subscriptions to enterprise-grade IP strategies.", "speakers": [{"name": "Edward Fotheringham", "org": "BBC", "photo": "https://static.swapcard.com/public/images/f2468a8291ab48dbae3a8fff40443635.jpeg"}, {"name": "Benjamin Woollams", "org": "TrueRights", "photo": "https://static.swapcard.com/public/images/901d8a8935c14d5daf6d95639872c4b4.jpeg"}, {"name": "Christopher Hogg", "org": "Royal Holloway", "photo": "https://static.swapcard.com/public/images/9facbf060f544ff2811078c6ec1cfbd5.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTQ0Nw==", "title": "Fireside Chat: Trust | The Patterns Experience Teams Learn to Recognise Early", "start": "2026-06-10T17:00:00+01:00", "end": "2026-06-10T17:25:00+01:00", "track": "Data Excellence", "description": "• Explore subtle signals that experienced enterprise AI and data teams detect before dashboards or metrics reveal problems, ensuring critical business operations remain reliable.\n• Examine how challenges propagate across AI models, data foundations, pipelines, and governance frameworks, highlighting their systemic nature in large-scale deployments. Share practical early warning signs and judgement cues for generative AI, LLMs, and automated pipelines to intervene proactively, mitigate risk, and maintain trust across enterprise AI initiatives.\n• Highlight lessons from current AI trends, including model drift, hallucinations, bias amplification, and alignment challenges, emphasizing how enterprise teams can scale AI responsibly, ethically, and resiliently.", "speakers": [{"name": "Shubhangi Goyal", "org": "Admiral Group Plc", "photo": "https://static.swapcard.com/public/images/1629e0b2e92c463b8e2428a85e7c06b0.png"}, {"name": "Vivek Dak", "org": "Barclays", "photo": "https://static.swapcard.com/public/images/6693839203254960b5426c18d1047f36.png"}, {"name": "Madara Premawardhana", "org": "University of Buckingham", "photo": "https://static.swapcard.com/public/images/6818e71e0b8048d08c3c5e11c62136c6.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTQ1MA==", "title": "From Data-Driven to AI-Native: How Product and Engineering Teams Are Actually Changing", "start": "2026-06-10T17:00:00+01:00", "end": "2026-06-10T17:25:00+01:00", "track": "Next Generation", "description": "• As model capabilities converge, competitive advantage shifts elsewhere.\n• The next winners will be those who build superior interfaces, workflows, trust, and distribution.\n• Learn how leading organisations are moving beyond model obsession and investing in product design, adoption, and measurable outcomes.", "speakers": [{"name": "Ben Dias", "org": "IAG", "photo": "https://static.swapcard.com/public/images/bac0b7a2abbe4e49a8d577caee71a65e.jpeg"}, {"name": "Joshua Ryan-Saha", "org": "Edinburgh Futures Institute", "photo": "https://static.swapcard.com/public/images/0197e3d1327240a3b1a4f42bc95a9b14.jpeg"}, {"name": "Suresh Kumar", "org": "Scottish Government", "photo": "https://static.swapcard.com/public/images/08f82e5b24c040e7b4427869055f69fd.jpeg"}, {"name": "Olivia Larkin", "org": "City of London Corporation", "photo": "https://static.swapcard.com/public/images/31b77513f7a44c759d51b8574454da6d.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTMwNA==", "title": "Chairperson's Closing Remarks", "start": "2026-06-10T17:05:00+01:00", "end": "2026-06-10T17:10:00+01:00", "track": "Start-up & Investor", "description": "", "speakers": [{"name": "Paul Excell", "org": "ScaleUp Group/AI4C", "photo": "https://static.swapcard.com/public/images/dac07eda57b54f678422338550595618.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTQ1Mw==", "title": "Chairperson's Closing Remarks", "start": "2026-06-10T17:25:00+01:00", "end": "2026-06-10T17:30:00+01:00", "track": "Headliners", "description": "", "speakers": [{"name": "Dr Stephanie Hare", "org": "", "photo": "https://static.swapcard.com/public/images/d6e28f33b75f4399be2449f3be9a941d.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTI2Mw==", "title": "Chairperson’s Closing Remarks", "start": "2026-06-10T17:25:00+01:00", "end": "2026-06-10T17:30:00+01:00", "track": "AI Cybersecurity", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQ0Ng==", "title": "Chairperson’s Closing Remarks", "start": "2026-06-10T17:25:00+01:00", "end": "2026-06-10T17:30:00+01:00", "track": "Applied AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQ1Mg==", "title": "Chairperson’s Closing Remarks", "start": "2026-06-10T17:25:00+01:0
