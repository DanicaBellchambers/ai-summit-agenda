<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Summit 2026 — Agenda</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg: #09090f;
  --s1: #0f1018;
  --s2: #161820;
  --s3: #1d1f2e;
  --bd: #252638;
  --bd2: #2f3149;
  --accent: #7b6fff;
  --green: #3dd68c;
  --red: #ff6085;
  --warn: #f5a623;
  --txt: #eaebf4;
  --muted: #62648a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--txt);
  font-family: 'Plus Jakarta Sans', sans-serif;
  min-height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}

/* HEADER */
header {
  background: var(--s1); border-bottom: 1px solid var(--bd);
  padding: 11px 20px; display: flex; align-items: center;
  justify-content: space-between; flex-shrink: 0; z-index: 100;
}
.logo {
  font-size: 16px; font-weight: 800; letter-spacing: -0.5px;
  background: linear-gradient(110deg,#fff,var(--accent));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.hdr-right { display: flex; align-items: center; gap: 8px; }
.day-tabs { display: flex; gap: 4px; }
.day-tab {
  padding: 6px 13px; border-radius: 7px; border: 1px solid var(--bd2);
  background: transparent; color: var(--muted); font-family: inherit;
  font-size: 11.5px; font-weight: 600; cursor: pointer; transition: all 0.15s;
}
.day-tab:hover { border-color: var(--accent); color: var(--txt); }
.day-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.ag-btn {
  padding: 6px 13px; border-radius: 7px; border: 1px solid var(--accent);
  background: rgba(123,111,255,0.12); color: var(--accent);
  font-family: inherit; font-size: 11.5px; font-weight: 700;
  cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px;
}
.ag-btn:hover, .ag-btn.open { background: rgba(123,111,255,0.22); }
.badge {
  background: var(--accent); color: #fff; border-radius: 9px;
  font-size: 9px; font-weight: 800; padding: 1px 6px; display: none;
}
.badge.on { display: inline-block; }

/* FILTERS */
.filters {
  padding: 7px 20px; background: var(--s1); border-bottom: 1px solid var(--bd);
  display: flex; gap: 4px; flex-wrap: wrap; align-items: center; flex-shrink: 0;
}
.fl { font-size: 9.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; margin-right: 3px; flex-shrink: 0; }
.pill {
  padding: 3px 9px; border-radius: 20px; border: 1px solid var(--bd2);
  background: transparent; color: var(--muted); font-family: inherit;
  font-size: 10px; font-weight: 600; cursor: pointer; transition: all 0.14s; white-space: nowrap;
}
.pill:hover { color: var(--txt); }
.pill.on { color: #fff; border-color: transparent; }

/* LAYOUT */
.layout { display: flex; flex: 1; overflow: hidden; min-height: 0; }

/* MAIN GRID */
.grid-wrap { flex: 1; overflow: auto; min-width: 0; }

/* GRID BLOCKS */
.sb {
  position: absolute; border-radius: 7px; padding: 6px 8px;
  cursor: pointer; overflow: hidden;
  transition: transform 0.13s, box-shadow 0.13s, filter 0.13s;
  border: 1px solid rgba(255,255,255,0.07);
  display: flex; flex-direction: column; gap: 3px;
}
.sb:hover { transform: scale(1.02) translateY(-1px); box-shadow: 0 8px 24px rgba(0,0,0,0.6); z-index: 20; filter: brightness(1.1); }
.sb.in-ag { outline: 2px solid rgba(255,255,255,0.42); outline-offset: -2px; }
.sb.brk { opacity: 0.22; cursor: default; }
.sb.brk:hover { transform: none; filter: none; box-shadow: none; }
.sb-title { font-size: 9.5px; font-weight: 700; line-height: 1.35; color: #fff; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sb-time { font-size: 8.5px; color: rgba(255,255,255,0.45); font-family: 'JetBrains Mono', monospace; }
.sb-spks { display: flex; flex-direction: column; gap: 2px; margin-top: auto; }
.sb-spk { display: flex; align-items: center; gap: 4px; }
.sb-av { width: 16px; height: 16px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(255,255,255,0.18); flex-shrink: 0; background: var(--bd); }
.sb-nm { font-size: 8px; color: rgba(255,255,255,0.52); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px; }
.hline { position: absolute; left: 0; right: 0; border-top: 1px dashed rgba(255,255,255,0.04); pointer-events: none; }

/* RESIZE HANDLE */
.rh {
  width: 5px; background: var(--bd); cursor: col-resize;
  flex-shrink: 0; position: relative; transition: background 0.15s; z-index: 50;
}
.rh:hover, .rh.drag { background: var(--accent); }
.rh::after {
  content: ''; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%); width: 2px; height: 32px;
  border-radius: 2px; background: rgba(255,255,255,0.12);
}
.rh:hover::after, .rh.drag::after { background: rgba(255,255,255,0.32); }

/* AGENDA PANEL */
.ag-panel {
  flex-shrink: 0; background: var(--s1);
  display: flex; flex-direction: column; overflow: hidden;
  transition: width 0.24s cubic-bezier(0.4,0,0.2,1);
}
.ag-panel.closed { width: 0 !important; }

.ag-hdr {
  padding: 11px 15px; border-bottom: 1px solid var(--bd);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0; background: var(--s2); gap: 8px;
}
.ag-hdr-title { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.2px; white-space: nowrap; }
.ag-clear {
  font-size: 10px; font-weight: 600; color: var(--muted); background: none; border: none;
  cursor: pointer; font-family: inherit; padding: 3px 7px; border-radius: 5px;
  transition: all 0.13s; white-space: nowrap; flex-shrink: 0;
}
.ag-clear:hover { color: var(--red); background: rgba(255,96,133,0.1); }

/* AGENDA SCROLLABLE AREA */
.ag-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; }

.ag-empty {
  text-align: center; padding: 48px 18px;
  color: var(--muted); font-size: 12px; line-height: 1.75;
}
.ag-empty-icon { font-size: 28px; display: block; margin-bottom: 10px; opacity: 0.4; }

/* AGENDA DAY SECTION */
.ag-day-hdr {
  font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--muted); padding: 10px 14px 6px;
  background: var(--s1); position: sticky; top: 0; z-index: 10;
  border-bottom: 1px solid var(--bd);
}

/* AGENDA TIMELINE */
.ag-tl {
  display: flex; position: relative;
  padding: 8px 8px 16px 0;
}

.ag-tcol {
  width: 42px; flex-shrink: 0; position: relative;
}
.ag-tick {
  position: absolute; right: 5px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px; font-weight: 500; color: var(--muted);
  transform: translateY(-50%); white-space: nowrap; line-height: 1;
}

.ag-gcol {
  flex: 1; position: relative; min-width: 0;
}
.ag-hline {
  position: absolute; left: 0; right: 0; pointer-events: none;
}

/* AGENDA SESSION BLOCK */
.ag-blk {
  position: absolute; border-radius: 7px; padding: 6px 8px;
  cursor: pointer; overflow: hidden;
  transition: filter 0.13s, box-shadow 0.13s;
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; flex-direction: column; gap: 3px;
}
.ag-blk:hover { filter: brightness(1.1); box-shadow: 0 4px 18px rgba(0,0,0,0.55); z-index: 10; }

.ag-blk-track { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: rgba(255,255,255,0.65); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ag-blk-title { font-size: 9.5px; font-weight: 700; line-height: 1.35; color: #fff; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.ag-blk-time { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: rgba(255,255,255,0.42); margin-top: auto; }
.ag-blk-spks { display: flex; flex-direction: column; gap: 2px; }
.ag-blk-spk { display: flex; align-items: center; gap: 3px; }
.ag-blk-av { width: 13px; height: 13px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(255,255,255,0.15); flex-shrink: 0; background: var(--bd); }
.ag-blk-nm { font-size: 8px; color: rgba(255,255,255,0.48); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px; }

.ag-rm {
  position: absolute; top: 4px; right: 4px; width: 15px; height: 15px;
  border-radius: 50%; background: rgba(0,0,0,0.45); border: none;
  color: rgba(255,255,255,0.45); font-size: 9px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.12s; z-index: 5; line-height: 1;
}
.ag-rm:hover { background: rgba(255,96,133,0.55); color: #fff; }

/* OVERLAP STRIPE — amber hatched overlay */
.ag-ovl-stripe {
  position: absolute; left: 0; right: 0; pointer-events: none; z-index: 4;
  background: repeating-linear-gradient(
    -45deg,
    rgba(245,166,35,0.14) 0px, rgba(245,166,35,0.14) 3px,
    transparent 3px, transparent 9px
  );
  border-top: 1px dashed rgba(245,166,35,0.5);
  border-bottom: 1px dashed rgba(245,166,35,0.5);
}

/* Warning pill sits above the stripe */
.ag-ovl-pill {
  position: absolute; z-index: 12; pointer-events: none;
  font-size: 7.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--warn); background: rgba(245,166,35,0.15);
  border: 1px solid rgba(245,166,35,0.4); border-radius: 4px;
  padding: 1px 5px; white-space: nowrap; left: 50%; transform: translateX(-50%);
}

/* Conflict border for side-by-side columns */
.ag-blk.conflict { border-left: 2px solid rgba(245,166,35,0.65); border-radius: 0 7px 7px 0; }
.ag-blk.conflict-first { border-right: none; border-radius: 7px 0 0 7px; }

/* AGENDA FOOTER */
.ag-foot {
  padding: 8px 14px; border-top: 1px solid var(--bd);
  flex-shrink: 0; background: var(--s2);
  font-size: 10px; font-weight: 600; color: var(--muted); text-align: center;
}

/* MODAL */
.modal-bg {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
  z-index: 200; align-items: center; justify-content: center; padding: 20px;
  backdrop-filter: blur(8px);
}
.modal-bg.on { display: flex; }
.modal {
  background: var(--s2); border: 1px solid var(--bd2); border-radius: 14px;
  max-width: 600px; width: 100%; max-height: 88vh; overflow-y: auto;
  padding: 24px; position: relative; animation: mIn 0.2s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes mIn { from { opacity:0; transform:scale(0.93) translateY(12px); } to { opacity:1; transform:none; } }
.modal-x {
  position: absolute; top: 12px; right: 12px; width: 26px; height: 26px;
  border-radius: 50%; background: var(--s3); border: 1px solid var(--bd2);
  color: var(--muted); cursor: pointer; display: flex; align-items: center;
  justify-content: center; font-size: 12px; transition: all 0.13s;
}
.modal-x:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.modal-badge {
  display: inline-block; padding: 3px 10px; border-radius: 20px;
  font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
}
.modal-title { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.3; margin-bottom: 8px; color: #fff; padding-right: 20px; }
.modal-time { font-size: 11.5px; color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.modal-time span { background: var(--s3); border: 1px solid var(--bd2); border-radius: 6px; padding: 3px 9px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; }
.modal-ag-btn {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 16px; border-radius: 9px; border: 1px solid var(--accent);
  background: rgba(123,111,255,0.1); color: var(--accent); font-family: inherit;
  font-size: 12.5px; font-weight: 700; cursor: pointer; transition: all 0.16s;
  margin-bottom: 16px; width: 100%;
}
.modal-ag-btn:hover { background: rgba(123,111,255,0.22); }
.modal-ag-btn.added { border-color: var(--green); background: rgba(61,214,140,0.1); color: var(--green); }
.modal-ag-btn.added:hover { background: rgba(61,214,140,0.2); }
.modal-desc { font-size: 12.5px; line-height: 1.72; color: rgba(234,235,244,0.75); margin-bottom: 20px; }
.modal-spks-lbl { font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 10px; }
.modal-spks { display: flex; flex-wrap: wrap; gap: 7px; }
.modal-spk { display: flex; align-items: center; gap: 9px; background: var(--s3); border: 1px solid var(--bd2); border-radius: 9px; padding: 8px 11px; min-width: 140px; flex: 1; }
.modal-spk-av { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bd2); background: var(--bd); flex-shrink: 0; }
.modal-spk-nm { font-size: 11.5px; font-weight: 700; color: #fff; margin-bottom: 1px; }
.modal-spk-org { font-size: 10px; color: var(--muted); }

/* TOAST */
.toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(50px);
  background: var(--s2); border: 1px solid var(--bd2);
  border-radius: 9px; padding: 8px 16px; font-size: 11.5px;
  font-weight: 600; color: var(--txt); z-index: 300;
  transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), opacity 0.25s;
  opacity: 0; pointer-events: none; box-shadow: 0 6px 24px rgba(0,0,0,0.55);
}
.toast.on { transform: translateX(-50%) translateY(0); opacity: 1; }
body.sizing { user-select: none; cursor: col-resize; }
</style>
</head>
<body>

<header>
  <div class="logo">⚡ AI Summit 2026</div>
  <div class="hdr-right">
    <div class="day-tabs">
      <button class="day-tab active" onclick="switchDay('2026-06-10')">Wed 10 Jun</button>
      <button class="day-tab" onclick="switchDay('2026-06-11')">Thu 11 Jun</button>
    </div>
    <button class="ag-btn open" id="agBtn" onclick="togglePanel()">
      📋 My Agenda
      <span class="badge" id="badge">0</span>
    </button>
  </div>
</header>

<div class="filters" id="filters"></div>

<div class="layout" id="layout">
  <div class="grid-wrap" id="gridWrap"></div>
  <div class="rh" id="rh" title="Drag to resize"></div>
  <div class="ag-panel" id="agPanel" style="width:320px;">
    <div class="ag-hdr">
      <span class="ag-hdr-title">📋 Your Agenda</span>
      <button class="ag-clear" onclick="clearAll()">Clear all</button>
    </div>
    <div class="ag-scroll" id="agScroll">
      <div class="ag-empty" id="agEmpty">
        <span class="ag-empty-icon">🗓️</span>

      </div>
    </div>
    <div class="ag-foot" id="agFoot">0 sessions saved</div>
  </div>
</div>

<div class="modal-bg" id="modalBg" onclick="closeMBg(event)">
  <div class="modal">
    <button class="modal-x" onclick="closeM()">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SESSIONS = [{"id": "UGxhbm5pbmdfNDQxOTE5NQ==", "title": "Chairperson’s Welcome Remarks: How Intelligence Became Practical", "start": "2026-06-10T08:45:00+01:00", "end": "2026-06-10T09:00:00+01:00", "track": "Headliners", "description": "For years, AI was framed as a quest to replicate human intelligence – impressive, ambitious, and often impractical. Today’s most valuable systems take a different path. They don’t think like humans; they work alongside them – embedded in workflows, products, and operating models, quietly improving speed, cost, accuracy, and margins. This session traces how AI moved from brittle rules and stalled pilots to learning systems delivering repeatable business impact – and what leaders learnt along the way about adoption, scale, and value creation. Less hype, more reality – and a clear view of where competitive advantage is now being built.", "speakers": [{"name": "Dr Stephanie Hare", "org": "", "photo": "https://static.swapcard.com/public/images/d6e28f33b75f4399be2449f3be9a941d.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTI1OA==", "title": "The Future AI Will Create", "start": "2026-06-10T09:00:00+01:00", "end": "2026-06-10T09:25:00+01:00", "track": "Headliners", "description": "Intelligence evolves when AI stops merely predicting outcomes and begins understanding consequences.\nThrough world models, simulated environments, and systems that can rehearse the future before it unfolds, AI is redefining what is possible.\nAs machines gain a deeper understanding of reality, what becomes the role of a human, and how will we shape a future in which humans and AI co-create our world?", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQzMzA5MA==", "title": "From AI Pilots to Enterprise Transformation: Operating Agents at Scale", "start": "2026-06-10T09:25:00+01:00", "end": "2026-06-10T09:50:00+01:00", "track": "Headliners", "description": "AI experimentation is over—now enterprises must deliver real, measurable impact.\nIn this keynote, IBM explores how organizations can move beyond isolated pilots to orchestrated, governed agentic systems that drive transformation across the business. Learn how to scale AI responsibly by coordinating agents across domains, enforcing end-to-end control, and unlocking visibility into performance and cost. \nThe session also examines how development teams must evolve—adopting agentic workflows across the SDLC to build faster, with greater quality and control. \nThis is the blueprint for turning AI ambition into enterprise-wide outcomes.", "speakers": [{"name": "Parul Mishra", "org": "IBM", "photo": "https://static.swapcard.com/public/images/ec2053dbdc324f00af7e4654752d5851.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTM1NQ==", "title": "Opening Address by Snyk Limited", "start": "2026-06-10T10:00:00+01:00", "end": "2026-06-10T10:10:00+01:00", "track": "AI Cybersecurity", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ2MjI4OQ==", "title": "Chair’s Opening Remarks", "start": "2026-06-10T10:00:00+01:00", "end": "2026-06-10T10:05:00+01:00", "track": "VisionAIres", "description": "", "speakers": [{"name": "Matthew Blakemore", "org": "Independent", "photo": "https://static.swapcard.com/public/images/4ddb643f6b3b459e86087694697ece8f.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTQyNw==", "title": "Chairperson’s Welcome Remarks", "start": "2026-06-10T10:05:00+01:00", "end": "2026-06-10T10:10:00+01:00", "track": "Applied AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQ0MA==", "title": "Chairperson’s Welcome Remarks", "start": "2026-06-10T10:05:00+01:00", "end": "2026-06-10T10:10:00+01:00", "track": "Beyond AI at Scale", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQzNA==", "title": "Chairperson’s Welcome Remarks", "start": "2026-06-10T10:05:00+01:00", "end": "2026-06-10T10:10:00+01:00", "track": "Creative AI", "description": "", "speakers": [{"name": "Christopher Hogg", "org": "Royal Holloway", "photo": "https://static.swapcard.com/public/images/9facbf060f544ff2811078c6ec1cfbd5.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQzMzA4Mg==", "title": "Chairperson’s Welcome Remarks", "start": "2026-06-10T10:05:00+01:00", "end": "2026-06-10T10:10:00+01:00", "track": "Impact Arena", "description": "", "speakers": [{"name": "Nadia Abouayoub", "org": "N/A", "photo": "https://static.swapcard.com/public/images/3e72680574214c9f86c5fb54cb38c814.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTI0Mw==", "title": "Chairperson's Welcome Remarks", "start": "2026-06-10T10:05:00+01:00", "end": "2026-06-10T10:10:00+01:00", "track": "Data Excellence", "description": "", "speakers": [{"name": "Georgiana Marsic", "org": "AI You Can Trust", "photo": "https://static.swapcard.com/public/images/17afa36d0e9742278cb1d05e52776aee.png"}]}, {"id": "UGxhbm5pbmdfNDQzMzA4NA==", "title": "Building Generative AI into Your Strategy: Moving Beyond Tools to Transformation", "start": "2026-06-10T10:05:00+01:00", "end": "2026-06-10T10:50:00+01:00", "track": "Masterclass", "description": "Moving beyond the hype of individual tools and prompts, this talk provides a structured framework for organisational transformation. Attendees will learn how to audit their current workflows, distinguish between simple automation and true innovation, and navigate the critical \"human-in-the-loop\" requirements of the modern workforce. This session offers the governance, culture, and operational models needed to turn random acts of AI into sustainable competitive advantage.\nWhat You’ll Learn: \n• The 3-Step Strategic Framework: Learn to categorise opportunities into Automation (buying back time), Augmentation (enhancing quality), and Innovation (creating new value) .\n• Workflow Mapping: A practical method to break down high-value tasks, identify \"dark data\" opportunities, and determine exactly where humans must remain in the loop.\n• Governance & Safety: How to establish \"Red Lines\" and an AI Policy that protects IP and client data without stifling creativity. \n• The AI Maturity Model: Understanding the journey from sporadic experimentation to full organisational integration. \nWho Should Attend: \nSenior Leadership, Strategy Directors, Operations Heads, and Transformation Leads looking to move beyond \"playing with tools\" to building an enterprise-grade AI strategy.", "speakers": [{"name": "Jules Love", "org": "Spark AI", "photo": "https://static.swapcard.com/public/images/b263b21894de4dbc8928c331b8996252.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTM0Mw==", "title": "Chairperson’s Welcome Remarks", "start": "2026-06-10T10:05:00+01:00", "end": "2026-06-10T10:10:00+01:00", "track": "Next Generation", "description": "", "speakers": [{"name": "Harriet Meyer", "org": "AI for Media", "photo": "https://static.swapcard.com/public/images/ba7069bb18de404f88a5388e09c9da26.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTQwNA==", "title": "Chairperson's Welcome Remarks", "start": "2026-06-10T10:05:00+01:00", "end": "2026-06-10T10:10:00+01:00", "track": "Start-up & Investor", "description": "", "speakers": [{"name": "Paul Excell", "org": "ScaleUp Group/AI4C", "photo": "https://static.swapcard.com/public/images/dac07eda57b54f678422338550595618.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ1NzA1NQ==", "title": "Inside Defence AI - a candid conversation with MOD Leaders", "start": "2026-06-10T10:05:00+01:00", "end": "2026-06-10T10:50:00+01:00", "track": "VisionAIres", "description": "This closed door roundtable offers senior AI leaders a rare chance to engage directly with Ministry of Defence representatives in an open, collaborative discussion on the department’s views on evolving AI priorities, safeguards, procurement pathways, and opportunities for public–private partnership. The session aims to provide senior industry leaders with a candid, practical insight into how Defence is approaching AI adoption, governance, and partnerships.", "speakers": [{"name": "Deana Rouse", "org": "MOD", "photo": "https://static.swapcard.com/public/images/4954b97a58c14698ad7a898291480440.jpeg"}, {"name": "Victoria Cope", "org": "MOD", "photo": "https://static.swapcard.com/public/images/b4f9b5a139b54bc7bfafe0257f234c40.jpeg"}, {"name": "Mark Ridgway", "org": "Futures & Force design, Military Strategic Headquarters (MSHQ)", "photo": "https://static.swapcard.com/public/images/ab88b0bcc6a44284bc255ed5271138c9.jpeg"}, {"name": "Chris Moore-Bick", "org": "Office of the Chief Scientific Adviser, Ministry of Defence", "photo": "https://cdn-api.swapcard.com/public/images/0b1b93ae50574419b0afc2352b21d5ce.png"}, {"name": "Caroline Woodbridge-Lewin", "org": "Digital and Data, National Armaments", "photo": "https://static.swapcard.com/public/images/5e06a24405a04c08b1a5400f85e7d2f9.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTIwNA==", "title": "Cyber Command Frontier: Human Strategy vs. Autonomous Adversaries", "start": "2026-06-10T10:10:00+01:00", "end": "2026-06-10T10:35:00+01:00", "track": "AI Cybersecurity", "description": "• Understand how hostile actors are leveraging generative AI, autonomous exploit chains, and adaptive malware to outpace traditional defenses.\n• Explore why leadership judgement, context, and foresight remain decisive—even as AI augments detection, response, and threat analytics.\n• Learn how to design scalable architectures that balance autonomy with oversight, ensuring defenders stay in command of high-speed, self-evolving systems.", "speakers": [{"name": "Kam Karaji", "org": "NFL", "photo": "https://static.swapcard.com/public/images/3f66290835c149f3873a9c27acb58f29.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ2MDk3NQ==", "title": "Applied AI Toolkits – Hands-on Deployment & Governance", "start": "2026-06-10T10:10:00+01:00", "end": "2026-06-10T10:35:00+01:00", "track": "Applied AI", "description": "Interactive session deploying AI-native tools safely with proper guardrails and monitoring.", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQxMg==", "title": "Beyond PoCs: Scaling AI for Real Business Impact", "start": "2026-06-10T10:10:00+01:00", "end": "2026-06-10T10:35:00+01:00", "track": "Beyond AI at Scale", "description": "Artificial Intelligence has moved beyond experimentation. The challenge facing organisations today is no longer whether to adopt AI, but how to turn promising pilots into scalable capabilities that deliver measurable business value.\n\nIn this session, we’ll explore what it really takes to operationalise AI in large, complex organisations, moving beyond demos and isolated use cases to solutions that create meaningful impact across customer experience, colleague productivity, operations, and decision-making.\nThrough real-world examples and practical lessons learned, this session will highlight how organisations are deploying AI at scale, the common barriers that prevent adoption, and the critical foundations needed to build trusted, sustainable AI capabilities.\nAttendees will learn:\n• How leading organisations are moving beyond pilots and proofs of concept to deploy AI at scale with measurable outcomes.\n• Practical lessons from implementing AI in real operational environments, including successes, failures, and key learnings.\n• The organisational, technical, and governance foundations required to scale AI responsibly and effectively.\n• How to identify high-value AI opportunities that drive adoption and deliver tangible business impact.\n• What separates successful enterprise AI transformation from isolated experimentation.\n• How businesses can prepare for the next wave of AI evolution, including increasingly proactive and autonomous AI systems.", "speakers": [{"name": "Mohsen Ghasempour", "org": "Kingfisher", "photo": "https://static.swapcard.com/public/images/0bd95b5ad3944084adca5ae98dec3918.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTQ1Nw==", "title": "Creative AI Unleashed: From Imagination to Execution", "start": "2026-06-10T10:10:00+01:00", "end": "2026-06-10T10:35:00+01:00", "track": "Creative AI", "description": "• Explore how AI tools enable rapid prototyping, stylistic exploration, and seamless hybrid workflows that combine human creativity with machine efficiency.\n• Discover the latest breakthroughs in generative animation and visual creativity, expanding the boundaries of digital art.\n• Learn how AI tools for video, image, and audio streamline production and blend human originality with machine efficiency for innovative creative outputs.", "speakers": [{"name": "Isaac Martin", "org": "Flight Story", "photo": "https://static.swapcard.com/public/images/556b900edbac40b9ab9c58dff0c4e901.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQzMzA5MQ==", "title": "Beyond the Migration: Scaling AI at Booking.com with User-Centric FinOps", "start": "2026-06-10T10:10:00+01:00", "end": "2026-06-10T10:35:00+01:00", "track": "Impact Arena", "description": "Discover how Booking.com scales AI for millions of travelers while maintaining fiscal and environmental responsibility. This session reveals the \"User-Centric FinOps\" framework used to move past the cloud migration trap. Learn how we pioneered a Hybrid ML Inference strategy utilizing private cloud for stability and public cloud for elasticity to optimize costs without sacrificing high availability. Attendees will gain a blueprint for balancing \"Compute-Hungry\" AI with \"Carbon-Conscious\" values.", "speakers": [{"name": "Rahul Verma", "org": "Booking.com", "photo": "https://static.swapcard.com/public/images/f1f4c1778bf74705bc1d376afbc2ab9f.jpeg"}, {"name": "Alibek Datbayev", "org": "Booking.com", "photo": "https://static.swapcard.com/public/images/f846d54fcaa44155b230534f76ccb53d.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTIyNg==", "title": "Reality | Data Readiness Challenges That Impact AI Success in Production", "start": "2026-06-10T10:10:00+01:00", "end": "2026-06-10T10:35:00+01:00", "track": "Data Excellence", "description": "• Explore the most common data readiness challenges that emerge only after AI reaches production.\n• Examine how late-discovered issues in quality, context, and ownership can increase risks and disrupt project outcomes.\n• Gain insights into what seasoned teams now prioritise and evaluate to ensure smoother AI execution and long-term success.", "speakers": [{"name": "Himanshu Chaturvedi", "org": "Nationwide Building Society", "photo": "https://static.swapcard.com/public/images/d56ba61bda3242659b01f51fec0ed5d4.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTQ1Ng==", "title": "The End of the Chatbox: Designing the Next Generation of AI Interfaces", "start": "2026-06-10T10:10:00+01:00", "end": "2026-06-10T10:35:00+01:00", "track": "Next Generation", "description": "• Chat-first AI is reaching its limits in complex workflows and high-trust environments.\n• The next interface layer is proactive, multimodal, and embedded in everyday tools.\n• Learn the design principles that make AI products feel simple, safe, and usable.", "speakers": [{"name": "Sachin Jogia", "org": "HMRC, Defra, NHS", "photo": "https://static.swapcard.com/public/images/a5b8015a4872437c9145b7af0bc86f03.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTQxMQ==", "title": "AI Saturation Is Real: How Start-ups Stand Out", "start": "2026-06-10T10:10:00+01:00", "end": "2026-06-10T10:35:00+01:00", "track": "Start-up & Investor", "description": "Discover the difference between superficial features and meaningful differentiation. Learn how venture capitalists identify genuine potential in a crowded market. Explore positioning strategies that go beyond generic “AI-powered” narratives.", "speakers": [{"name": "Paul Excell", "org": "ScaleUp Group/AI4C", "photo": "https://static.swapcard.com/public/images/dac07eda57b54f678422338550595618.jpeg"}, {"name": "Albert Azis-Clauson", "org": "Tramlines", "photo": "https://static.swapcard.com/public/images/b56c838a13ac469c938cf2f8ad97d35a.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTQyMg==", "title": "Modeling Reality: When AI Leaves the Cloud and Starts Walking the Streets", "start": "2026-06-10T10:15:00+01:00", "end": "2026-06-10T10:40:00+01:00", "track": "Headliners", "description": "Watch AI turn plain-language ideas into working software before your eyes.\nDiscover how enterprises are using “vibe coding” to accelerate development, unlock creativity, and align business intent with engineering execution.\nExplore the real-world impact on roles, workflows, and governance, and how organisations can harness this new approach to achieve faster, smarter, and more reliable outcomes at scale.", "speakers": [{"name": "John Hanke", "org": "Executive Chairman of Niantic Spatial", "photo": "https://static.swapcard.com/public/images/edfc6495b4ad47c79ab1fad3cdcefd27.jpeg"}, {"name": "Zach Rash", "org": "Architect behind Google Maps and the global phenomenon Pokémon GO.", "photo": "https://static.swapcard.com/public/images/4a834926bad64701a712398019f74c1a.png"}]}, {"id": "UGxhbm5pbmdfNDQ1NzY1Nw==", "title": "Short Break", "start": "2026-06-10T10:35:00+01:00", "end": "2026-06-10T10:45:00+01:00", "track": "AI Cybersecurity", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTMzMw==", "title": "Short Break", "start": "2026-06-10T10:35:00+01:00", "end": "2026-06-10T10:45:00+01:00", "track": "Applied AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYzOA==", "title": "Short Break", "start": "2026-06-10T10:35:00+01:00", "end": "2026-06-10T10:45:00+01:00", "track": "Beyond AI at Scale", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ2NTEzMg==", "title": "Short Break", "start": "2026-06-10T10:35:00+01:00", "end": "2026-06-10T10:45:00+01:00", "track": "Creative AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ2NzU2Nw==", "title": "Short Break", "start": "2026-06-10T10:35:00+01:00", "end": "2026-06-10T10:45:00+01:00", "track": "Data Excellence", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ2MzQ5Nw==", "title": "Short Break", "start": "2026-06-10T10:35:00+01:00", "end": "2026-06-10T10:45:00+01:00", "track": "Data Excellence", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTM0OA==", "title": "Short Break", "start": "2026-06-10T10:35:00+01:00", "end": "2026-06-10T10:45:00+01:00", "track": "Next Generation", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ0ODcxMg==", "title": "Leading AI Transformation with Confidence: The Enterprise Context Layer for Agentic AI", "start": "2026-06-10T10:40:00+01:00", "end": "2026-06-10T11:05:00+01:00", "track": "Headliners", "description": "AI is no longer a science project—it’s a board-level mandate. Yet most organizations are stuck between moving too slowly and spinning up disconnected pilots that create risk, sprawl, and low ROI. In this session, we’ll unpack how an open, horizontal Work AI platform and a shared enterprise context layer can turn AI from scattered tools into a trusted, company-wide capability that transforms people, processes, and platform. You’ll see how leading enterprises are using Glean to unify context across their apps, safely deploy multi-model agents, and deliver tangible outcomes—from 25%+ productivity gains and faster feature velocity to higher win rates, better CSAT, and AI initiatives you can finally scale with confidence.", "speakers": [{"name": "Joel McKelvey", "org": "Glean", "photo": "https://static.swapcard.com/public/images/0a0cb4b397a44817ab6338a3cdac696d.png"}]}, {"id": "UGxhbm5pbmdfNDQ2MzMzMw==", "title": "From Signal to Sequence: AI and the Data Revolution in Life Sciences", "start": "2026-06-10T10:40:00+01:00", "end": "2026-06-10T11:00:00+01:00", "track": "Impact Arena", "description": "In this session, Oxford Nanopore Technologies Vice President of Machine Learning Mike Vella explores how AI and high-performance computing are transforming modern genomics and molecular biology. Beginning with an introduction to nanopore sequencing and the challenge of interpreting noisy biological signals in real time, the talk examines how machine learning has become fundamental to converting raw sensor data into accurate biological insight.\nThe session will cover the scale and complexity of life sciences data, why biological AI workloads are uniquely demanding, and how advances in GPU computing and ML infrastructure are enabling major improvements in sequencing accuracy, speed, and downstream analysis. Mike will also discuss emerging directions including AI-driven molecular design, the long-term potential of DNA as a data storage medium, and how AI may reshape the future of life sciences over the coming decades.", "speakers": [{"name": "Mike Vella", "org": "Oxford Nanopore Technologies", "photo": "https://static.swapcard.com/public/images/fb9a31eabe534ceb830a4e1d171760d1.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTQ0Mw==", "title": "Your Employees' AI Tools Will Break Your Identity Security Architecture Before the End of 2026. Don't Stop Them. Secure Them", "start": "2026-06-10T10:45:00+01:00", "end": "2026-06-10T11:10:00+01:00", "track": "AI Cybersecurity", "description": "AI agents now access your most sensitive systems, secrets, and data - but most organizations can't see them, govern them, or audit what they're doing. That's not a future risk. It's today's gap. This session gives you a practical framework: Discover shadow AI and exposed credentials, Secure them with Just-In-Time and Just Enough Access, and Audit every action with full attribution across humans and machines.", "speakers": [{"name": "Ollie Cheal", "org": "1password", "photo": "https://static.swapcard.com/public/images/26ac0dc80e654a649456d897b9f7f1b6.png"}]}, {"id": "UGxhbm5pbmdfNDQ2MjMwMg==", "title": "How to Prepare Unstructured Data for AI with Deasy Labs", "start": "2026-06-10T10:45:00+01:00", "end": "2026-06-10T11:10:00+01:00", "track": "Applied AI", "description": "An enterprise’s first internal AI project worked brilliantly in the POC. But in production, the data became massive and messy: relevance and quality were unclear, sensitive information couldn’t easily be filtered out, and there was no metadata to point AI toward the right answers.\nSee how adding a curation and enrichment layer before ingestion cuts unstructured data prep from months to days, lowers compliance risk, and improves AI accuracy.", "speakers": [{"name": "Reece Griffiths", "org": "Deasy Labs", "photo": "https://static.swapcard.com/public/images/443435bf0d67465c9a406695db5b33de.png"}]}, {"id": "UGxhbm5pbmdfNDQzNDA5Ng==", "title": "From AI Hype to Business Impact: Real Stories of AI Success", "start": "2026-06-10T10:45:00+01:00", "end": "2026-06-10T11:10:00+01:00", "track": "Beyond AI at Scale", "description": "AI headlines are everywhere, but actual business results are harder to find.\nHear how companies like Ericsson, Booking.com, Time, Databricks, Pure Storage, Confluent, Duolingo are using AI at work to solve real operational problems — not as a side experiment, but as a practical way to save time, improve employee experience, and drive measurable outcomes. \nWe will highlight concrete customer success stories and real-world use cases, including examples like reducing onboarding time, cutting internal support requests, improving search and knowledge access across complex tech stacks, and helping teams move from manual, repetitive work to better agentic workflows. \nIf you want practical examples of how enterprise AI delivers measurable business impact — and a clearer picture of what successful adoption actually looks like — this session is for you.", "speakers": [{"name": "Kelly Xu", "org": "Glean", "photo": "https://static.swapcard.com/public/images/39d0307866bb422a975ca32b91c3ebdf.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTM1MQ==", "title": "Presentation by Senior Representative from Optimizely", "start": "2026-06-10T10:45:00+01:00", "end": "2026-06-10T11:10:00+01:00", "track": "Creative AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQzMzEwOA==", "title": "Algorithms to Autonomy: 360° AI Solutions for Enterprise and Research", "start": "2026-06-10T10:45:00+01:00", "end": "2026-06-10T11:10:00+01:00", "track": "Data Excellence", "description": "• AI is reshaping modern enterprises, enabling smarter decisions, operational efficiency and competitive advantage. Boston delivers a full-stack AI strategy that aligns technology, data and business outcomes. An integrated, end-to-end architecture connects infrastructure, platforms and applications seamlessly.\n• Advanced AI infrastructure provides scalable, high-performance compute for enterprise workloads. Robust data architecture ensures secure, high-speed access to critical business data. AI models and platforms accelerate innovation through streamlined development and deployment.\n• The approach prioritises measurable business value, not just technology adoption. A balanced architecture optimises performance, scalability and long-term operational efficiency. Our AI Factory Accelerator provides a structured pathway from strategy to scaled deployment.\n• Our Labs reduce risk through validation, benchmarking and proof-of-concept environments. A thriving partner ecosystem: Our strategic collaborations amplify innovation, integrate best-in-class technologies and deliver solutions faster and smarter.", "speakers": [{"name": "Lekha Pantula", "org": "Boston Limited", "photo": "https://static.swapcard.com/public/images/ed465813530d4537a8b8e73b0e355bb8.png"}, {"name": "Ross Verrall", "org": "NVIDIA", "photo": "https://static.swapcard.com/public/images/6e9ca2d6cd9c4b74a3b6fe2be932f322.png"}]}, {"id": "UGxhbm5pbmdfNDQzNDA5OQ==", "title": "Stop Calling AI — Start Engineering It: The Four Layers Production Systems Need", "start": "2026-06-10T10:45:00+01:00", "end": "2026-06-10T11:10:00+01:00", "track": "Next Generation", "description": "Most teams still ship AI like it's 2023, closed API, a prompt, a chat box bolted onto the product. That worked when AI was novel. It breaks the moment AI is the product.\nProduction AI in 2026 is a four-layer system: reason, know, improve, govern. Open-model inference. Live grounding. A real iteration loop from production data. Dedicated, certified infrastructure. Most teams have one and a half of these. The rest is missing or held together with glue.\nIn this session, we'll walk the four layers, show what breaks without each, and prove them with a ~30-line live build of a grounded research agent, backed by what's already shipping in production at companies like Revolut and Sword Health.\nPractitioner-led. Live code. Real numbers. The take-home phrase: from calling AI to engineering it.", "speakers": [{"name": "Dylan Bristot", "org": "Nebius", "photo": "https://static.swapcard.com/public/images/c84b677700b64b6cab216c3371fc5a03.png"}, {"name": "Parakh Jaggi", "org": "Tavily", "photo": "https://static.swapcard.com/public/images/2beb05fc2ba14ada81d087e3c4ec6329.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ2NzU2Ng==", "title": "Data Challenge Lab : From Messy Data to Meaningful AI in 60 Minutes", "start": "2026-06-10T11:00:00+01:00", "end": "2026-06-10T12:00:00+01:00", "track": "Challenge Labs", "description": "The Data Challenge Lab offers practitioners a dynamic, hands-on experience tackling a real-world AI/data problem within a time-limited setting. This session is designed to focus on three critical areas:\n• Data Quality & Preparation: Understanding and addressing challenges in preparing high-quality data for analysis.\n• Decision-Making Under Constraints: Developing strategies to make effective decisions when faced with limited resources or time.\n• Translating Data into Business Value: Applying insights to create tangible business outcomes.\nSession Facilitation and Guidance: The Challenge Lab is led by an expert in the field who has meticulously crafted the exercise and selected the data source to ensure a meaningful and impactful learning experience. Mentors will also be present to provide expert guidance and support to participants throughout the challenge.\nParticipant Requirements: Participants are required to bring their own laptops, preferably personal devices. Work PCs may encounter access restrictions when using external links, Google Drive, or other necessary resources.\nPreparation and Guidance: An instruction guide will be provided to all participants, outlining any pre-session preparations. This guide will also be made available on the website for easy reference and updates.\nThis session is an excellent opportunity to enhance practical skills, collaborate with peers, and gain valuable insights into solving complex data challenges.", "speakers": [{"name": "Muniba Talha", "org": "Business Academy Copenhagen", "photo": "https://static.swapcard.com/public/images/4f0208d3802c44cdaa9dd742377505b2.jpeg"}, {"name": "Sudeshna Sen", "org": "Financial Services Compensation Scheme (FSCS)", "photo": "https://static.swapcard.com/public/images/2826c43bf1fd44bfa299fa69476267e6.png"}]}, {"id": "UGxhbm5pbmdfNDQ2MzMzMg==", "title": "Morning Break", "start": "2026-06-10T11:00:00+01:00", "end": "2026-06-10T11:35:00+01:00", "track": "Impact Arena", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQzMzA4OQ==", "title": "AI governance challenges --- how to build trust", "start": "2026-06-10T11:00:00+01:00", "end": "2026-06-10T11:50:00+01:00", "track": "Masterclass", "description": "Strong AI deployment relies on rigorous, trustworthy governance. The AI governance challenges – how to build trust masterclass explores the practical, ethical, and regulatory complexities shaping today’s AI landscape. Drawing on SGS’s expertise in AI assurance and certification, the session outlines how organisations can enhance transparency, manage risk, and align with key frameworks such as the EU AI Act and ISO/IEC 42001. Participants will learn how to build robust governance structures, assess and validate AI systems, and demonstrate their reliability to stakeholders. The masterclass ultimately equips leaders to unlock AI’s benefits while ensuring safety, accountability, and long term digital trust.", "speakers": [{"name": "Michal Cichocki", "org": "SGS Polska Sp.z o.o.", "photo": "https://static.swapcard.com/public/images/0a874cbf8f464cc988db69908b5a85f9.jpeg"}, {"name": "Willy Fabritius", "org": "SGS United Kingdom Limted", "photo": "https://static.swapcard.com/public/images/ee2f85a58aeb416ba7186a59e48d40b8.jpeg"}, {"name": "Arman Iranfar", "org": "CertX AG", "photo": "https://static.swapcard.com/public/images/7ade351876994770b8aa721379a87533.jpeg"}, {"name": "Mohammed Renu Iqbal", "org": "SGS United Kingdom Limited", "photo": "https://static.swapcard.com/public/images/91ac08ed3a7d4b8faa56ec2ef03274db.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTI4MQ==", "title": "Morning Break", "start": "2026-06-10T11:05:00+01:00", "end": "2026-06-10T11:35:00+01:00", "track": "Headliners", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTM1Nw==", "title": "Morning Break", "start": "2026-06-10T11:10:00+01:00", "end": "2026-06-10T11:35:00+01:00", "track": "AI Cybersecurity", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQ1OA==", "title": "Morning Break", "start": "2026-06-10T11:10:00+01:00", "end": "2026-06-10T11:35:00+01:00", "track": "Applied AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTMwNw==", "title": "Morning Break", "start": "2026-06-10T11:10:00+01:00", "end": "2026-06-10T11:35:00+01:00", "track": "Beyond AI at Scale", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQwMQ==", "title": "AI for Film Production: Building AI Models for Original IP", "start": "2026-06-10T11:10:00+01:00", "end": "2026-06-10T11:35:00+01:00", "track": "Creative AI", "description": "Building proprietary AI models for entirely original IP using artist-led workflows and synthetic/limited datasets instead of copyright-sensitive training data.\nHow Brad Peyton’s Dark Zone team developed a repeatable process to create new AI models when no existing training data was available.\nPractical strategies for protecting IP rights, scaling creative development with minimal data, and turning dataset limitations into a competitive advantage.", "speakers": [{"name": "Matthew Gyves", "org": "Adobe", "photo": "https://static.swapcard.com/public/images/c4d5752588224ba699d22791f2d5e14c.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTI4Nw==", "title": "Morning Break", "start": "2026-06-10T11:10:00+01:00", "end": "2026-06-10T11:35:00+01:00", "track": "Data Excellence", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQxOQ==", "title": "Morning Break", "start": "2026-06-10T11:10:00+01:00", "end": "2026-06-10T11:35:00+01:00", "track": "Next Generation", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQzMA==", "title": "Morning Break", "start": "2026-06-10T11:10:00+01:00", "end": "2026-06-10T11:35:00+01:00", "track": "Start-up & Investor", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTI2NQ==", "title": "Ministry of Defence Executive Keynote Presentation", "start": "2026-06-10T11:35:00+01:00", "end": "2026-06-10T12:00:00+01:00", "track": "Headliners", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTIwNw==", "title": "Explainable AI: The Key to Trustworthy Cyber Defense", "start": "2026-06-10T11:35:00+01:00", "end": "2026-06-10T12:00:00+01:00", "track": "AI Cybersecurity", "description": "• Understand why explainability is crucial for fostering trust and increasing adoption of AI systems in high-stakes environments, such as healthcare, finance, and safety-critical industries.\n• Learn how Explainable AI (XAI) enhances decision-making processes, minimizes risks, and improves transparency for stakeholders.\n• Apply frameworks and best practices to develop and implement transparent AI security tools that ensure accountability and robustness.", "speakers": [{"name": "Francesco Leofante", "org": "Imperial College London", "photo": "https://static.swapcard.com/public/images/91b97d8e53b740de8ad20730973d378d.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTIxNg==", "title": "Pharma AI Playbook: What Actually Delivers Value?", "start": "2026-06-10T11:35:00+01:00", "end": "2026-06-10T12:00:00+01:00", "track": "Applied AI", "description": "This presentation cuts through the noise to show how pharma companies can move from isolated AI pilots to scalable, value-driven deployments. It covers proven implementation models, data and governance essentials, real-world ROI benchmarks, and the change-management tactics that separate failed experiments from enterprise adoption. Grounded in practitioner experience, it highlights what works, what doesn’t, and the critical steps required to unlock measurable impact across R&D, medical, and commercial functions.", "speakers": [{"name": "Subrata Bose", "org": "Bayer", "photo": "https://static.swapcard.com/public/images/ecb75c43f21b4a71a19e5dd6309d082f.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTA2Ng==", "title": "AI Transformation:From Hype to Human-Centred Change", "start": "2026-06-10T11:35:00+01:00", "end": "2026-06-10T12:00:00+01:00", "track": "Beyond AI at Scale", "description": "• Understand why AI transformation succeeds only when organizations prioritize human behavior, culture, and mindset shifts—not just technology adoption.\n• Gain practical approaches for building “empathy driven” teams where AI boosts baseline efficiency, and humans focus on creativity, intuition, and meaningful work. Learn frameworks for turning internal expertise into scalable, repeatable products that strengthen brand distinctiveness rather than erode it.\n• Discover strategic tools that blend behavioral science, storytelling, and systems thinking to drive real adoption and lasting, human-centred change.", "speakers": [{"name": "Ingrid Olmesdahl", "org": "Ogilvy", "photo": "https://static.swapcard.com/public/images/93e7edd61b72487b94c7957fb66df566.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTI3Mg==", "title": "AI in the Mix: The New Sound of Production", "start": "2026-06-10T11:35:00+01:00", "end": "2026-06-10T12:00:00+01:00", "track": "Creative AI", "description": "• Revolutionizing Composition: Learn how AI tools are transforming music creation, enabling dynamic compositions and innovative soundscapes.\n• Efficiency in Production: Discover how AI streamlines audio production workflows, reducing time and costs while maintaining high-quality output.\n• Creative Collaboration: Explore how AI empowers musicians and sound designers to push creative boundaries and experiment with new genres and styles.", "speakers": [{"name": "Manon Dave", "org": "AKUNA", "photo": "https://static.swapcard.com/public/images/afbff6b5f99c4fe7b218f6a501c4d328.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQzMzA3MA==", "title": "Generative AI for Enterprise Knowledge Management", "start": "2026-06-10T11:35:00+01:00", "end": "2026-06-10T12:00:00+01:00", "track": "Impact Arena", "description": "LLMs to summarize reports, generate insights, assist decision-making; implementation best practices", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQ1NA==", "title": "Reality | Operationalising LLMs in High-Stakes Domains: Building Reliable AI Systems", "start": "2026-06-10T11:35:00+01:00", "end": "2026-06-10T12:00:00+01:00", "track": "Data Excellence", "description": "• Explore the reality of applying LLMs in production systems: Focus on their practical use in high-stakes domains like compliance.\n• Learn about building investigation workflows using LangGraph: Understand how LLM agents coordinate multiple data sources and tools to assist analysts in complex decision-making processes.\n• Address trade-offs in applied AI architectures: Examine challenges such as balancing cost, reliability, latency, and complexity in production systems.\n• Gain lessons from deploying AI in critical areas: Discover strategies for building trust, reliability, and sustainable performance in enterprise platforms.", "speakers": [{"name": "Pratima Upadhyay", "org": "Airbnb", "photo": "https://static.swapcard.com/public/images/8fb79b50bbeb4879bcf2d1a828719da1.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTI1Mw==", "title": "Quantum Leap: How Quantum Computing Will Redefine the Digital World", "start": "2026-06-10T11:35:00+01:00", "end": "2026-06-10T12:00:00+01:00", "track": "Next Generation", "description": "How quantum computers use qubits, leveraging superposition and entanglement to solve complex problems exponentially faster than classical bits\nDeep dives into high-impact sectors, specifically finance (portfolio optimization), healthcare (accelerated drug discovery), and logistics\nAn analysis of current technical hurdles, such as error rates and cooling requirements, as the field moves toward a \"Fault-Tolerant\" era by 2029\nA critical warning on the end of classical encryption and the urgent need for quantum-resistant cryptography\nA strategic outlook for the next 10–15 years, including the sustainability and energy impacts of quantum infrastructure\nLearn more: https://hstalks.com/article/8994/challenges-and-opportunities-of-quantum-computing-/", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTMzOQ==", "title": "The Agentic Era: How Companies Change - and Stay Competitive", "start": "2026-06-10T11:35:00+01:00", "end": "2026-06-10T12:00:00+01:00", "track": "Start-up & Investor", "description": "Key shifts in the agentic era - As agents take on decision-making, how this reshapes the future of work and the way companies operate\nWhat breaks first inside companies - Where workflows, ownership and execution stop working in practice when agents are deployed into real operations\nWhere advantage is moving - How founders and investors rethink how companies are built, operated and funded as agentic systems become standard", "speakers": [{"name": "Barry Downes", "org": "SVV (Sure Valley Ventures)", "photo": "https://static.swapcard.com/public/images/a5903196bdf44ca09171d8df621660d0.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ1NzY1NA==", "title": "Short Break", "start": "2026-06-10T12:00:00+01:00", "end": "2026-06-10T12:10:00+01:00", "track": "AI Cybersecurity", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTMyOQ==", "title": "Short Break", "start": "2026-06-10T12:00:00+01:00", "end": "2026-06-10T12:10:00+01:00", "track": "Applied AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYzMw==", "title": "Short Break", "start": "2026-06-10T12:00:00+01:00", "end": "2026-06-10T12:10:00+01:00", "track": "Beyond AI at Scale", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYzMQ==", "title": "Short Break", "start": "2026-06-10T12:00:00+01:00", "end": "2026-06-10T12:10:00+01:00", "track": "Creative AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQzNTUwOQ==", "title": "Short Break", "start": "2026-06-10T12:00:00+01:00", "end": "2026-06-10T12:10:00+01:00", "track": "Data Excellence", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQzMzA4Nw==", "title": "From AI Theatre to Enterprise Advantage: Building Systems That Deliver Real Business Impact", "start": "2026-06-10T12:00:00+01:00", "end": "2026-06-10T12:50:00+01:00", "track": "Masterclass", "description": "Rather than presenting theory or isolated case studies, this session is a hands-on working session where participants will collaborate to design a production-ready AI reference architecture in real time. Using live input from the room — including participant tech stacks, data challenges, and organisational constraints — the session will build a practical blueprint for embedding AI into real enterprise environments.\nGrounded in insights from Griffiths Waite’s Rebuilding the Enterprise Moat research, the session explores why many organisations are stuck in “AI theatre” — driven by tool-led experimentation, disconnected pilots, and fragmented systems — and what it takes to move toward integrated, outcome-driven AI capability.\nAt the centre of this shift is the fusion stakeholder: the leader responsible for connecting business outcomes with technical execution. This masterclass is designed to equip attendees with the practical tools, frameworks, and decision-making approaches needed to operate effectively in that role.\nThis is not about AI potential. It is about building systems that work — grounded in your organisation’s context, integrated with existing workflows, and designed to deliver measurable business results.\nWhat you’ll experience\n• A live, interactive session where a reference AI architecture is built collaboratively using participant input\n• Real-time polling to surface common challenges, gaps, and constraints across enterprise environments\n• Practical discussion grounded in real delivery experience, not theoretical models\n• A clear connection between business problems, product thinking, and technical implementation\nWhat you’ll learn\n• Why most AI initiatives fail to deliver impact — and how to avoid innovation theatre, pilot traps, and tool-led thinking\n• How to identify and prioritise AI opportunities that align to real business outcomes\n• What it takes to move from experimentation to production-grade systems that scale\n• How to design AI systems that are integrated, secure, and maintainable within complex enterprise environments\nWhat you’ll leave with\n• A completed reference architecture built during the session, tailored to real-world enterprise constraints\n• Access to supporting materials including:\no AI maturity and fusion stakeholder assessments\no The Enterprise Moat white paper\no The architecture artefacts and supporting content\n• A clear, actionable framework you can apply immediately within your organisation\n• Practical next steps to move from AI activity to measurable business impact\n\nWhy this matters\nMost organizations are not failing to adopt AI — they are failing to translate it into sustained competitive advantage. The gap is not tooling; it is clarity, structure, and execution.\nThis session provides a practical, structured path to closing that gap.\nWho should attend\n• CIOs, CTOs, Chief AI/Data Officers\n• Product, transformation, and innovation leaders\n• Senior business leaders accountable for technology-enabled outcomes\n• “Fusion stakeholders” operating across business and technology", "speakers": [{"name": "Mark Simpson", "org": "Griffiths Waite", "photo": "https://static.swapcard.com/public/images/f3d775290a5744f484f865c98f0bc0a5.jpeg"}, {"name": "Leon Barrett", "org": "Griffiths Waite", "photo": "https://static.swapcard.com/public/images/76cb33e9d3f245de93ab2d9c5296f409.jpeg"}, {"name": "Imran Khan", "org": "Griffiths Waite", "photo": "https://static.swapcard.com/public/images/2f6b2506f284482fa62145439457f22e.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ1NzYyNg==", "title": "Short Break", "start": "2026-06-10T12:00:00+01:00", "end": "2026-06-10T12:10:00+01:00", "track": "Next Generation", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ2MTUyMA==", "title": "Elsewhen Executive Keynote", "start": "2026-06-10T12:10:00+01:00", "end": "2026-06-10T12:35:00+01:00", "track": "Headliners", "description": "", "speakers": [{"name": "Leon Gauhman", "org": "Elsewhen", "photo": "https://static.swapcard.com/public/images/9b41c3abf37d4839a3e2f5a147b6b4a5.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTA4Mw==", "title": "AI Sprawl: The Hidden Risk Threatening Your Enterprise Now (And How to Stop It)", "start": "2026-06-10T12:10:00+01:00", "end": "2026-06-10T12:35:00+01:00", "track": "AI Cybersecurity", "description": "• AI sprawl is a growing threat — The unchecked proliferation of AI agents, shadow AI, and fragmented pipelines puts data quality and compliance at serious risk.\n• You can take back control — Discover practical strategies to map your AI ecosystem, surface hidden assets, and implement governance frameworks that bring clarity and accountability.\n• Govern smarter, not slower — Learn how to orchestrate data flows and ensure lineage in AI-driven decisions, so your organisation can maintain compliance without slowing down innovation.", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ2MDk3NA==", "title": "The Hidden Bottleneck in Scientific AI: Why Infrastructure Determines Discovery", "start": "2026-06-10T12:10:00+01:00", "end": "2026-06-10T12:35:00+01:00", "track": "Applied AI", "description": "As AI becomes crucial to scientific discovery, a new constraint is emerging: infrastructure. From large-scale biological models to high-throughput simulation and multimodal data integration, scientific AI workloads are pushing beyond the limits of traditional compute and data architectures.\n\nThis keynote explores how infrastructure choices combined with a full stack solution directly shape the pace and reliability of scientific progress. It examines the interplay between compute, data pipelines, orchestration tools and experimental workflows, and how misalignment between them can stall even the most promising AI initiatives.\n\nThrough practical examples, the session highlights how leading Digital Biology organisations are rethinking their platforms to support reproducible, scalable, and cost-effective scientific AI unlocking faster iteration, stronger validation, and ultimately, greater real-world impact.", "speakers": [{"name": "Ilya Burkov", "org": "Nebius", "photo": "https://static.swapcard.com/public/images/c948e085867c4203be6e855066f77ac1.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQzMzEwNg==", "title": "Sovereign AI is within your reach", "start": "2026-06-10T12:10:00+01:00", "end": "2026-06-10T12:35:00+01:00", "track": "Beyond AI at Scale", "description": "As governments and enterprises race to scale AI, a fundamental shift is underway - success is no longer defined by how fast you adopt AI, but by how well you control it.  \nRegulatory pressure, geopolitical uncertainty, and the rise of mission-critical AI systems are forcing leaders to rethink where AI runs, who governs it, and how decisions can be proven under scrutiny.  \nLearn why sovereignty is becoming the new foundation for AI, moving beyond data residency to operational, technological, and governance control.  \nSee how leading organizations are transitioning from experimentation to production by embedding sovereignty into the architecture itself. \nThe future of AI isn’t just powerful - it’s provable, governed, and sovereign by design.", "speakers": [{"name": "Daniel Moul", "org": "IBM", "photo": "https://static.swapcard.com/public/images/2855ea7529374a65bcb46a7585317151.png"}]}, {"id": "UGxhbm5pbmdfNDQzMzA5Mg==", "title": "AI That Fits Your Business, Not the Other Way Around", "start": "2026-06-10T12:10:00+01:00", "end": "2026-06-10T12:35:00+01:00", "track": "Creative AI", "description": "Most AI platforms expect you to reshape your operations around their constraints: centralise your data, commit to their cloud, and accept their model choices. But enterprises don't work that way. This session challenges the one-size-fits-all approach to enterprise AI. We'll explore why the gap between general AI and your AI is where real value gets created and examine a different approach: one where models connect to your data wherever it lives, where you choose right-sized models that balance cost and capability, and where you deploy on infrastructure that makes sense for your business. If you're tired of being told to adapt to AI rather than having AI adapt to you, this talk is for you.", "speakers": [{"name": "Robbie Jerrom", "org": "Red Hat", "photo": "https://static.swapcard.com/public/images/454ee47ecb7443c2b70d30ed9c5a4afc.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQzNTUwOA==", "title": "Why Your AI Keeps Getting It Wrong: The Semantic Backbone Fix", "start": "2026-06-10T12:10:00+01:00", "end": "2026-06-10T12:35:00+01:00", "track": "Data Excellence", "description": "Most enterprise AI failures aren't model failures: they're meaning failures. When LLMs don't share your business's definitions of \"customer,\" \"risk,\" or \"compliant,\" every downstream decision inherits that ambiguity. This session introduces the Semantic Backbone: a knowledge infrastructure that enforces a single, governed semantic agreement across fragmented data silos, grounding LLMs in the business logic that actually matters. We'll show how Semantic GraphRAG architectures reduce hallucinations by up to 90% and make AI reasoning explainable and auditable, without rebuilding your data stack. Data and AI leaders will leave with a concrete framework for moving from brittle prototypes to production-grade, domain-aware AI systems.\n• Diagnose why fragmented data definitions are the root cause of most enterprise AI failures in production\n• Explore the Semantic Backbone as a governed knowledge infrastructure that enforces unified business logic across silos, giving LLMs a reliable foundation to reason from\n• Examine how Semantic GraphRAG delivers explainable, auditable AI outputs, and what a practical transition from prototype to production looks like for data leaders", "speakers": [{"name": "Andreas Blumauer", "org": "Graphwise", "photo": "https://static.swapcard.com/public/images/5f140cc4959f4eea869414e60deff39c.png"}]}, {"id": "UGxhbm5pbmdfNDQzNDA5NQ==", "title": "Presentation by Senior Representative from KPMG", "start": "2026-06-10T12:10:00+01:00", "end": "2026-06-10T12:35:00+01:00", "track": "Next Generation", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQzMzEwNA==", "title": "Lunch Break", "start": "2026-06-10T12:20:00+01:00", "end": "2026-06-10T13:35:00+01:00", "track": "Impact Arena", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQzOQ==", "title": "Lunch Break", "start": "2026-06-10T12:35:00+01:00", "end": "2026-06-10T13:35:00+01:00", "track": "Headliners", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQzNw==", "title": "Lunch Break", "start": "2026-06-10T12:35:00+01:00", "end": "2026-06-10T13:35:00+01:00", "track": "AI Cybersecurity", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQzNg==", "title": "Lunch Break", "start": "2026-06-10T12:35:00+01:00", "end": "2026-06-10T13:35:00+01:00", "track": "Applied AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTIzMA==", "title": "Lunch Break", "start": "2026-06-10T12:35:00+01:00", "end": "2026-06-10T13:35:00+01:00", "track": "Beyond AI at Scale", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTMzOA==", "title": "Lunch Break", "start": "2026-06-10T12:35:00+01:00", "end": "2026-06-10T13:35:00+01:00", "track": "Creative AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTA2MQ==", "title": "Lunch Break", "start": "2026-06-10T12:35:00+01:00", "end": "2026-06-10T13:35:00+01:00", "track": "Data Excellence", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQwNQ==", "title": "Lunch Break", "start": "2026-06-10T12:35:00+01:00", "end": "2026-06-10T13:35:00+01:00", "track": "Next Generation", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTIyOA==", "title": "Lunch Break", "start": "2026-06-10T12:35:00+01:00", "end": "2026-06-10T13:35:00+01:00", "track": "Start-up & Investor", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQzMzA4Ng==", "title": "Governing the machine in the age of AI agents", "start": "2026-06-10T13:00:00+01:00", "end": "2026-06-10T13:50:00+01:00", "track": "Masterclass", "description": "What to expect:\nThis masterclass examines why AI governance has become a strategic necessity as organisations move beyond conventional and generative AI toward increasingly autonomous AI agents. It explores how agentic AI changes the risk landscape: these systems do not simply generate content but can make decisions, take actions, interact with tools and systems, and operate at speed and scale. That shift creates new forms of risk, including cascading failures across multi-agent systems, expanded operational and cyber exposure, reduced reversibility, greater workforce strain, and unexpected behaviours with real-world consequences. The session explains why older governance approaches are no longer sufficient and why organisations must move from model validation alone toward testing, guardrails, staged autonomy, fail-safes, monitoring, and stronger human oversight.\nKey takeaways:\n• Attendees will gain a practical understanding of how to govern AI agents in real organisational settings. \n• The masterclass highlights approaches such as permissions and policy controls, human-in-the-loop monitoring, circuit breakers and kill-switches, agentic risk classification, logging and record-keeping, credential management, and governance platforms that connect controls, approvals, assessments and ongoing monitoring across the AI lifecycle.\n• It also covers the nine key AI risk areas and shows how agentic systems intensify or reshape many of them.\nWhat you will learn:\nParticipants will learn how agentic AI differs from earlier forms of AI, what new risks it introduces, and what leading organisations are doing to govern these systems responsibly while still enabling innovation, trust and business value.\nWho should attend:\nThis session is designed for senior leaders, risk and compliance teams, technology and data leaders, legal and policy specialists, security professionals, and anyone responsible for deploying, overseeing or scaling AI systems, especially agentic AI, within an organisation.", "speakers": [{"name": "Paul Dongha", "org": "NatWest Bank", "photo": "https://static.swapcard.com/public/images/702766e7f5a046a3b756d8972cc65c9a.png"}, {"name": "Ray Eitel-Porter", "org": "The Intellectual Forum, Jesus College Cambridge", "photo": "https://static.swapcard.com/public/images/6ee8c1c1a96f4a43892125dd72b554ea.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTA5MQ==", "title": "Panel: AI Sovereignty – Possibility or Pipe Dream for Europe?", "start": "2026-06-10T13:35:00+01:00", "end": "2026-06-10T14:15:00+01:00", "track": "Headliners", "description": "Explore the geopolitical stakes of AI, from control over data and platforms to the risks of dependence on external powers. Europe faces a critical choice: should it build domestic AI platforms or continue relying on global providers? The debate extends to governance and competitiveness – how can Europe balance regulation with technological leadership without stifling innovation? This panel brings together leading experts to examine these trade-offs, explore what it would take for Europe to achieve AI independence, and discuss the strategic moves needed to lead in the global AI race.", "speakers": [{"name": "Sasha Rubel", "org": "Amazon Web Services", "photo": "https://static.swapcard.com/public/images/785aab78c9714b8cb8e2424c3ecb3604.jpeg"}, {"name": "Sonia Nash", "org": "SAP", "photo": "https://static.swapcard.com/public/images/8e021abb76104e07b46d25dfd92ee1e1.jpeg"}, {"name": "Jim Carter", "org": "Ministry of Defence", "photo": "https://static.swapcard.com/public/images/88b5539882ab4f04964b7e3c415f3660.jpeg"}, {"name": "Ollie Ilott", "org": "Department for Science, Innovation and Technology", "photo": "https://static.swapcard.com/public/images/536c629a73d34adaae585eb04fe3563d.jpeg"}, {"name": "Dr Stephanie Hare", "org": "", "photo": "https://static.swapcard.com/public/images/d6e28f33b75f4399be2449f3be9a941d.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTA2Mg==", "title": "Panel: AI Vanguard: Resilient Cyber Defence Strategies", "start": "2026-06-10T13:35:00+01:00", "end": "2026-06-10T14:15:00+01:00", "track": "AI Cybersecurity", "description": "• Learn how to cultivate adaptability and resilience within teams to adopt AI-driven security innovations.\n• Explore strategies for creating hybrid systems that integrate AI capabilities with human oversight to achieve the best results.\n• Understand how leadership approaches can manage resistance, align workflows, and facilitate the smooth integration of AI-powered cybersecurity solutions.", "speakers": [{"name": "Ali Jaffri", "org": "Diabetes UK", "photo": "https://static.swapcard.com/public/images/959aa5ed7d9a400a9e2094ea6e91bd93.jpeg"}, {"name": "Danit Nativ Navon", "org": "Meta", "photo": "https://static.swapcard.com/public/images/0504918d646446bab69ef1f912cdd31d.jpeg"}, {"name": "Akshay Bajaj", "org": "Mastercard", "photo": "https://static.swapcard.com/public/images/d1d54e435dad4f718af23d044f6351a5.jpeg"}, {"name": "Alina Timofeeva", "org": "Unique.Bold.You.", "photo": "https://static.swapcard.com/public/images/6a6f5ed646d343379d37024704ad4919.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTE2NQ==", "title": "Panel: Trusted Agents in R&D: Where Autonomy Ends and Oversight Begins", "start": "2026-06-10T13:35:00+01:00", "end": "2026-06-10T14:15:00+01:00", "track": "Applied AI", "description": "Agentic systems are evolving from copilots to workflow executors, yet in regulated R&D trust, traceability and control matter as much as speed. This panel maps what agents can safely automate today and where explicit human sign‑off is essential. We will examine autonomy boundaries, approval ladders and audit‑ready evidence – focusing on how to scale automation responsibly while preserving accountability.", "speakers": [{"name": "Meera Patel", "org": "Lead, AI Governance and Regulation", "photo": "https://static.swapcard.com/public/images/ec193980f8a248f0938e419b1e1c6f52.jpeg"}, {"name": "Subrata Bose", "org": "Bayer", "photo": "https://static.swapcard.com/public/images/ecb75c43f21b4a71a19e5dd6309d082f.jpeg"}, {"name": "Margi Sheth", "org": "Novo Nordisk", "photo": "https://static.swapcard.com/public/images/7d66cb4027704ff4abc3eff14ad29b8e.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTE5Mw==", "title": "Panel: The AI Workforce Revolution: Leading the Next Era of Work", "start": "2026-06-10T13:35:00+01:00", "end": "2026-06-10T14:15:00+01:00", "track": "Beyond AI at Scale", "description": "• Discover how leaders reshape roles and responsibilities for hybrid human AI workforces, including autonomous AI “employees.”\n• Learn how AI transforms service, engineering, and operational workflows, reshaping productivity and value creation. Identify the leadership and management skills required to run hybrid human–AI teams effectively.\n• Understand how shifting from producing work to supervising AI generated output disrupts entry-level roles and demands new talent pipelines.", "speakers": [{"name": "Sara Maldon", "org": "Make", "photo": "https://static.swapcard.com/public/images/38aaf236540e4280a6604351c462b5c3.jpeg"}, {"name": "Michal Kendereski", "org": "Publicis Health", "photo": "https://static.swapcard.com/public/images/f4713f391e764ef29a31949cb4d850cb.jpeg"}, {"name": "DP Indetkar", "org": "Northern Trust", "photo": "https://static.swapcard.com/public/images/5d0d2722af804fcf817f47d92228731d.jpeg"}, {"name": "Sue Attewell", "org": "Jisc", "photo": "https://static.swapcard.com/public/images/40f77d65991e4fb0a7b839a3c70d9537.png"}, {"name": "Joshua Builta", "org": "Omdia", "photo": "https://static.swapcard.com/public/images/0eadc7286ce64ae69399de2869883a4e.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTQ1MQ==", "title": "Panel: Reel Innovation: How AI is Redefining Movie Magic", "start": "2026-06-10T13:35:00+01:00", "end": "2026-06-10T14:15:00+01:00", "track": "Creative AI", "description": "• Discover how AI tools enable dynamic storytelling, visuals, and workflows, redefining cinematic possibilities.\n• Learn how AI-driven visual effects push boundaries with real-time rendering, immersive environments, and cost savings.\n• See how AI accelerates production while maintaining quality, helping filmmakers realize their vision faster. Find out how AI-powered pipelines speed up creating campaign assets, transmedia stories, and reusable IPs for marketing.", "speakers": [{"name": "Ryan Phillips", "org": "Uncanny Harry Productions", "photo": "https://static.swapcard.com/public/images/d32de8f24c29417ba76c31f1f051c40a.jpeg"}, {"name": "Jimmy Woolley", "org": "404 Films", "photo": "https://static.swapcard.com/public/images/913a0702c0f340019e7ecb198ec9e518.png"}, {"name": "David Johnston", "org": "BFI", "photo": "https://static.swapcard.com/public/images/0d91d8d4312b4d359fe9e88252d75058.png"}, {"name": "Fred Gifford", "org": "Sony AI", "photo": "https://static.swapcard.com/public/images/a988a3796e474ae7af661fb64184036f.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQzMzA5Nw==", "title": "Real-Time Analytics at Scale: Building a Data Lakehouse", "start": "2026-06-10T13:35:00+01:00", "end": "2026-06-10T14:00:00+01:00", "track": "Impact Arena", "description": "Combine streaming and batch analytics; governance, quality, and operational use cases", "speakers": [{"name": "Vitaly Baranov", "org": "Aon", "photo": "https://static.swapcard.com/public/images/d5f822e077144c53bdc9b589898c20a4.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTEwOA==", "title": "Panel: Governance | Redesigning Governance to Empower Engineers", "start": "2026-06-10T13:35:00+01:00", "end": "2026-06-10T14:15:00+01:00",
