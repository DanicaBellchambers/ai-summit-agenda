nd Act Without You", "start": "2026-06-11T09:00:00+01:00", "end": "2026-06-11T09:25:00+01:00", "track": "Headliners", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1MjI1NA==", "title": "From Copilot to Colleague: What it takes to become a frontier firm", "start": "2026-06-11T09:50:00+01:00", "end": "2026-06-11T10:15:00+01:00", "track": "Headliners", "description": "Insights from the world’s largest corporate AI agent study show how organisations can boost performance, build trust and scale by redesigning work around human–agent teams.", "speakers": [{"name": "Chris Withers", "org": "EY", "photo": "https://static.swapcard.com/public/images/66695e6b2642473b8a8e5abd5007fa95.png"}]}, {"id": "UGxhbm5pbmdfNDQ2MjI4Nw==", "title": "Chair’s Opening Remarks", "start": "2026-06-11T10:00:00+01:00", "end": "2026-06-11T10:05:00+01:00", "track": "VisionAIres", "description": "", "speakers": [{"name": "Matthew Blakemore", "org": "Independent", "photo": "https://static.swapcard.com/public/images/4ddb643f6b3b459e86087694697ece8f.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTQzMw==", "title": "Chairperson's Welcome Remarks", "start": "2026-06-11T10:05:00+01:00", "end": "2026-06-11T10:10:00+01:00", "track": "Applied AI", "description": "", "speakers": [{"name": "Davar Ardalan", "org": "bAI Labs", "photo": "https://static.swapcard.com/public/images/b7356aac08b5442d9b1546f94f9e7a09.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTA4OA==", "title": "Chairperson’s Welcome Remarks", "start": "2026-06-11T10:05:00+01:00", "end": "2026-06-11T10:10:00+01:00", "track": "Beyond AI at Scale", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQxNA==", "title": "Chairperson’s Welcome Remarks", "start": "2026-06-11T10:05:00+01:00", "end": "2026-06-11T10:10:00+01:00", "track": "Creative AI", "description": "", "speakers": [{"name": "Phill Turner", "org": "phill.ai ltd", "photo": "https://static.swapcard.com/public/images/a3db813463de458ebd10a84056e601dc.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQzMzA4NQ==", "title": "Chairperson’s Welcome Remarks", "start": "2026-06-11T10:05:00+01:00", "end": "2026-06-11T10:10:00+01:00", "track": "Impact Arena", "description": "", "speakers": [{"name": "Nadia Abouayoub", "org": "N/A", "photo": "https://static.swapcard.com/public/images/3e72680574214c9f86c5fb54cb38c814.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTQwMA==", "title": "Chairperson's Welcome Remarks", "start": "2026-06-11T10:05:00+01:00", "end": "2026-06-11T10:10:00+01:00", "track": "Data Excellence", "description": "", "speakers": [{"name": "Benjamin Skuse", "org": "Benjamin Skuse Science Communication", "photo": "https://static.swapcard.com/public/images/312a6216415e495fb044d4e8a2857232.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTI1OQ==", "title": "Chairperson's Welcome Remarks", "start": "2026-06-11T10:05:00+01:00", "end": "2026-06-11T10:10:00+01:00", "track": "Finance", "description": "", "speakers": [{"name": "Henrike Mueller", "org": "Financial Conduct Authority", "photo": "https://static.swapcard.com/public/images/149dfb77a9dc4a5ea44dd031b4660f17.png"}]}, {"id": "UGxhbm5pbmdfNDQzMzEwMw==", "title": "How to Create Authentic Social Content With AI", "start": "2026-06-11T10:05:00+01:00", "end": "2026-06-11T10:50:00+01:00", "track": "Masterclass", "description": "Craft content that feels human, truthful, and culturally relevant, powered, not flattened, by AI. Discover how AI can elevate social storytelling without compromising authenticity, originality, or emotional nuance. This masterclass gives social teams, creators, and brand leaders the practical frameworks they need to blend AI‑assisted creation with real human insight. Learn how to use AI for ideation, production, and experimentation while maintaining the voice, values, and cultural specificity that make content resonate.\nWhat You’ll Learn \n• How to use AI tools to generate concepts, captions, scripts, and formats that stay true to your brand’s tone and community expectations.\n• How to evaluate AI’s capabilities and limitations in short‑form storytelling, narrative consistency, brand safety, and visual accuracy.\n• How to merge real human experiences with AI‑accelerated iteration to prototype posts, campaigns, and social series with clarity and impact. \nKey Takeaways \n• A clear model for authentic, responsible AI use in social content creation.\n• Side‑by‑side breakdowns of AI‑assisted vs. traditional content pipelines.\n• A live demo: turning raw ideas or community insights into polished social content.\n• A renewed mindset: AI as a tool to amplify human voice, not automate it. \nWhy This Matters \nAudiences can sense content that feels generic, shallow, or algorithmically generated. Social teams are under pressure to produce more content at a higher speed—yet authenticity, cultural nuance, and emotional accuracy matter more than ever. This masterclass reframes AI as a creative ally: a way to explore ideas faster, remove production barriers, personalise content, and test formats—without losing the humanity that builds trust and drives engagement. Social leaders who embrace AI thoughtfully will shape the future of how brands communicate, create culture, and build community online. \nWho Should Attend \nSocial strategists, content creators, community managers, digital leads, and brand builders in:\n• Media & Entertainment\n• Fashion & Lifestyle \n• Branding & Identity\n• Advertising & Creative Studios\n• Culture & Community‑Driven Brands", "speakers": [{"name": "Katie Debrah", "org": "Halo and Echo", "photo": "https://static.swapcard.com/public/images/267457e8e09c46a9817cb644993f3691.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTE5OA==", "title": "Chairperson’s Welcome Remarks", "start": "2026-06-11T10:05:00+01:00", "end": "2026-06-11T10:10:00+01:00", "track": "Next Generation", "description": "", "speakers": [{"name": "KERRY SHEEHAN", "org": "UK Government", "photo": "https://static.swapcard.com/public/images/eef4a3e2f1fd4c289916d08ccaa1ca0b.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ1ODgyNg==", "title": "The AI Talent Paradox", "start": "2026-06-11T10:05:00+01:00", "end": "2026-06-11T10:35:00+01:00", "track": "VisionAIres", "description": "Reveal the hidden costs of AI hiring, premium salaries, retention incentives, and specialized tools that quietly inflate budgets.\n\nDistinguish between hype-driven skills and mission-critical AI capabilities that actually deliver impact.\n\nIdentify the right talent, forecast workforce needs, and structure teams to maximize ROI while avoiding burnout and attrition.", "speakers": [{"name": "David Palmer", "org": "Pairpoint by Vodafone", "photo": "https://static.swapcard.com/public/images/589ea2c3f0b44fd6a1ddb2185ff5beaf.jpeg"}, {"name": "Lawrence Ampofo", "org": "Vodafone", "photo": "https://cdn-api.swapcard.com/public/images/8f9d8e75d4914600b8373f06831b4dc9.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTIzNw==", "title": "Reality | Industrial AI in Action: What Works and Why", "start": "2026-06-11T10:10:00+01:00", "end": "2026-06-11T10:35:00+01:00", "track": "Applied AI", "description": "Where Industrial AI is genuinely delivering value today (and where it isn’t).\nWhy adoption in industrial environments progresses differently compared to enterprise AI.\nExamine the real constraints shaping progress: safety, regulation, legacy systems, and risk.", "speakers": [{"name": "Adrian O'Neill", "org": "bp", "photo": "https://static.swapcard.com/public/images/2fd611f6089542c6b097394bbda080b4.jpeg"}, {"name": "Dragi Laz", "org": "BP", "photo": "https://static.swapcard.com/public/images/8d884c536ebd452fa89de8bf61ed26a6.png"}, {"name": "Clare Williams Nagassar", "org": "bp", "photo": "https://static.swapcard.com/public/images/fc0db9fe17064c40a2314825e8317784.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTMxOA==", "title": "Industrial Intelligence: Forging the railways next technological revolution", "start": "2026-06-11T10:10:00+01:00", "end": "2026-06-11T10:35:00+01:00", "track": "Beyond AI at Scale", "description": "For over 200 years, the railway has been shaped by invention and innovation. But the adoption of intelligent technologies is not inevitable in the modern system. Deep structural complexity, fragmentation across organisations, and designed-in barriers spanning safety, regulation and commercial structures mean that just because something exists does not mean it is adoptable.\nThis keynote sets out what it takes to change that.\nDrawing on the recently mobilised Artificial Intelligence in Rail: Industry AI Action Plan, it presents a deliberate, sector-wide approach to industrialising AI, through orchestrated, purposeful action, the development of strategic capability, and the creation of new industrial pathways. Through targeted interventions and real-world pathfinders, this approach is advancing the application of AI across operational and customer domains, unlocking capabilities that were not previously possible.", "speakers": [{"name": "Toufic Machnouk", "org": "Network Rail", "photo": "https://static.swapcard.com/public/images/03c31c9437e24fd99a198bd0b63dbbc1.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ1NzYxNQ==", "title": "Who is Writing your Brand’s Soul and why you need a Constitution", "start": "2026-06-11T10:10:00+01:00", "end": "2026-06-11T10:35:00+01:00", "track": "Creative AI", "description": "Every brand using generative AI is sitting on top of a Value Stack it didn't design. Most are governing it with guidelines written for humans, not machines. But guidelines tell you what. A constitution explains the why. Inspired by Anthropic's constitution for Claude, which teaches AI to reason from values rather than follow rules, this talk argues that a brand's soul, embedded into a working constitution, becomes the operating system for an agentic future, teaching both people and AI the values to apply when no one's watching.\n\nWe're trialling this at McCann, baking a Brand Soul Document into our own stack and using it to navigate the ethical conundrums that are landing on our desks with increasing regularity from clients. I'll share what we're learning and why it matters now.", "speakers": [{"name": "Jonathan Brown", "org": "McCann London", "photo": "https://static.swapcard.com/public/images/afa8ef987400437b960c9af5c75cf784.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQzMzEwMg==", "title": "Future of AI in Interplanetary Space", "start": "2026-06-11T10:10:00+01:00", "end": "2026-06-11T10:35:00+01:00", "track": "Impact Arena", "description": "Autonomous Exploration & Intelligent Satellites: AI will enable rovers to navigate and analyze planetary environments independently, while satellites process massive data streams, perform collision avoidance, and manage communication networks in real-time. \n\nSpace-Based Data & Human Support: AI-driven data centers in space could handle high-intensity workloads, while AI assists astronauts with life-support systems, repairs, and psychological support during long-term missions. \n\nSustainable Space Operations: AI will play a key role in tracking and cleaning orbital debris, ensuring safe and sustainable operations across increasingly crowded interplanetary space.", "speakers": [{"name": "Joel Singh", "org": "GEC Space Programme, General Electric Company", "photo": "https://static.swapcard.com/public/images/ceaf62adcf0e4bee823047b069e07e82.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTI3Mw==", "title": "Run | Keeping Models Reliable in Live Systems", "start": "2026-06-11T10:10:00+01:00", "end": "2026-06-11T10:35:00+01:00", "track": "Data Excellence", "description": "• Explore how upstream data changes impact downstream models and the strategies used to manage these dependencies effectively.\n• Learn how teams detected drift and dependency issues in production environments, ensuring models remained reliable and actionable.\n• Gain insights into frameworks that prioritise long-term reliability over short-term optimisation for sustainable AI operations.", "speakers": [{"name": "Priyanka Kamila", "org": "Mo-Sys Engineering Ltd.", "photo": "https://static.swapcard.com/public/images/090a97989754400992f0b687a6f927ce.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTQxOA==", "title": "Looking Ahead | Agentic AI in Financial Services - What’s Ready Now and What’s Next", "start": "2026-06-11T10:10:00+01:00", "end": "2026-06-11T10:35:00+01:00", "track": "Finance", "description": "• Discover where agentic AI is actively transforming banking, insurance, and payments, from internal operations to customer-facing workflows.\n• Understand how financial institutions determine the right level of autonomy—assisted, semi-autonomous, or fully autonomous—while navigating regulatory constraints.\n• Gain insights into how industry leaders assess readiness for agentic AI and outline practical, actionable steps to scale safely and effectively.", "speakers": [{"name": "Peter Brown", "org": "Lloyds Banking Group", "photo": "https://static.swapcard.com/public/images/82459a3b4fdc45c8849954160bef0e9e.jpeg"}, {"name": "Dr. Pedro Freire", "org": "Lloyds Banking Group", "photo": "https://static.swapcard.com/public/images/1dbc8e5ba7cb4bafb8122897ca10ba28.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTI0OQ==", "title": "Scaling AgentOps: Observability, Safety and Control in Production AI", "start": "2026-06-11T10:10:00+01:00", "end": "2026-06-11T10:35:00+01:00", "track": "Next Generation", "description": "• As organisations move from single models to connected agent systems, the challenge shifts to how agents interact, how they are evaluated, and how their behaviour can be monitored in real production environments.\n• This presentation explores what it takes to operationalise agentic AI in practice – from observability and evaluation to deploying agents safely and reliably across enterprise workflows.\n• Through real-world examples, we look at how teams are building responsible AgentOps frameworks to scale multi-agent systems in production while maintaining control, trust and measurable business impact.", "speakers": [{"name": "Andy McMahon", "org": "Barclays", "photo": "https://static.swapcard.com/public/images/b4e869eba3834cd682285f42aa011216.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTM0Ng==", "title": "From Conversational AI to Deepfakes: Building—and Breaking—Digital Reality", "start": "2026-06-11T10:15:00+01:00", "end": "2026-06-11T10:40:00+01:00", "track": "Headliners", "description": "How close AI is to truly natural, human-level conversation—and what’s still missing\nInside photorealistic avatars: how AI creates believable digital humans\nThe double edge: real-world applications vs. the growing threat of deepfakes", "speakers": [{"name": "Maja Pantic", "org": "Natwest", "photo": "https://static.swapcard.com/public/images/8f78c4d75314472c9dbbe8b75bc655f6.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ2MjYxMA==", "title": "Short Break", "start": "2026-06-11T10:35:00+01:00", "end": "2026-06-11T10:45:00+01:00", "track": "Applied AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYzNA==", "title": "Short Break", "start": "2026-06-11T10:35:00+01:00", "end": "2026-06-11T10:45:00+01:00", "track": "Beyond AI at Scale", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYyOQ==", "title": "Short Break", "start": "2026-06-11T10:35:00+01:00", "end": "2026-06-11T10:45:00+01:00", "track": "Creative AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYxMA==", "title": "Short Break", "start": "2026-06-11T10:35:00+01:00", "end": "2026-06-11T10:45:00+01:00", "track": "Next Generation", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ0OTUxMw==", "title": "Revealing our Future: The Secret Innovations Set to Transform Media Creation", "start": "2026-06-11T10:40:00+01:00", "end": "2026-06-11T11:05:00+01:00", "track": "Headliners", "description": "The future of media is being forged by a select group of AI-native pioneers and foundational labs. Nebius is pulling back the curtain on the advancements currently defining the leading edge.\nWe will reveal the specific innovations in gaming, advertising, and content distribution moving from laboratory \"magic\" to global scale. We will explore the \"special projects\" designed for the next billion consumers and how they will fundamentally change how we work and perceive reality. Join us, for an exclusive look at the blueprint of the media revolution before it becomes the industry standard.", "speakers": [{"name": "Joshua Liss", "org": "Nebius", "photo": "https://static.swapcard.com/public/images/6882dc5061864e7995f43c8780caed17.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQzNDA5OA==", "title": "Leading the Future of AI Powered Customer Experiences", "start": "2026-06-11T10:45:00+01:00", "end": "2026-06-11T11:10:00+01:00", "track": "Beyond AI at Scale", "description": "With Agentic AI and an AI-first approach to CX, contact centres are shifting from reactive support to proactive, intelligent engagement, reshaping how brands connect with customers from first interaction to long-term loyalty.\n\nIn this keynote, NiCE explores how agentic AI enables real-time guidance during buying moments, automates end-to-end interactions, and delivers proactive support that drives retention and satisfaction, while equipping teams with insights for continuous improvement.\nThe session offers a practical view of the impact agentic AI is delivering today, and what it takes to unlock its full value across the customer journey.", "speakers": [{"name": "Angela Read Downes", "org": "NiCE", "photo": "https://static.swapcard.com/public/images/6c7c7714a70c4e2ab5a8c12e908c01f1.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQzNDA5NA==", "title": "Presentation by Senior Representative from NICE", "start": "2026-06-11T10:45:00+01:00", "end": "2026-06-11T11:10:00+01:00", "track": "Creative AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQzMzA4Mw==", "title": "Smarter Agents Start with Smarter Data: Delivering Real-Time Context for AI", "start": "2026-06-11T10:45:00+01:00", "end": "2026-06-11T11:10:00+01:00", "track": "Data Excellence", "description": "Imagine making critical business decisions using last month’s data, without the context to understand what’s changed. Now layer agents on top of that. Instead of improving outcomes, AI accelerates the problem.\nAgents can transform how businesses respond, but only when they have real-time data with the right context. But today organizations struggle to capture, contextualize, and persist real-time data for governed access and reusability - leaving AI to rely on incomplete or outdated information.\nIn this session, learn how to deliver real-time data as context for AI from both structured and unstructured sources across hybrid environments. We’ll explore how streaming and historical data integration, governance, and an open, hybrid data foundation work together to power agents and your business to act with confidence, using the right data at the right time.", "speakers": [{"name": "Charna Parkey", "org": "IBM", "photo": "https://static.swapcard.com/public/images/581196f0279744f3805ed3bbc37b57e2.png"}]}, {"id": "UGxhbm5pbmdfNDQzMzA5OQ==", "title": "Morning Break", "start": "2026-06-11T10:55:00+01:00", "end": "2026-06-11T11:35:00+01:00", "track": "Impact Arena", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQzNDA5Mg==", "title": "Unlock stronger AI results with modern data", "start": "2026-06-11T11:00:00+01:00", "end": "2026-06-11T11:50:00+01:00", "track": "Masterclass", "description": "Doing the right AI and doing AI right both start in the same place: your data strategy. In this hands-on masterclass, we'll walk through a real IBM Data Strategy Engagement Session — the same process we use with clients to map their data estate, surface AI-blocking issues, and build a prioritized transformation roadmap. Whether you're just starting, you are early in your AI journey, or trying to scaleup, you'll leave with a clear picture of what a structured, accelerated path to modern data actually looks like — and what it could mean for your organization.", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTMwOA==", "title": "The Irreducible Human Spirit: Human Creativity, Soft Power, and Flourishing Beyond AI", "start": "2026-06-11T11:05:00+01:00", "end": "2026-06-11T11:35:00+01:00", "track": "Headliners", "description": "As synthetic intelligence accelerates beyond the static architecture of human cognition, the stakes for our creative sovereignty have never been higher. Professor Fernando Garibay, Grammy-winning polymath and distinguished academic, reframes AI not as a replacement, but as a substrate that illuminates the irreducible human spirit. Drawing on frontier examples in music and short-form content, he equips attendees with a new paradigm and practice for navigating this age with the conviction of their human spirit.", "speakers": [{"name": "Ramiro (MIRO) Padilla", "org": "Garibay Institute", "photo": "https://static.swapcard.com/public/images/bd69ebcf715645dcb38acab100811b75.jpeg"}, {"name": "Prof. Fernando Garibay", "org": "THE GARIBAY INSTITUTE", "photo": "https://static.swapcard.com/public/images/463825680669489a858a66de41152e52.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTIxMA==", "title": "From Demos to Deployment: A Framework for Measuring Multimodal and Agentic AI Success", "start": "2026-06-11T11:10:00+01:00", "end": "2026-06-11T11:35:00+01:00", "track": "Applied AI", "description": "Learn how to measure success for multimodal AI (e.g., images, complex documents) and agentic systems.\n\nDiscover a three-tiered metric plan covering application-specific, business outcome, and safety metrics.\n\nGain a practical roadmap to transition AI projects from demos to production-ready solutions.\n\nUnderstand what it takes to operationalise AI at scale and deliver measurable business value.", "speakers": [{"name": "Li Fu", "org": "Lloyds Banking Group", "photo": "https://static.swapcard.com/public/images/4d6d8f34b6f4411f8929ea5c8073126a.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTQyNg==", "title": "Short Break", "start": "2026-06-11T11:10:00+01:00", "end": "2026-06-11T11:20:00+01:00", "track": "Beyond AI at Scale", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTI0MQ==", "title": "Short Break", "start": "2026-06-11T11:10:00+01:00", "end": "2026-06-11T11:20:00+01:00", "track": "Creative AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTM0MQ==", "title": "Morning Break", "start": "2026-06-11T11:10:00+01:00", "end": "2026-06-11T11:35:00+01:00", "track": "Data Excellence", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQxNg==", "title": "Morning Break", "start": "2026-06-11T11:10:00+01:00", "end": "2026-06-11T11:35:00+01:00", "track": "Finance", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTEyMA==", "title": "Morning Break", "start": "2026-06-11T11:10:00+01:00", "end": "2026-06-11T11:35:00+01:00", "track": "Next Generation", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTM1Mg==", "title": "Memory at Scale: Building AI That Remembers, Learns & Evolves", "start": "2026-06-11T11:20:00+01:00", "end": "2026-06-11T11:45:00+01:00", "track": "Beyond AI at Scale", "description": "• Understand how persistent memory improves reliability, continuity, and decision quality.\n• Learn how organisational memory reduces errors and speeds up long, multi step work. See how governance, privacy, and retention rules keep memory safe and compliant.\n• Discover how memory enhances AI trustworthiness and stability, allowing for longer, more complex tasks with lower operational and compliance risks.", "speakers": [{"name": "Ankit Bharadwaj", "org": "Liberty Speciality Markets", "photo": "https://static.swapcard.com/public/images/599e783eaaa146c8a7250ab646dd8271.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTQwNw==", "title": "Fireside Chat: Building Trust in the Age of Ethical AI", "start": "2026-06-11T11:20:00+01:00", "end": "2026-06-11T11:45:00+01:00", "track": "Creative AI", "description": "• Move beyond compliance checklists to understand how responsibility and accountability actually work when AI is embedded in creative and editorial decision-making.\n• Explore how creative organisations manage risk without paralysing teams — by supporting judgement, escalation and shared responsibility rather than relying solely on rules or technical guardrails.\n• Examine what transparency and trust really mean in AI-mediated creativity, and how responsible practices can differentiate brands and establish credibility", "speakers": [{"name": "James Fletcher", "org": "BBC", "photo": "https://static.swapcard.com/public/images/e1caa6026dcb43d08cef60149930cdff.jpeg"}, {"name": "Ashley Hazle", "org": "WPP Production", "photo": "https://static.swapcard.com/public/images/ec544954f75c409ebe3d30ce2de62d25.jpeg"}, {"name": "Brian Tarran", "org": "British Film Institute", "photo": "https://static.swapcard.com/public/images/e83879cf08104c9ba7464037095b4ba0.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTMzNg==", "title": "The World of Virgin Atlantic in Your Pocket: Building an AI Concierge for the End-to-End Journey", "start": "2026-06-11T11:35:00+01:00", "end": "2026-06-11T12:00:00+01:00", "track": "Headliners", "description": "How do you bring an entire airline experience into a single, seamless interaction? Virgin Atlantic shares how our AI Concierge—already live today—is evolving to cover the full customer journey. From inspiration to arrival home, we’re creating a connected, intuitive, and personalized travel experience.\nSeamless Travel Experience: Integrate every stage of the journey into a single, unified interaction.\nContext-Aware AI: Use AI agents that understand context, provide relevant guidance, and connect to human teams when needed.\nDesign & Platform Insights: Learn how the app and underlying AI platform are built to support and enhance the customer journey.", "speakers": [{"name": "Richard Masters", "org": "Virgin Atlantic Airways Ltd", "photo": "https://static.swapcard.com/public/images/cc605af2c3fe424185965f3f81a2b0ee.png"}, {"name": "Bethan Lynch", "org": "Virgin Atlantic", "photo": "https://static.swapcard.com/public/images/7a2f32116272403186b3f7337f6a5a83.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTIxMw==", "title": "Panel: Scaling | Moving Beyond Pilots – Why Industrial AI Stalls", "start": "2026-06-11T11:35:00+01:00", "end": "2026-06-11T12:40:00+01:00", "track": "Applied AI", "description": "Understand why many Industrial AI initiatives fail after successful pilots. Explore common blockers, such as data readiness, ownership, validation, and change resistance. Learn what organisations that successfully scale AI do differently.", "speakers": [{"name": "Mostafizur Rahman", "org": "The Manufacturing Technology Centre  (CATAPULT)", "photo": "https://static.swapcard.com/public/images/0257f3da74c740d4ad9433e5b85c7a62.jpeg"}, {"name": "Alexander Kane", "org": "GKN Aerospace", "photo": "https://static.swapcard.com/public/images/833de0675e6b45caa469c9993fb32cf7.png"}, {"name": "Zoe Webster", "org": "Authentic Innovation Ltd", "photo": "https://static.swapcard.com/public/images/74ee34c9b028471a91b2f7a8e747ba79.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ2MjYxNA==", "title": "Short Break", "start": "2026-06-11T11:35:00+01:00", "end": "2026-06-11T11:40:00+01:00", "track": "Applied AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQzMzA2NA==", "title": "Trustworthy AI in Production: Monitoring, Drift Detection & Quality Assurance", "start": "2026-06-11T11:35:00+01:00", "end": "2026-06-11T12:00:00+01:00", "track": "Impact Arena", "description": "Tools, practices, and metrics enterprises use to keep AI systems reliable after deployment. Includes drift and anomaly detection, model quality monitoring, performance dashboards, and automated alerting frameworks.", "speakers": [{"name": "Disha Mukherjee", "org": "Ford Credit", "photo": "https://static.swapcard.com/public/images/92c512eb75d94b059820cd3f6cbf8834.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTQyMw==", "title": "Control | Building AI and Security with Data Protection Controls", "start": "2026-06-11T11:35:00+01:00", "end": "2026-06-11T12:00:00+01:00", "track": "Data Excellence", "description": "• Discover how robust risk and control frameworks ensure compliance, governance, resilience, and data protection in AI systems.\n• Learn strategies to address challenges like model drift, bias, and unexpected behaviours, while implementing security measures to safeguard sensitive data, enhance system reliability, and ensure proactive risk management.\n• Gain insights into aligning practices with enterprise-wide goals, empowering data leaders to drive accountability, operational excellence, and secure AI-powered organisations.", "speakers": [{"name": "Sepi Chakaveh", "org": "University of Oxford", "photo": "https://static.swapcard.com/public/images/728eab5ebeb54bf394604bc697fd5d51.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTQwNg==", "title": "Control | Managing Model Risk, Hallucinations and Bias at Scale", "start": "2026-06-11T11:35:00+01:00", "end": "2026-06-11T12:00:00+01:00", "track": "Finance", "description": "• Discover how banks and insurers monitor and validate AI systems in live production environments.\n• Explore strategies for detecting, addressing, and learning from hallucinations and bias in regulated AI use cases.\n• Learn how peers are fostering trust and maintaining control while ensuring delivery speed is not compromised.", "speakers": [{"name": "Sanja Hukovic", "org": "LSEG", "photo": "https://static.swapcard.com/public/images/7eb7f7ae56b045caa0059ddb8c984c21.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTI5Mg==", "title": "Quantum AI: What’s Real in 2026 and What Isn’t", "start": "2026-06-11T11:35:00+01:00", "end": "2026-06-11T12:00:00+01:00", "track": "Next Generation", "description": "Quantum is being discussed alongside AI, but most organisations are unsure what is practical. \nThis session separates real near‑term use cases from hype. \nLearn how enterprises should engage now through partnerships, pilots, and capability building.", "speakers": [{"name": "Asim Khwaja", "org": "UK Civil Service", "photo": "https://static.swapcard.com/public/images/177798c9cade49039be28fd317321214.jpeg"}, {"name": "Lawrence Ampofo", "org": "Vodafone", "photo": "https://cdn-api.swapcard.com/public/images/8f9d8e75d4914600b8373f06831b4dc9.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ1NzYyOA==", "title": "Short Break", "start": "2026-06-11T11:45:00+01:00", "end": "2026-06-11T11:55:00+01:00", "track": "Beyond AI at Scale", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQzNDEwMQ==", "title": "From Deployment to Impact: Mastering AI at Scale", "start": "2026-06-11T11:55:00+01:00", "end": "2026-06-11T12:20:00+01:00", "track": "Beyond AI at Scale", "description": "Discover how organisations can effectively implement and scale AI to meet the demands of modern business environments. This session explores the key capabilities and strategies necessary for deploying AI at scale, including infrastructure considerations, data management, and deployment best practices.\nLearn how to accelerate AI initiatives, optimise performance, and achieve impactful business outcomes.\nJoin HPE and NVIDIA to gain insights into successful approaches for scaling AI initiatives, overcoming common challenges, and unlocking the full potential of AI to drive innovation and growth within your organisation. Don’t miss this opportunity to learn how to turn AI investments into tangible results.", "speakers": [{"name": "Jason Smith", "org": "HPE", "photo": ""}, {"name": "Gadi Godanyan", "org": "NVIDIA", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ0MDEzMQ==", "title": "Beyond the Pilot: Orchestrating an Enterprise-Ready GenAI Ecosystem for Global Marketing", "start": "2026-06-11T11:55:00+01:00", "end": "2026-06-11T12:20:00+01:00", "track": "Creative AI", "description": "• How we are industrialising GenAI in global marketing, moving from pilots to scaled, enterprise-ready content creation across the full supply chain. (Campaign creation timeline from 5.5 months to 2.5 months, 35% cost efficiency)\n• Key learnings on operating model, governance, and adoption, including budget (CAPEX) investment decisions, ROI tracking frameworks, and how to balance in-house capabilities, agencies, and AI platforms to drive transformation at scale. (And challenges we face while doing it)\n• Liberating the Creative (The 'Third Mind'): Why the future of AI in marketing isn't human replacement, but automating the routine so human experts can elevate brand strategy and create work neither could achieve alone.", "speakers": [{"name": "Ergun Sezer", "org": "Philip Morris International", "photo": "https://static.swapcard.com/public/images/4fee25b1c3e8484b9bb5875249fc101a.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ1NzY0Mw==", "title": "Short Break", "start": "2026-06-11T12:00:00+01:00", "end": "2026-06-11T12:10:00+01:00", "track": "Next Generation", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQzMzA5Ng==", "title": "Elsewhen Executive Keynote", "start": "2026-06-11T12:10:00+01:00", "end": "2026-06-11T12:35:00+01:00", "track": "Headliners", "description": "", "speakers": [{"name": "Leon Gauhman", "org": "Elsewhen", "photo": "https://static.swapcard.com/public/images/9b41c3abf37d4839a3e2f5a147b6b4a5.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ1ODgwNA==", "title": "Enabling AI-Driven Quality Across the SDLC", "start": "2026-06-11T12:10:00+01:00", "end": "2026-06-11T12:35:00+01:00", "track": "Data Excellence", "description": "As
