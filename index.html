: "UGxhbm5pbmdfNDQzMzA2Mg==", "title": "Lunch Break", "start": "2026-06-11T12:20:00+01:00", "end": "2026-06-11T13:35:00+01:00", "track": "Impact Arena", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQ1NQ==", "title": "Lunch Break", "start": "2026-06-11T12:35:00+01:00", "end": "2026-06-11T13:35:00+01:00", "track": "Headliners", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTIyMw==", "title": "Lunch Break", "start": "2026-06-11T12:35:00+01:00", "end": "2026-06-11T13:35:00+01:00", "track": "Data Excellence", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQzOA==", "title": "Lunch Break", "start": "2026-06-11T12:35:00+01:00", "end": "2026-06-11T13:35:00+01:00", "track": "Finance", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQ0NA==", "title": "Lunch Break", "start": "2026-06-11T12:35:00+01:00", "end": "2026-06-11T13:35:00+01:00", "track": "Next Generation", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTI4Ng==", "title": "Lunch Break", "start": "2026-06-11T12:40:00+01:00", "end": "2026-06-11T13:35:00+01:00", "track": "Applied AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQzMzA5OA==", "title": "The Next Digital Economy: AI, Crypto, and the Rise of Intelligent Markets", "start": "2026-06-11T13:00:00+01:00", "end": "2026-06-11T13:50:00+01:00", "track": "Masterclass", "description": "As artificial intelligence and digital assets converge, we are entering a new economic era where markets are no longer just driven by people- but by intelligent systems. This masterclass breaks down how AI is transforming finance, trading, and ownership while simplifying access to crypto and digital financial systems. This masterclass will guide attendees through the evolution of digital finance, how to safely navigate crypto and digital assets, and how to leverage AI tools to learn, analyse and participate in these emerging markets with confidence.\nWhat You’ll Learn:\n• How AI is reshaping finance, trading, and global markets\n• A simplified understanding of crypto, digital assets, and modern financial systems\n• How to use AI tools (like Claude, Perplexity, and others) to learn, analyze, and make smarter financial decisions\n• Key safety principles and strategies to navigate crypto and digital assets confidently\nKey Takeaways:\n• A clear, practical framework for understanding the next digital economy\n• Tools and resources to start exploring AI-driven finance immediately\n• Confidence in navigating crypto without technical overwhelm\n• Insight into where global markets are heading – and how to position yourself early\nWhy It Matters:\nThe global economy is shifting faster than ever. AI is automating decision-making, and crypto is redefining ownership and value exchange. Yet, the biggest barrier to adoption is not technology it’s understanding. Those who learn how to navigate this new landscape early will have a significant advantage in business, investing, and innovation.\nWho Should Attend:\n• Founders, entrepreneurs, and business leaders exploring the future of markets\n• Creators and professionals interested in digital ownership and monetization\n• Investors and beginners curious about crypto, AI, and financial innovation\n• Anyone who wants to understand the future of money, markets, and opportunity – without needing a technical background", "speakers": [{"name": "Aya Atassi", "org": "Click Ink Media", "photo": "https://static.swapcard.com/public/images/8bdf382dd8734b94ac5f0f7328bada27.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTQyNQ==", "title": "Skills That Scale in the Age of AI", "start": "2026-06-11T13:35:00+01:00", "end": "2026-06-11T14:15:00+01:00", "track": "Headliners", "description": "As AI advances, employees must develop the skills to harness its full potential and collaborate effectively with intelligent systems.\nDiscover the critical abilities for the future of work: AI literacy, data fluency, creativity, problem-solving, critical thinking, collaboration, adaptability, and role-specific technical knowledge.\nWalk away with actionable guidance from two leading CXOs on which skills to build, how to apply them day-to-day, and how to turn human-AI collaboration into a real business advantage.", "speakers": [{"name": "Nazim Ünlu", "org": "ex-Novartis & Cargill I HR Tech Investor at allygatr", "photo": "https://static.swapcard.com/public/images/a3e60deb96bd4951825d57664367605a.jpeg"}, {"name": "Bastien Parizot", "org": "Reckitt", "photo": "https://static.swapcard.com/public/images/50a80ebdde4545ba8de28f2051a4a3d5.jpeg"}, {"name": "Sheila Flavell", "org": "COO of FDM Group", "photo": "https://static.swapcard.com/public/images/2d9779fc8151420fa5418f2d10e426e8.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTIzMQ==", "title": "Panel: Frontier | The Practical Future of Industrial AI", "start": "2026-06-11T13:35:00+01:00", "end": "2026-06-11T14:15:00+01:00", "track": "Applied AI", "description": "Explore the realistic advancements in Industrial AI over the next 3–5 years. Understand how the role of industrial workers will evolve alongside AI advancements. Learn what skills will be critical for teams to adapt to AI-driven changes.", "speakers": [{"name": "Ian Lumsden", "org": "Arup", "photo": "https://static.swapcard.com/public/images/95eef68f121440a5a169de538a4abb3a.jpeg"}, {"name": "Yannis Georgas", "org": "Launchpad AI", "photo": "https://static.swapcard.com/public/images/5aafae13cc854c43ba4c049354ad9799.jpeg"}, {"name": "Michael Doig", "org": "Rolls-Royce", "photo": "https://static.swapcard.com/public/images/d26a231f42be486382e598a591881711.png"}, {"name": "Giovanna Martinez Arellano", "org": "University of Nottingham", "photo": "https://static.swapcard.com/public/images/70b06f3db4e04c99a2f5988bab9e1737.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTI1Ng==", "title": "Panel Debate: AI Infrastructure Darwinism – Survive or Die", "start": "2026-06-11T13:35:00+01:00", "end": "2026-06-11T14:15:00+01:00", "track": "Beyond AI at Scale", "description": "• Which AI architectures are most likely to collapse under the pressures of 2026—cost, governance, and performance?\n• What patterns will dominate the AI landscape: sovereign cloud, local inference, edge, micro-model swarms, or hybrid solutions?\n• How will shifting power dynamics among hyperscalers, sovereign nations, on-prem setups, and distributed systems shape the future of compute?", "speakers": [{"name": "Shivika Singh", "org": "TikTok / ByteDance", "photo": "https://static.swapcard.com/public/images/871b08c5f8c343f3a157261bce7eaacf.jpeg"}, {"name": "Benedict Macon-Cooney", "org": "Tony Blair Institute", "photo": "https://static.swapcard.com/public/images/9e4a92d94bff4e2ab3eb7826aed12531.jpeg"}, {"name": "Alexander Harrowell", "org": "Omdia", "photo": "https://static.swapcard.com/public/images/6daf07f9dc0c4e53a0f560c24ff6f692.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTQwMg==", "title": "Panel: The AI‑Powered Frontier of Enterprise Creativity", "start": "2026-06-11T13:35:00+01:00", "end": "2026-06-11T14:15:00+01:00", "track": "Creative AI", "description": "• See how studios, agencies, and creative companies use AI across all stages of production—from ideas to post-production—to enable seamless large-scale teamwork.\n• Learn how hybrid workflows with directors, writers, designers, editors, animators, and AI tools accelerate processes, reduce obstacles, and open new cross-disciplinary storytelling avenues.\n• Discover practical ways to build AI-supported team environments, including workflow management, creative alignment, versioning, and ethical safeguards for effective human-AI collaboration at scale.", "speakers": [{"name": "William Bartlett", "org": "Framestore", "photo": "https://static.swapcard.com/public/images/5de3b0c9a1bc4fa283a07c7fc6d5b60d.jpeg"}, {"name": "Max Fumagalli", "org": "Beauty Pie", "photo": "https://static.swapcard.com/public/images/10e4dc1d069c4e9cba5d48830c1891ef.png"}, {"name": "Priti Mhatre", "org": "WPP", "photo": "https://static.swapcard.com/public/images/9cb34c355fac43628086d10dd98381a5.jpeg"}, {"name": "Eleni Sharp", "org": "BBC", "photo": "https://static.swapcard.com/public/images/9b717aa3322a4a47a8b2de034371f1db.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQzMzEwMQ==", "title": "Auditing in the Age of AI", "start": "2026-06-11T13:35:00+01:00", "end": "2026-06-11T14:00:00+01:00", "track": "Impact Arena", "description": "This session explores how AI is transforming the audit function and redefining how assurance is delivered in a data-driven world. It will:\n• Demonstrate how AI enhances assurance by applying supervised and unsupervised machine learning to identify known risks and uncover emerging issues at scale\n• Showcase the democratization of advanced analytics through AI-enabled audit tools and applications, empowering audit teams across all levels\n• Examine the future of AI in audit, including the use of AI to audit AI (“AI as a Judge”) and the evolution toward autonomous, AI-driven assurance through Audit Agents", "speakers": [{"name": "Shehryar Humayun", "org": "Lloyds Banking Group", "photo": "https://static.swapcard.com/public/images/876c6d880be443e6a6fcb18649c7731a.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTExOA==", "title": "Panel: Prove | Demonstrating Value and ROI During Execution", "start": "2026-06-11T13:35:00+01:00", "end": "2026-06-11T14:15:00+01:00", "track": "Data Excellence", "description": "• How advanced teams ensured their AI systems delivered measurable business value as they scaled.\n• Discover how to translate technical improvements into outcomes that resonate with stakeholders, define and defend metrics that clearly demonstrate ROI and impact.\n• Learn how to build trust and credibility through transparency and evidence.", "speakers": [{"name": "Jason Smith", "org": "HPE", "photo": ""}, {"name": "Richard Clough", "org": "EY", "photo": "https://static.swapcard.com/public/images/133d1398780c4c3a9ecc4e8d25e8b869.png"}, {"name": "Robin Jones", "org": "AstraZeneca", "photo": "https://static.swapcard.com/public/images/11df6c6cf7b94198845238a61eec03da.png"}, {"name": "David Mead", "org": "Sky", "photo": "https://static.swapcard.com/public/images/458cf8cf2e454b3bb66dc42318248c3e.png"}, {"name": "Bhagya Reddy", "org": "Rewardinsight", "photo": "https://static.swapcard.com/public/images/0b1335a343a64587ac8ad8933964b56c.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTQyOA==", "title": "Panel: People | Trust, Oversight and the Human Role in AI Decision Making", "start": "2026-06-11T13:35:00+01:00", "end": "2026-06-11T14:15:00+01:00", "track": "Finance", "description": "• Explore how financial institutions are embedding human oversight into AI-supported decision-making workflows.\n• Address challenges such as trust, over-reliance on AI, and disengagement in banking and insurance operations.\n• Learn how peers are fostering productive human–AI collaboration in daily workflows to enhance decision-making", "speakers": [{"name": "Maura Feddersen", "org": "Swiss Re", "photo": "https://static.swapcard.com/public/images/dfb7f51c5f3e4bc284a503ec6926d25b.jpeg"}, {"name": "Sudeshna Sen", "org": "Financial Services Compensation Scheme (FSCS)", "photo": "https://static.swapcard.com/public/images/2826c43bf1fd44bfa299fa69476267e6.png"}, {"name": "Omkar Joshi", "org": "BSI Group", "photo": "https://static.swapcard.com/public/images/49e2842fb68147d1a4960667d1351ae1.png"}, {"name": "Sami Eltom", "org": "General Assembly", "photo": "https://static.swapcard.com/public/images/d917fdd2e62c4477a38783247004453e.png"}, {"name": "Lisa Weaver-Lambert", "org": "Oxford AI Studio", "photo": "https://static.swapcard.com/public/images/9ff27be3a5854c5294580a3093c74b25.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTM1Ng==", "title": "Panel: Beyond Agents: The Next AI Systems We’ll Build After LLMs", "start": "2026-06-11T13:35:00+01:00", "end": "2026-06-11T14:15:00+01:00", "track": "Next Generation", "description": "• Some of the most important advances are happening in quiet pilot projects, away from headlines.\n• This panel shares the most promising experiments being tested inside enterprise teams today.\n• Hear what is delivering measurable outcomes and what is failing under real‑world constraints.", "speakers": [{"name": "Anupama Hatti", "org": "NHS Blood and Transplant", "photo": "https://static.swapcard.com/public/images/41ea221d37454995b7da0f68723ac928.png"}, {"name": "Angharad Williams", "org": "Lloyds Banking Group", "photo": "https://static.swapcard.com/public/images/1b875d052bba492e9d97c602ade2b3e0.png"}, {"name": "KERRY SHEEHAN", "org": "UK Government", "photo": "https://static.swapcard.com/public/images/eef4a3e2f1fd4c289916d08ccaa1ca0b.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQzMzA2Ng==", "title": "AI selection strategy, approach and impact", "start": "2026-06-11T14:00:00+01:00", "end": "2026-06-11T14:50:00+01:00", "track": "Masterclass", "description": "AI is everywhere—but how do you make it work for your business?\nIn this masterclass, we'll dive into how AI is shaping industries, transforming decision-making, and redefining how businesses operate. Yet, while the potential is undeniable, many organisations struggle to move beyond experimentation or the pilot phase. With so many AI tools and partners available, the challenge isn’t just implementing AI—it’s knowing which solution truly fits your business needs. The options seem endless, but how do you recognise the one that delivers real value? \nSome businesses dive in without a clear direction, picking whatever is popular. Others hesitate, unsure how to navigate the complexity. The reality is that only 24% of businesses have an AI strategy that delivers measurable impact. The difference between success and failure often comes down to one thing: choosing the right approach. That’s where we come in. At Gen25, we help organisations cut through the noise, selecting the right AI strategy, technology, and partners to accelerate growth and innovation. All of this is based on real-world use cases.\nWhat to expect from this event\nThis masterclass is focused on business leaders to discuss what really works when it comes to AI adoption, under the guidance of James Cronyn, Director of Business Consulting at Gen25.\n•    Define an AI strategy that aligns with your business goals\n•    Select the right AI technologies and providers to maximize ROI\n•    Learn from real-world examples of companies successfully using AI to drive impact\n•    Avoid common pitfalls that cause 75% of AI projects to fail\nPresentation by James Cronyn\n‍Director of Business Consulting Gen25, contributor on the EU Commission report: “The Opportunity for AI to Enhance Business Support Processes.”", "speakers": [{"name": "James Cronyn", "org": "Gen25", "photo": "https://static.swapcard.com/public/images/6aa779752ed848f98bd40eba1baaaa1d.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ2MjYxMg==", "title": "Short Break", "start": "2026-06-11T14:15:00+01:00", "end": "2026-06-11T14:25:00+01:00", "track": "Applied AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYyMA==", "title": "Short Break", "start": "2026-06-11T14:15:00+01:00", "end": "2026-06-11T14:25:00+01:00", "track": "Beyond AI at Scale", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYyMw==", "title": "Short Break", "start": "2026-06-11T14:15:00+01:00", "end": "2026-06-11T14:25:00+01:00", "track": "Creative AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ2MjU5MQ==", "title": "Short Break", "start": "2026-06-11T14:15:00+01:00", "end": "2026-06-11T14:25:00+01:00", "track": "Data Excellence", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ2MzQ0MQ==", "title": "Short Break", "start": "2026-06-11T14:15:00+01:00", "end": "2026-06-11T14:25:00+01:00", "track": "Finance", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzY0Ng==", "title": "Short Break", "start": "2026-06-11T14:15:00+01:00", "end": "2026-06-11T14:25:00+01:00", "track": "Next Generation", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQzMzA2NQ==", "title": "Short Break", "start": "2026-06-11T14:20:00+01:00", "end": "2026-06-11T14:25:00+01:00", "track": "Impact Arena", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTExMg==", "title": "AI in Action: From Idea to Agent in Under 25 Minutes", "start": "2026-06-11T14:25:00+01:00", "end": "2026-06-11T14:50:00+01:00", "track": "Headliners", "description": "Someone in the audience picks a real business problem. We build an AI agent to solve it, live on stage, from scratch. No script, no safety net.\nWhile we're building, you're steering. Ask anything - how does this work, could it do X, what about Y - and watch the answers play out in real time on screen.\nLed by Tom Hewitson, founder of AI training company General Purpose, you'll walk out with a clear, honest picture of what agents can actually do today and how fast they can go from idea to something useful.", "speakers": [{"name": "Tom Hewitson", "org": "General Purpose", "photo": "https://static.swapcard.com/public/images/9d504fa23cd94435b29a2d25589648bc.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTMzMA==", "title": "Trust | Establishing Trust in Industrial AI Governance", "start": "2026-06-11T14:25:00+01:00", "end": "2026-06-11T14:50:00+01:00", "track": "Applied AI", "description": "• Understand why trust is a pivotal factor in driving the adoption of Industrial AI systems within governance frameworks.\n• Learn how robust validation processes, comprehensive governance frameworks, and human-in-the-loop design principles ensure accountability, compliance, and reliability in industrial AI applications.\n• Explore actionable strategies to build and sustain confidence in AI-driven recommendations, developing trust through transparency, proactive risk management, and alignment with enterprise-wide governance and operational goals.", "speakers": [{"name": "Rebecca Gallagher", "org": "Weir Group PLC", "photo": "https://static.swapcard.com/public/images/6df2b3edc5e846f5a78bf0192651bbd5.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTMxOQ==", "title": "Human-AI Synergy: Redesigning Decision Workflows for Intelligent Collaboration", "start": "2026-06-11T14:25:00+01:00", "end": "2026-06-11T14:50:00+01:00", "track": "Beyond AI at Scale", "description": "• Learn how to integrate AI into decision processes while maintaining clarity of human oversight, trust, and responsibility.\n• Explore workflow models where humans and AI co- reason, co-evaluate, and co-validate decisions.\n• Understand how to redesign decision roles to leverage AI’s strengths without losing human judgment. Define who owns decisions, overrides, and escalation in hybrid human–AI workflows.", "speakers": [{"name": "Laura Weis", "org": "WPP", "photo": "https://static.swapcard.com/public/images/298dac01e5174950b27421cc85cc5828.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTQzMg==", "title": "Pandora's journey on agentic shopping: From bold idea to production, an honest under-the-hood look at how we got there", "start": "2026-06-11T14:25:00+01:00", "end": "2026-06-11T14:50:00+01:00", "track": "Creative AI", "description": "Building a generative AI agent isn't really about the model — it's about everything around it (the harness). In this session, Riccardo Arnaldi, Agentic AI Product Manager at Pandora, shares the unfiltered story of building Gemma, the brand's AI shopping agent, opening with the failures that reshaped how the team develops agents today.\nThe core question driving the talk: how do you move from an agent that's okay and useful to one that earns trust and inspires people to buy — the way a great associate does in store? Expect concrete examples, real metrics, and a practitioner's view on the eval loops that catch issues before customers do, the points where humans stay firmly in the loop, and the emotional storytelling layer that turns a functional agent into a memorable one.", "speakers": [{"name": "Riccardo Arnaldi", "org": "Pandora A/S", "photo": "https://static.swapcard.com/public/images/036ae9503a174d26a2206f5d189e2e92.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQzMzA2Mw==", "title": "Zero Margin for Error: AI Governance in Conflict and Crisis", "start": "2026-06-11T14:25:00+01:00", "end": "2026-06-11T14:50:00+01:00", "track": "Impact Arena", "description": "When AI fails in an emergency, people lose access to lifesaving food, shelter, or safety. That makes humanitarian crisis response the sharpest proof of concept for what good AI governance looks like - because there is no margin to get it wrong. AI deployed in disasters surfaces risks that governance frameworks developed in boardrooms miss: from the exclusionary impacts of missing data to the gap between AI policy and operational reality. \nDrawing on 15 years of frontline crisis response and research with Accenture on pathways to inclusive AI, this session translates hard-won lessons into practical recommendations for business teams. Attendees will leave with a sharper way to stress-test their current approach and greater confidence in deploying responsible AI.", "speakers": [{"name": "Suzy Madigan", "org": "The Machine Race", "photo": "https://static.swapcard.com/public/images/25c444621d61401b93838f62b5bca1b4.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTMyMg==", "title": "Fireside Chat: Decide | When to Redesign, Pause, or Scale Further", "start": "2026-06-11T14:25:00+01:00", "end": "2026-06-11T14:50:00+01:00", "track": "Data Excellence", "description": "Learn how advanced teams identified signals that their systems were reaching operational or technical limits.\nExplore the decision-making frameworks used to determine whether to redesign, pause, or scale further.\nUnderstand what technical maturity looks like in practice and how it influences execution strategies.\nGain actionable insights into balancing trade-offs and making informed, high-stakes decisions in complex environments.", "speakers": [{"name": "Paul Dawson", "org": "Formerly,  John Lewis Money", "photo": "https://static.swapcard.com/public/images/703741105bd64ab79cf23ec49490063f.png"}, {"name": "Barun Moitra", "org": "Carlsberg Britvic", "photo": "https://static.swapcard.com/public/images/c298b32034bc499a8f1522e9a5a5047a.png"}, {"name": "Vinesh Lakhani", "org": "Ex. National Energy System Operator", "photo": "https://static.swapcard.com/public/images/0eb7b9dfd3754c71812c256b9f24bbba.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTIzNA==", "title": "Execution | Deciding What to Fund, Scale, or Kill", "start": "2026-06-11T14:25:00+01:00", "end": "2026-06-11T14:50:00+01:00", "track": "Finance", "description": "• How to tell whether an AI initiative is truly production-ready or just a demo, by assessing parity, ownership, and kill criteria.\n• How to translate AI work into measurable business ROI by tying models to decisions, adoption, and decommissioning of legacy processes and costs.\n• How to invest in AI with capital discipline using staged funding, evidence gates, and fast kill-or-scale decisions.", "speakers": [{"name": "Davood Shamsi", "org": "JPMorgan Chase", "photo": "https://static.swapcard.com/public/images/5182125799fc426caa992b208f5c8b1e.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTQ0MQ==", "title": "When Everyone Can Build Software: How AI Is Changing Development Inside Large Enterprises", "start": "2026-06-11T14:25:00+01:00", "end": "2026-06-11T14:50:00+01:00", "track": "Next Generation", "description": "• Enterprise search is being rebuilt as AI moves from chatbots into core workflows.\n• Modern retrieval requires evaluation, routing, freshness, and governance.\n• This session shares the architectures and lessons behind next‑generation knowledge systems.", "speakers": [{"name": "Prashant Singh", "org": "Deutsche Telekom (Telekom Strategy Consulting)", "photo": "https://static.swapcard.com/public/images/06fe152c6da142a18ee764e8901e1f57.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ2MjYxMw==", "title": "Short Break", "start": "2026-06-11T14:50:00+01:00", "end": "2026-06-11T15:00:00+01:00", "track": "Applied AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYzNw==", "title": "Short Break", "start": "2026-06-11T14:50:00+01:00", "end": "2026-06-11T15:00:00+01:00", "track": "Beyond AI at Scale", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYxMQ==", "title": "Short Break", "start": "2026-06-11T14:50:00+01:00", "end": "2026-06-11T15:00:00+01:00", "track": "Creative AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ2MjU5NQ==", "title": "Short Break", "start": "2026-06-11T14:50:00+01:00", "end": "2026-06-11T15:00:00+01:00", "track": "Data Excellence", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ2MzQ0MA==", "title": "Short Break", "start": "2026-06-11T14:50:00+01:00", "end": "2026-06-11T15:00:00+01:00", "track": "Finance", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYxMg==", "title": "Short Break", "start": "2026-06-11T14:50:00+01:00", "end": "2026-06-11T15:00:00+01:00", "track": "Next Generation", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ2MTM1Ng==", "title": "Improving Classification in Imbalanced Datasets Using GAN-Based Data Augmentation: Applications in Fraud Detection and Healthcare", "start": "2026-06-11T14:55:00+01:00", "end": "2026-06-11T15:10:00+01:00", "track": "Impact Arena", "description": "This presentation investigates the challenge of class imbalance in classification tasks using two real-world applications: credit card fraud detection and breast cancer diagnosis. Leveraging Generative Adversarial Networks, synthetic data is generated to augment minority classes and improve model performance. Various Machine Learning algorithms are evaluated on both datasets before and after augmentation. The results demonstrate that GAN-based techniques significantly enhance classification accuracy, particularly in detecting rare events such as fraudulent transactions and malignant cases. This study highlights the effectiveness and adaptability of GAN-driven data augmentation across domains with imbalanced data challenges.", "speakers": [{"name": "Emilija Strelcenia", "org": "Bournemouth University", "photo": "https://static.swapcard.com/public/images/82c2edbd35164cacae8a1121ece99e99.png"}]}, {"id": "UGxhbm5pbmdfNDQ1NzYyMQ==", "title": "Presentation by Senior Representative from AWS", "start": "2026-06-11T15:00:00+01:00", "end": "2026-06-11T15:25:00+01:00", "track": "Beyond AI at Scale", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYzNQ==", "title": "Can AI Make Human Music More Valuable?", "start": "2026-06-11T15:00:00+01:00", "end": "2026-06-11T15:25:00+01:00", "track": "Creative AI", "description": "• In the age of generative AI, millions of songs can now be produced with a simple command. As the barrier to creation falls, a new question emerges: what truly defines value in music?\n• This session explores why human creativity is not becoming less important, but more essential than ever. Drawing on real-world case studies, Cheerful Music will present a new model in which AI enhances efficiency, while human aesthetic judgment, emotional direction, and cultural insight remain the key drivers of success.\n• From viral AI-powered releases to cross-platform distribution strategies, this session will show how music in the AI era is no longer competing on creation alone, but on connection, meaning, and resonance.", "speakers": [{"name": "Sergio Veloz", "org": "Cheerful Music", "photo": "https://static.swapcard.com/public/images/8d767c3833264493a77849c9418895a1.jpeg"}, {"name": "Snow Jiang", "org": "Cheerful Music Limited", "photo": "https://static.swapcard.com/public/images/93d8d511d5ba4450bef877e4553d2077.jpeg"}, {"name": "He Zhu", "org": "Cheerful Music", "photo": "https://static.swapcard.com/public/images/08b91256fa7e4006bce56ba404199d46.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ2NTEzMw==", "title": "Data, Context, and Rules | Building Agents for Business Critical Processes", "start": "2026-06-11T15:00:00+01:00", "end": "2026-06-11T15:25:00+01:00", "track": "Data Excellence", "description": "Make runs dozens of business-critical AI agents in production across sales, support, and product. This session showcases a few of them and goes deeper into what it actually takes to build, scale, and improve agents you can trust with critical work. Expect builder best practices, lessons learnt, architecture decisions, and governance trade-offs, the kind of detail that separates production-grade agents from demos that fall over the moment real users touch them. Geared toward a technically savvy audience, but not developers.", "speakers": [{"name": "Sara Maldon", "org": "Make", "photo": "https://static.swapcard.com/public/images/38aaf236540e4280a6604351c462b5c3.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ1Njc2Nw==", "title": "Governing and Scaling AI Safely Starts With One Question: Can You Stop It in Time?", "start": "2026-06-11T15:00:00+01:00", "end": "2026-06-11T15:25:00+01:00", "track": "Finance", "description": "Sponsor Answer: How to prepare enterprise data for AI by cleaning, structuring, and connecting it to ensure reliable performance at scale.", "speakers": [{"name": "Joanna Michalska", "org": "Ethica Group Ltd", "photo": "https://static.swapcard.com/public/images/0004a3ac053f4c049e3f8f1a19811a8f.png"}]}, {"id": "UGxhbm5pbmdfNDQzMzA5Mw==", "title": "From Insight to Impact: Using Agentic BI to Scale AI Across the Enterprise", "start": "2026-06-11T15:00:00+01:00", "end": "2026-06-11T15:50:00+01:00", "track": "Masterclass", "description": "In this masterclass, we explore how agentic BI acts as a critical acceleration layer for enterprise AI adoption, democratising access to data, embedding AI into everyday decision-making, and enabling organisations to move from isolated use cases to repeatable, scalable AI capability.\nDrawing on real enterprise patterns, this session will show how Agentic BI can be used to:\n• Remove analytics bottlenecks\n• Increase AI adoption beyond technical users\n• Strengthen governance while scaling access\n• Turn data platforms into AI powered decision engines\nThis masterclass is designed for leaders looking to move from AI ambition to AI at scale, without compromising control, trust or value.", "speakers": [{"name": "Rachel George", "org": "Lloyds Banking Group", "photo": "https://static.swapcard.com/public/images/8b1d79f8637249709138af59a1732dfd.png"}]}, {"id": "UGxhbm5pbmdfNDQ1NzYyNA==", "title": "Presentation by Senior Representative from Lightricks", "start": "2026-06-11T15:00:00+01:00", "end": "2026-06-11T15:25:00+01:00", "track": "Next Generation", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzA1NA==", "title": "The Human Impact Conversation", "start": "2026-06-11T15:00:00+01:00", "end": "2026-06-11T15:45:00+01:00", "track": "VisionAIres", "description": "What is the realistic scope, pace, and structural shape of workforce change over the next 3–5 years?\n\nCould automation decisions trigger policy intervention, labor resistance, or broader public backlash?\n\nDiscuss strategies to safeguard reputation, sustain employee engagement, and preserve customer loyalty throughout AI-driven restructuring.", "speakers": [{"name": "Catriona Campbell", "org": "AI By Design", "photo": "https://static.swapcard.com/public/images/0815164441bb469ead86618925333205.png"}, {"name": "Mara Pometti", "org": "Mastercard", "photo": "https://static.swapcard.com/public/images/3be28a4eaab14ffabb4f0003d80cc67d.png"}, {"name": "Srimanth Rudraraju", "org": "London Stock Exchange Group", "photo": "https://static.swapcard.com/public/images/2cbd831903314e79b6ca18645f9f08a1.jpeg"}, {"name": "Matthew Blakemore", "org": "Independent", "photo": "https://static.swapcard.com/public/images/4ddb643f6b3b459e86087694697ece8f.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQzMzEwNQ==", "title": "RPA Is Not Enough: Building Agentic Automation in Retail Banks", "start": "2026-06-11T15:15:00+01:00", "end": "2026-06-11T15:40:00+01:00", "track": "Impact Arena", "description": "Retail banks have traditionally relied on deterministic RPA for structured, rules-based tasks, but these systems struggle with complexity and change. This presentation explores the shift to Agentic Process Automation (APA), where AI agents enable more adaptive, context-aware, and intelligent workflows. Through real-world banking examples, it highlights how agentic systems move beyond static scripts to handle unstructured data, make decisions, and continuously improve. The session also covers key considerations such as architecture, governance, and business impact, offering practical insights for evolving automation strategies.", "speakers": [{"name": "Jose Artes Segura", "org": "Santander UK", "photo": "https://static.swapcard.com/public/images/8e5b619e9d5149ae98f2053edb5879e7.png"}]}, {"id": "UGxhbm5pbmdfNDQ1NzYxOQ==", "title": "Short Break", "start": "2026-06-11T15:25:00+01:00", "end": "2026-06-11T15:35:00+01:00", "track": "Beyond AI at Scale", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYxMw==", "title": "Short Break", "start": "2026-06-11T15:25:00+01:00", "end": "2026-06-11T15:35:00+01:00", "track": "Creative AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ2MzQ0Mg==", "title": "Short Break", "start": "2026-06-11T15:25:00+01:00", "end": "2026-06-11T15:35:00+01:00", "track": "Finance", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYyNQ==", "title": "Short Break", "start": "2026-06-11T15:25:00+01:00", "end": "2026-06-11T15:35:00+01:00", "track": "Next Generation", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQxOTQxMA==", "title": "Panel: AI Is Live. Now What? - Leadership in 2026", "start": "2026-06-11T15:35:00+01:00", "end": "2026-06-11T16:25:00+01:00", "track": "Headliners", "description": "In this panel, CXOs and senior leaders discuss the high-stakes choices shaping AI in the enterprise, exploring where missteps can be costly and where the right frameworks create real value.\nScaling AI safely while managing mistakes, compliance, and risk; assigning accountability for critical decisions.\nPanellists share strategies, governance frameworks, and leadership mindsets that enable executives to govern AI safely, empower teams, and capture measurable business value—revealing what it truly means to lead AI in 2026.", "speakers": [{"name": "Peter Guagenti", "org": "EverWorker", "photo": "https://static.swapcard.com/public/images/9e949e296cce4d8a99962669b90ab662.png"}, {"name": "Jambu Palaniappan", "org": "Checkatrade", "photo": "https://static.swapcard.com/public/images/0202977b74b54e3f864de9a8c69553fb.jpeg"}, {"name": "Leanne Allen", "org": "KPMG", "photo": "https://static.swapcard.com/public/images/3a2b286ca2fb4b68934c65a3f6cb8f4b.jpeg"}, {"name": "Ekaterina Abramova", "org": "London Business School", "photo": "https://static.swapcard.com/public/images/6aaf8e0d91c1496eb82f9c3d1cdda49c.jpeg"}, {"name": "Axel Threlfall", "org": "Reuters", "photo": "https://static.swapcard.com/public/images/0e163de28c324440b863e9496ef7aa99.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ0OTM5NQ==", "title": "When Everyone Can Build Software – Democratizing Development", "start": "2026-06-11T15:35:00+01:00", "end": "2026-06-11T16:15:00+01:00", "track": "Applied AI", "description": "How low-code/no-code and AI-assisted coding are reshaping software delivery.\n\nExplore governance, security, and quality guardrails.", "speakers": [{"name": "Alexis Ego", "org": "Retool", "photo": "https://static.swapcard.com/public/images/91d13be20d7d4bf8b0f9a66ce38fc7ab.jpeg"}, {"name": "Jeremy Andrews", "org": "Tag1 Consulting, Inc.", "photo": "https://static.swapcard.com/public/images/c70c01a90f464759abe070b0d2b48385.png"}, {"name": "Isabell Gruebner", "org": "AstraZeneca", "photo": "https://static.swapcard.com/public/images/7350f43eedf44f2aa99f1fe57628eae9.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTQxMw==", "title": "Panel: Cloud Without Borders: Architecting AI for Portability & Freedom", "start": "2026-06-11T15:35:00+01:00", "end": "2026-06-11T16:15:00+01:00", "track": "Beyond AI at Scale", "description": "• Discover how organizations prevent vendor lock-in and keep strategic flexibility by running AI where it provides the greatest value—across different clouds, regions, and environments.\n• Learn how open standards and orchestration aid in long-term maintenance, lower switching costs, and guard against future changes.\n• Explore real-world examples of multi-cloud, portable AI deployments that enhance resilience, support business continuity, and give companies greater control over costs, performance, and compliance. Understand how portability safeguards long-term strategic independence and boosts competitive resilience.", "speakers": [{"name": "Saru Deshwal", "org": "AA Insurance Corporation", "photo": "https://static.swapcard.com/public/images/7aa9a90114b34962adc28d5519a93cf2.jpeg"}, {"name": "Robbie Jerrom", "org": "Red Hat", "photo": "https://static.swapcard.com/public/images/454ee47ecb7443c2b70d30ed9c5a4afc.jpeg"}, {"name": "Alessandro (Ale) Ventura", "org": "Unilever", "photo": "https://static.swapcard.com/public/images/24217b78a0564303ab7ca5c5f04f9a4e.jpeg"}, {"name": "Ginna Raahauge", "org": "World Wide Technology", "photo": "https://static.swapcard.com/public/images/254479e28abd43699996854743ac76bb.png"}, {"name": "Lawrence Ampofo", "org": "Vodafone", "photo": "https://cdn-api.swapcard.com/public/images/8f9d8e75d4914600b8373f06831b4dc9.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTE1OQ==", "title": "Panel Debate: The Rise of AI- Creative Revolution or Human Replacement?", "start": "2026-06-11T15:35:00+01:00", "end": "2026-06-11T16:15:00+01:00", "track": "Creative AI", "description": "• Is AI a collaborative tool enhancing human creativity or a force diminishing the need for human originality?\n• Who owns AI-generated works, and how do we address copyright and ethical concerns?\n• Will AI create new opportunities or lead to widespread job displacement in the creative industries? What AI-driven creative acceleration means for brand identity, workforce planning, and marketing investment, and how executives balance innovation with accountability.", "speakers": [{"name": "Emma Kolasinska", "org": "Lux Aeterna", "photo": "https://static.swapcard.com/public/images/64f343bc61df4ad9af71dceca88f01e8.jpeg"}, {"name": "Aphra Kennedy Fletcher", "org": "Pence Talent", "photo": "https://static.swapcard.com/public/images/671004f142cd4e4fa4b32a64ddbf8eed.jpeg"}, {"name": "George Eid", "org": "AREA 17", "photo": "https://static.swapcard.com/public/images/802dbb00af554f43b294ac00b31fe168.jpeg"}, {"name": "Mark Sutherland", "org": "The Money Trench: The Music Industry Podcast", "photo": "https://static.swapcard.com/public/images/7ccc4f6daac24ca7b6d207cc744bd9d9.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTI4Mg==", "title": "Panel: Observability | Ensuring Trust, Control, and Reliability at Scale", "start": "2026-06-11T15:35:00+01:00", "end": "2026-06-11T16:15:00+01:00", "track": "Data Excellence", "description": "• Understand the importance of observability in production AI systems for maintaining trust, control, and reliability.\n• Learn how leading teams monitor behaviour, quality, access, and risk signals to proactively address challenges and ensure system stability.\n• Discover strategies for integrating observability signals across data, models, systems, and access points to scale AI confidently while mitigating risks", "speakers": [{"name": "Ash Osborne", "org": "Kong", "photo": "https://static.swapcard.com/public/images/a45881f4dff04c4c8338799cf3e6cd70.png"}, {"name": "Bhagya Reddy", "org": "Rewardinsight", "photo": "https://static.swapcard.com/public/images/0b1335a343a64587ac8ad8933964b56c.png"}, {"name": "Bogdan Grigorescu", "org": "Direct Line Group", "photo": "https://static.swapcard.com/public/images/df0f176347f54c1881991d0524589d8c.png"}, {"name": "Lucas Marino", "org": "London Metal Exchange", "photo": "https://static.swapcard.com/public/images/18f505b88585418e928591f1434c030f.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTIyNQ==", "title": "Panel: From the Frontline | Lessons Learned: Rethinking AI Implementation in Finance", "start": "2026-06-11T15:35:00+01:00", "end": "2026-06-11T16:15:00+01:00", "track": "Finance", "description": "• Hear reflections from leaders delivering AI in complex, regulated financial services environments.\n• Understand how initial choices and sequencing strategies shaped long-term outcomes.\n• Learn what experienced teams would prioritise differently — and how to apply those lessons to current AI initiatives.", "speakers": [{"name": "Leon Gauhman", "org": "Elsewhen", "photo": "https://static.swapcard.com/public/images/9b41c3abf37d4839a3e2f5a147b6b4a5.jpeg"}, {"name": "Hira Bashir", "org": "Visionet", "photo": "https://static.swapcard.com/public/images/96cac216eaab4383973b02bda7182d9e.jpeg"}, {"name": "Lisa Weaver-Lambert", "org": "Oxford AI Studio", "photo": "https://static.swapcard.com/public/images/9ff27be3a5854c5294580a3093c74b25.png"}, {"name": "Andrei Serjantov", "org": "BNP Paribas", "photo": "https://static.swapcard.com/public/images/03c8da8209b0427f9faf29cef4468d79.jpeg"}, {"name": "Mari Parry", "org": "BlackRock", "photo": "https://static.swapcard.com/public/images/eec7a2ff4d1049a69ec16caacf0f1819.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTMzMQ==", "title": "Humans in the Loop: Designing Organisations for the AI-Native Workplace", "start": "2026-06-11T15:35:00+01:00", "end": "2026-06-11T16:15:00+01:00", "track": "Next Generation", "description": "• Agentic systems are only one step in a longer shift in how software is built.\n• The next wave will combine autonomy, multimodal inputs, simulation‑first workflows, and new architectures that change how systems reason and act.\n• Hear what leading research, engineering, and innovation teams believe will matter most next, and how enterprises can prepare now.", "speakers": [{"name": "Tamsin Cooper", "org": "Forward Institute", "photo": "https://static.swapcard.com/public/images/88b6c4dbbe584f9ab63794aff76e0266.jpeg"}, {"name": "Jordan Schlipf", "org": "Cowshed", "photo": "https://static.swapcard.com/public/images/b0d904c817c74ba3a4ddacb265757f01.jpeg"}, {"name": "Tom Hewitson", "org": "General Purpose", "photo": "https://static.swapcard.com/public/images/9d504fa23cd94435b29a2d25589648bc.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQ2MDkzMQ==", "title": "Disrupt Yourself or Get Disrupted: The Coming Shakeout in VC", "start": "2026-06-11T16:05:00+01:00", "end": "2026-06-11T16:20:00+01:00", "track": "Impact Arena", "description": "Every industry the audience has disrupted has been rebuilt by founders who treated AI as the substrate, not the seasoning.\nVenture capital is next, and most of the industry hasn't noticed. Drawing on a decade building DIG, InReach's proprietary platform that evaluates thousands of European startups every month, Roberto makes the case that pattern-matching at human scale is no longer a moat but a bottleneck. He'll cover what AI-native VC actually looks like, what surprised him along the way, and why most firms won't survive the transition.", "speakers": [{"name": "Roberto Bonanzinga", "org": "InReach Ventures", "photo": "https://static.swapcard.com/public/images/fbad55e697044e94a2c4c1f67d5b6338.png"}]}, {"id": "UGxhbm5pbmdfNDQzMzA2Nw==", "title": "Chairperson’s Closing Remarks", "start": "2026-06-11T16:10:00+01:00", "end": "2026-06-11T16:15:00+01:00", "track": "Impact Arena", "description": "How major UK retailers are using AI, automation, computer vision, and real‑time analytics to optimise store operations, supply chains, merchandising, and fulfilment. Covers demand forecasting, stock accuracy, waste reduction, labour optimisation, and omnichannel integration — with measurable ROI examples from large‑scale deployments.", "speakers": [{"name": "Nadia Abouayoub", "org": "N/A", "photo": "https://static.swapcard.com/public/images/3e72680574214c9f86c5fb54cb38c814.png"}]}, {"id": "UGxhbm5pbmdfNDQ2MjYxMQ==", "title": "Short Break", "start": "2026-06-11T16:15:00+01:00", "end": "2026-06-11T16:25:00+01:00", "track": "Applied AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzY0NQ==", "title": "Short Break", "start": "2026-06-11T16:15:00+01:00", "end": "2026-06-11T16:25:00+01:00", "track": "Beyond AI at Scale", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzYzMA==", "title": "Short Break", "start": "2026-06-11T16:15:00+01:00", "end": "2026-06-11T16:25:00+01:00", "track": "Creative AI", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ2MjU5NA==", "title": "Short Break", "start": "2026-06-11T16:15:00+01:00", "end": "2026-06-11T16:25:00+01:00", "track": "Data Excellence", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ2MzQzOQ==", "title": "Short Break", "start": "2026-06-11T16:15:00+01:00", "end": "2026-06-11T16:25:00+01:00", "track": "Finance", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ1NzY1OA==", "title": "Short Break", "start": "2026-06-11T16:15:00+01:00", "end": "2026-06-11T16:25:00+01:00", "track": "Next Generation", "description": "", "speakers": [{"name": "", "org": "", "photo": ""}]}, {"id": "UGxhbm5pbmdfNDQ0Mjg0NQ==", "title": "Panel: Looking Sideways | What Industrial Leaders Can Learn from AI Adoption Across Industries", "start": "2026-06-11T16:25:00+01:00", "end": "2026-06-11T17:05:00+01:00", "track": "Applied AI", "description": "A closing conversation that goes beyond industrial use cases to explore transferable AI lessons from sectors like finance, healthcare, and digital-native enterprises. Discover what has successfully scaled in other industries—from operating models and governance to talent, trust, and ROI—and how these patterns can be applied to industrial environments. This session leaves leaders with practical, strategic takeaways—not predictions—highlighting what to borrow, adapt, and avoid when accelerating industrial AI adoption.", "speakers": [{"name": "James Echard", "org": "BAI Group, LLC", "photo": "https://static.swapcard.com/public/images/6a7cf71cb1924cfebd224fbb2ec0b5bb.png"}, {"name": "Carolina Tortora", "org": "NESO", "photo": "https://static.swapcard.com/public/images/a74d87f12d454796aa1b5ee82115e074.jpeg"}, {"name": "Sourav Das", "org": "AP Moller Maersk", "photo": "https://static.swapcard.com/public/images/c5d2156c994c4c4cbe5b2f32f25eac42.png"}, {"name": "Davar Ardalan", "org": "bAI Labs", "photo": "https://static.swapcard.com/public/images/b7356aac08b5442d9b1546f94f9e7a09.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTIzNg==", "title": "Safe Autonomy: Governance, Controls & Real Time Assurance", "start": "2026-06-11T16:25:00+01:00", "end": "2026-06-11T16:50:00+01:00", "track": "Beyond AI at Scale", "description": "• Learn how organisations establish real-time oversight and assurance for autonomous AI to ensure systems behave predictably, transparently, and within operating boundaries.\n• Understand controls, audit trails, and human-in-the-loop and override mechanisms that reduce operational, compliance, and reputational risks in autonomous workflows. Explore frameworks that help leaders decide where autonomy is safe, where human supervision is essential, and how to align risk appetite with levels of autonomy.\n• Discover how to clarify board-level accountability, executive liability, and ownership when autonomous systems fail or require escalation.", "speakers": [{"name": "Jeff Valane", "org": "HSBC", "photo": "https://static.swapcard.com/public/images/66bd2350c3864b19a4b9e665dd2a351d.jpeg"}, {"name": "Sue Turner", "org": "AI Governance Limited", "photo": "https://static.swapcard.com/public/images/6115abc791034896a3b3498467abbf4a.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTEwNA==", "title": "Fireside Chat: Sustainable Future Fashion Powered by AI", "start": "2026-06-11T16:25:00+01:00", "end": "2026-06-11T16:50:00+01:00", "track": "Creative AI", "description": "• Explore how AI accelerates sustainable innovation in beauty and fashion, from real-time 3D prototyping and virtual sampling to AI-driven formulation testing, reducing waste in product creation and packaging.\n• See how digital twins, AI-powered fit tech, skin-tone and skin-health analysis, and virtual try-ons help consumers make eco-conscious choices, cutting returns, overproduction, and product trials. Learn how AI enhances supply chain transparency for textiles and ingredients, supporting ethical sourcing, cleaner formulations, circular fashion, and refillable beauty systems—creating more resilient industries.\n• Examine emerging IP issues at the intersection of physical and digital beauty and fashion: Who owns virtual garments, AI-generated textures, synthetic models, digital makeup, and algorithm-created formulations? How can brands develop defensible IP in hybrid environments?", "speakers": [{"name": "Juliana Ferraz Varela", "org": "Skin+Me", "photo": "https://static.swapcard.com/public/images/561b120e17764f22be42c943d2ff3889.jpeg"}, {"name": "Maggie Mattioni", "org": "Maggie Mattioni Design Studio", "photo": "https://static.swapcard.com/public/images/6e659f65d87c42cb9265f2653edd91d8.jpeg"}, {"name": "Emma Thompson", "org": "Norwich University of the Arts", "photo": "https://static.swapcard.com/public/images/99733eb112b242978c7e3a590936876b.jpeg"}]}, {"id": "UGxhbm5pbmdfNDQxOTI1NQ==", "title": "Closing Fireside Chat: Reflect | What We’d Do Differently Now", "start": "2026-06-11T16:25:00+01:00", "end": "2026-06-11T16:50:00+01:00", "track": "Data Excellence", "description": "• Reflect on the key lessons learned from deploying AI systems in production, shared by teams who’ve navigated the challenges of scaling AI. Explore what teams would prioritise earlier to avoid pitfalls and accelerate success.\n• Identify patterns and principles that consistently held true across systems, industries, and scales.\n• Tie together insights from the two days of the Data Excellence stage, highlighting recurring themes, actionable strategies, and principles worth carrying forward. Leave with a clear understanding of how to apply these lessons to your own AI initiatives, ensuring long-term success and impact.", "speakers": [{"name": "Georgiana Marsic", "org": "AI You Can Trust", "photo": "https://static.swapcard.com/public/images/17afa36d0e9742278cb1d05e52776aee.png"}, {"name": "Bogdan Vrusias", "org": "The Economist", "photo": "https://static.swapcard.com/public/images/ea52d48adf7744098bfed16e9f0ad982.jpeg"}, {"name": "Emma Russell", "org": "Oxford Comma Digital", "photo": "https://static.swapcard.com/public/images/4bda936ed1624b75b456ba31725adfb2.png"}]}, {"id": "UGxhbm5pbmdfNDQxOTI0Mg==", "title": "Closing Fireside Chat | Making Sense of the AI Journey in Financial Services", "start": "2026-06-11T16:25:00+01:00", "end": "2026-06-11T16:50:00+01:00", "track": "Finance", "description": "• Engage in a reflective discussion with senior AI leaders from banking and insurance to summarise the day’s insights.\n• Explore patterns, tensions, and trade-offs across v const rh = document.getElementById('rh');

const RMN=200, RMX=750;

function startResize(clientX) {
  if (!panelOpen) return;
  resizing=true; rx0=clientX; rw0=panel.offsetWidth;
  rh.classList.add('drag'); document.body.classList.add('sizing');
}
function doResize(clientX) {
  if (!resizing) return;
  const w = Math.min(RMX, Math.max(RMN, rw0+(rx0-clientX)));
  panel.style.width = w+'px'; panel.style.transition='none';
}
function endResize() {
  if (!resizing) return;
  resizing=false; rh.classList.remove('drag'); document.body.classList.remove('sizing');
  panel.style.transition='';
}
rh.addEventListener('mousedown', e=>{ startResize(e.clientX); e.preventDefault(); });
document.addEventListener('mousemove', e=>doResize(e.clientX));
document.addEventListener('mouseup', endResize);
rh.addEventListener('touchstart', e=>startResize(e.touches[0].clientX), {passive:true});
document.addEventListener('touchmove', e=>{ if(resizing) doResize(e.touches[0].clientX); }, {passive:true});
document.addEventListener('touchend', endResize);

// ─── OVERLAP HELPERS ─────────────────────────────────────────
function ov(a,b) { return new Date(a.start)<new Date(b.end) && new Date(b.start)<new Date(a.end); }

function cluster(items) {
  const vis=new Set(), out=[];
  for(let i=0;i<items.length;i++){
    if(vis.has(i))continue;
    const cl=[items[i]]; vis.add(i);
    let ch=true;
    while(ch){ ch=false; for(let j=0;j<items.length;j++){ if(vis.has(j))continue; if(cl.some(c=>ov(c,items[j]))){ cl.push(items[j]); vis.add(j); ch=true; } } }
    out.push(cl);
  }
  return out;
}

function assignCols(sessions) {
  const sorted=[...sessions].sort((a,b)=>+new Date(a.start)-+new Date(b.start));
  const cols=[];
  sorted.forEach(s=>{
    let c=0;
    while(cols.filter(x=>x.c===c).some(x=>ov(x.s,s))) c++;
    cols.push({s,c});
  });
  return cols;
}

function ovRanges(sessions) {
  const raw=[];
  for(let i=0;i<sessions.length;i++) for(let j=i+1;j<sessions.length;j++){
    const a=sessions[i],b=sessions[j];
    const os=Math.max(+new Date(a.start),+new Date(b.start));
    const oe=Math.min(+new Date(a.end),  +new Date(b.end));
    if(os<oe) raw.push([os,oe]);
  }
  raw.sort((a,b)=>a[0]-b[0]);
  const mg=[];
  raw.forEach(r=>{ if(mg.length&&r[0]<=mg[mg.length-1][1]) mg[mg.length-1][1]=Math.max(mg[mg.length-1][1],r[1]); else mg.push([...r]); });
  return mg;
}

// ─── AGENDA REBUILD ──────────────────────────────────────────
function rebuildAgenda() {
  const scroll = document.getElementById('agScroll');
  const empty  = document.getElementById('agEmpty');
  const foot   = document.getElementById('agFoot');
  const bdg    = document.getElementById('badge');
  const n = agenda.size;

  bdg.textContent=n; bdg.classList.toggle('on',n>0);
  foot.textContent = n===0?'0 sessions saved':`${n} session${n>1?'s':''} saved`;

  scroll.querySelectorAll('.ag-day-sec').forEach(e=>e.remove());

  if(n===0){ empty.style.display='block'; return; }
  empty.style.display='none';

  const items=[...agenda].map(id=>SESSIONS.find(s=>s.id===id)).filter(Boolean)
    .sort((a,b)=>+new Date(a.start)-+new Date(b.start));

  const byDay={};
  items.forEach(s=>{ const d=s.start.slice(0,10); (byDay[d]=byDay[d]||[]).push(s); });

  Object.keys(byDay).sort().forEach(d=>{
    const dayItems=byDay[d];
    const sec=document.createElement('div');
    sec.className='ag-day-sec';

    const hdr=document.createElement('div');
    hdr.className='ag-day-hdr';
    hdr.textContent=d==='2026-06-10'?'Wednesday 10 June':'Thursday 11 June';
    sec.appendChild(hdr);

    // Time bounds — only from saved sessions this day
    let minT=new Date(Math.min(...dayItems.map(s=>+new Date(s.start))));
    let maxT=new Date(Math.max(...dayItems.map(s=>+new Date(s.end))));
    minT=new Date(+minT-10*60000);
    maxT=new Date(+maxT+10*60000);
    minT.setMinutes(Math.floor(minT.getMinutes()/15)*15,0,0);
    maxT.setMinutes(Math.ceil(maxT.getMinutes()/15)*15,0,0);
    const totMins=(+maxT-+minT)/60000;
    const totH=totMins*APPM;

    // Wrapper
    const tl=document.createElement('div');
    tl.className='ag-tl';

    // ── Time column ──
    const tcol=document.createElement('div');
    tcol.className='ag-tcol';
    tcol.style.height=(totH+24)+'px';
    for(let m=0;m<=totMins;m+=15){
      const t=new Date(+minT+m*60000);
      if(t.getMinutes()!==0&&t.getMinutes()!==30) continue;
      const tick=document.createElement('div');
      tick.className='ag-tick';
      tick.style.top=(m*APPM+8)+'px';
      tick.textContent=fmt(t);
      tcol.appendChild(tick);
    }
    tl.appendChild(tcol);

    // ── Grid column ──
    const gcol=document.createElement('div');
    gcol.className='ag-gcol';
    gcol.style.height=(totH+24)+'px';
    gcol.style.position='relative'; // ensure absolutely positioned children work

    // Hour lines
    for(let m=0;m<=totMins;m+=15){
      const t=new Date(+minT+m*60000);
      const heavy=t.getMinutes()===0;
      const ln=document.createElement('div');
      ln.className='ag-hline';
      ln.style.top=(m*APPM+8)+'px';
      ln.style.borderTop=heavy?'1px solid rgba(255,255,255,0.07)':'1px solid rgba(255,255,255,0.025)';
      gcol.appendChild(ln);
    }

    // Cluster and layout sessions
    const clusters=cluster(dayItems);
    clusters.forEach(cl=>{
      if(cl.length===1){
        const blk=makeAgBlk(cl[0],minT,0,1);
        gcol.appendChild(blk);
      } else {
        // Overlap stripes
        ovRanges(cl).forEach(([os,oe])=>{
          const topPx=((os-+minT)/60000)*APPM+8;
          const hPx=((oe-os)/60000)*APPM;

          const stripe=document.createElement('div');
          stripe.className='ag-ovl-stripe';
          stripe.style.top=topPx+'px';
          stripe.style.height=hPx+'px';
          gcol.appendChild(stripe);

          const pill=document.createElement('div');
          pill.className='ag-ovl-pill';
          pill.style.top=(topPx+Math.max(0,hPx/2-8))+'px';
          pill.textContent='⚠ conflict';
          gcol.appendChild(pill);
        });

        // Side-by-side blocks
        const colAssign=assignCols(cl);
        const numC=Math.max(...colAssign.map(x=>x.c))+1;
        colAssign.forEach(({s,c})=>{
          const blk=makeAgBlk(s,minT,c,numC);
          if(numC>1 && c===0) blk.classList.add('conflict-first');
          if(numC>1 && c>0)  blk.classList.add('conflict');
          gcol.appendChild(blk);
        });
      }
    });

    tl.appendChild(gcol);
    sec.appendChild(tl);
    scroll.appendChild(sec);
  });
}

function makeAgBlk(s, minT, colIdx, numCols) {
  const color=TC[s.track]||{bg:'linear-gradient(135deg,#333,#111)',bd:'#888'};
  const st=new Date(s.start), en=new Date(s.end);
  const topPx=((+st-+minT)/60000)*APPM+8;
  const hPx=Math.max(((+en-+st)/60000)*APPM-2, 20);

  const GAP=3;
  const lPct=(colIdx/numCols)*100;
  const wPct=(1/numCols)*100;
  const lExtra=colIdx>0?GAP:0;
  const wShrink=(colIdx>0?GAP:0)+(colIdx<numCols-1?GAP:0);

  const blk=document.createElement('div');
  blk.className='ag-blk';
  blk.style.top=topPx+'px';
  blk.style.height=hPx+'px';
  blk.style.left='calc('+lPct+'% + '+lExtra+'px)';
  blk.style.width='calc('+wPct+'% - '+wShrink+'px)';
  blk.style.background=color.bg;
  blk.onclick=()=>showModal(s.id);

  const hasSpk=s.speakers.some(sp=>sp.name&&sp.name.trim());
  let spkH='';
  if(hasSpk&&hPx>58){
    spkH='<div class="ag-blk-spks">';
    s.speakers.slice(0,hPx>90?2:1).forEach(sp=>{
      if(!sp.name)return;
      spkH+=`<div class="ag-blk-spk">${sp.photo?`<img class="ag-blk-av" src="${sp.photo}" onerror="this.style.display='none'" loading="lazy">`:''}
        <span class="ag-blk-nm">${sp.name}</span></div>`;
    });
    spkH+='</div>';
  }

  const safeId=s.id.replace(/'/g,"\'");
  blk.innerHTML=`
    <div class="ag-blk-track">${s.track}</div>
    <div class="ag-blk-title">${s.title.replace(/</g,'&lt;')}</div>
    ${hPx>36?`<div class="ag-blk-time">${fmt(st)} – ${fmt(en)}</div>`:''}
    ${spkH}
    <button class="ag-rm" onclick="event.stopPropagation();remSess('${safeId}')">✕</button>
  `;
  return blk;
}

function getDayBounds(d){
  const ss=SESSIONS.filter(s=>s.start.startsWith(d));
  let mn=new Date(Math.min(...ss.map(s=>+new Date(s.start))));
  let mx=new Date(Math.max(...ss.map(s=>+new Date(s.end))));
  mn.setMinutes(Math.floor(mn.getMinutes()/15)*15,0,0);
  mx.setMinutes(Math.ceil(mx.getMinutes()/15)*15,0,0);
  return{mn,mx};
}

  const totM=(+mx-+mn)/60000;
  const totH=totM*PPM;
  const tracks=TRACK_ORDER.filter(t=>!hidden.has(t)&&SESSIONS.some(s=>s.start.startsWith(day)&&s.track===t));

    <div style="position:relative;height:${totH}px;">`;
  for(let m=0;m<=totM;m+=15){
    const t=new Date(+mn+m*60000);

      font-family:'JetBrains Mono',monospace;font-weight:500;
      display:flex;align-items:flex-start;justify-content:flex-end;padding:2px 5px 0 0;">
      ${lbl}</div>`;
  }
  tcH+=`</div></div>`;

  let trH='';
  tracks.forEach(track=>{
    const col=TC[track]||{bg:'linear-gradient(135deg,#333,#111)',bd:'#888'};
    const ts=daySess.filter(s=>s.track===track);
    let body=`<div style="position:relative;height:${totH}px;">`;
    for(let m=0;m<=totM;m+=60) body+=`<div class="hline" style="top:${m*PPM}px;"></div>`;
    ts.forEach(s=>{
      const st=new Date(s.start),en=new Date(s.end);
      const top=((+st-+mn)/60000)*PPM;
      const h=Math.max(((+en-+st)/60000)*PPM-4,18);
      const brk=isBreak(s.title);
      const ina=agenda.has(s.id);
      let spk='';
      const hasSpk=s.speakers.some(sp=>sp.name&&sp.name.trim());
      if(hasSpk&&h>55){
        spk='<div class="sb-spks">';
        s.speakers.slice(0,h>95?2:1).forEach(sp=>{
          if(!sp.name)return;
          spk+=`<div class="sb-spk">${sp.photo?`<img class="sb-av" src="${sp.photo}" onerror="this.style.display='none'" loading="lazy">`:''}
            <span class="sb-nm">${sp.name}</span></div>`;
        });
        spk+='</div>';
      }
      const safe=s.title.replace(/"/g,'&quot;').replace(/</g,'&lt;');
      const sid=s.id.replace(/['"]/g,'');
      if(!brk){
        body+=`<div class="sb${ina?' in-ag':''}" data-id="${sid}"
          style="top:${top}px;height:${h}px;left:3px;right:3px;background:${col.bg};"
          onclick="showModal('${sid}')" title="${safe}">
          <div class="sb-title">${safe}</div>
          ${h>34?`<div class="sb-time">${fmt(st)} – ${fmt(en)}</div>`:''}
          ${spk}
        </div>`;
      } else {
        body+=`<div class="sb brk" style="top:${top}px;height:${h}px;left:3px;right:3px;background:rgba(255,255,255,0.03);">
          <div class="sb-title" style="opacity:0.38;">${safe}</div>
        </div>`;
      }
    });
    body+='</div>';
    trH+=`<div style="width:220px;border-right:1px solid var(--bd);flex-shrink:0;">
      <div style="position:sticky;top:0;height:50px;z-index:40;display:flex;align-items:center;
        justify-content:center;padding:0 8px;border-bottom:1px solid var(--bd);
        font-size:9.5px;font-weight:800;text-align:center;letter-spacing:0.5px;
        text-transform:uppercase;line-height:1.3;background:${col.bg};color:#fff;">
        ${track}</div>${body}</div>`;
  });

  gw.innerHTML=`<div style="display:flex;min-width:max-content;">${tcH}${trH}</div>`;
}

// ─── MODAL ───────────────────────────────────────────────────
function updModalBtn(id){
  const b=document.getElementById('mAgBtn'); if(!b)return;
  const a=agenda.has(id);
  b.className='modal-ag-btn'+(a?' added':'');
  b.textContent=a?'✓ In Agenda — Click to Remove':'+ Add to Agenda';
}

function showModal(id){
  const s=SESSIONS.find(x=>x.id===id); if(!s)return;
  const col=TC[s.track]||{bd:'#888'};
  const st=new Date(s.start),en=new Date(s.end);
  const hasSp=s.speakers.some(sp=>sp.name&&sp.name.trim());
  let spkH='';
  if(hasSp){
    spkH=`<div class="modal-spks-lbl">Speakers</div><div class="modal-spks">`;
    s.speakers.forEach(sp=>{
      if(!sp.name)return;
      spkH+=`<div class="modal-spk">
        ${sp.photo?`<img class="modal-spk-av" src="${sp.photo}" onerror="this.style.background='#1d1f2e'" loading="lazy">`
          :`<div class="modal-spk-av" style="background:#1d1f2e;display:flex;align-items:center;justify-content:center;font-size:14px;">👤</div>`}
        <div><div class="modal-spk-nm">${sp.name}</div>${sp.org?`<div class="modal-spk-org">${sp.org}</div>`:''}</div>
      </div>`;
    });
    spkH+=`</div>`;
  }
  const added=agenda.has(id);
  const sid=id.replace(/['"]/g,'');
  document.getElementById('modalBody').innerHTML=`
    <div class="modal-badge" style="background:${col.bd}20;color:${col.bd};border:1px solid ${col.bd}40;">${s.track}</div>
    <div class="modal-title">${s.title}</div>
    <div class="modal-time">
      <span>${fmt(st)} – ${fmt(en)}</span>
      <span>${st.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',timeZone:'Europe/London'})}</span>
    </div>
    <button id="mAgBtn" data-id="${sid}" class="modal-ag-btn${added?' added':''}"
      onclick="togSess('${sid}');updModalBtn('${sid}')">
      ${added?'✓ In Agenda — Click to Remove':'+ Add to Agenda'}
    </button>
    ${s.description?`<div class="modal-desc">${s.description.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>`:''}
    ${spkH}`;
  document.getElementById('modalBg').classList.add('on');
}

function closeMBg(e){if(e.target===document.getElementById('modalBg'))closeM();}
function closeM(){document.getElementById('modalBg').classList.remove('on');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});

// ─── UTILS ───────────────────────────────────────────────────
function fmt(d){return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'});}
function isBreak(t){const l=t.toLowerCase();return l.includes('break')||l.includes('lunch');}

let tt;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),1900);
}

// ─── INIT ────────────────────────────────────────────────────
renderGrid();
rebuildAgenda();
</script>
</body>
</html>
